# ─────────────────────────────────────────────────────────────────────
# yaml2excel.yaml — Excel export settings for test plan YAML files
# ─────────────────────────────────────────────────────────────────────
# Controls which columns appear in the exported Excel workbook.
# Used by: python tools/yaml2excel.py <input.yaml>
# ─────────────────────────────────────────────────────────────────────

# Create one sheet per test category?
sheetPerCategory: true

# Sheet ordering
categoryOrder:
  - functional
  - boundary
  - negative
  - performance
  - scale

# ── Excel Columns ───────────────────────────────────────────────────
# Each column maps to a field from the generated YAML test case.
# Set `include: false` to hide a column without deleting it.
#
# Available fields:
#   testCaseID, featureName, type, priority, automation, description,
#   scopeType, targetType, deploymentMethod, isDeploymentTest,
#   title (shortened description), precondition (static text),
#   stepDescription (formatted test steps), stepPayload (request bodies),
#   stepExpectedResult (validations from steps)

columns:

  - name: testCaseID
    header: "Test Case ID"
    width: 16

  - name: title
    header: "Testcase Title"
    width: 50

  - name: featureName
    header: "Feature Name"
    width: 25

  - name: status
    header: "Status"
    width: 18
    fixedValue: "To Be Automated"

  - name: type
    header: "Type"
    width: 14

  - name: priority
    header: "Priority"
    width: 10

  - name: automation
    header: "Automation"
    width: 18
    default: "Automatable"

  - name: description
    header: "Description"
    width: 60

  - name: precondition
    header: "Precondition"
    width: 50
    fixedValue: "QA environment available with EP1-NGC Framework integration"

  - name: stepDescription
    header: "Test Step Description"
    width: 80

  - name: stepPayload
    header: "Test Step Payload"
    width: 60

  - name: stepExpectedResult
    header: "Test Step Expected Result"
    width: 60

# ── Header Styling ──────────────────────────────────────────────────
headerStyle:
  bold: true
  fontSize: 11
  fontColor: "FFFFFF"
  fillColor: "4472C4"
