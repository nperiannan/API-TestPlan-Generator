featurePath: /configuration-profile/{name}/sites/deploy
profileType: configuration
test:
    testCaseID: TCXM_1002
    featureName: radio-profile-config
    priority: P0
    type: functional
    description: Create radio-profile-config, scope to device, target to device, deploy, and verify on NOS devices
    scopeType: device
    targetType: device
    deploymentMethod: immediate
    isDeploymentTest: true
    steps:
        - name: createradio-profile-config
          description: Create radio-profile-config configuration
          method: POST
          api: REST
          path: /configuration-profile/{name}/feature/object/override/retrieve
          body:
            asset-device-id: testValue
            name: TestProfile
          expectedStatus: 201
          validations:
            - type: statusCode
              expected: 201
        - name: scopeProfileTodevice
          description: Scope profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/scope
          pathParams:
            profileName: TestProfile
          body:
            scopeId: test-scope-001
            scopeType: device
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: targetProfileTodevice
          description: Target profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/target
          pathParams:
            profileName: TestProfile
          body:
            targetId: test-scope-001
            targetType: device
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: deployProfileTodevice
          description: Deploy profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/deploy
          pathParams:
            profileName: TestProfile
          body:
            deploymentMethod: immediate
          expectedStatus: 202
          validations:
            - type: statusCode
              expected: 202
        - name: checkDeploymentStatus
          description: Verify deployment status
          method: GET
          api: REST
          path: /global-profile/TestProfile/deployment/status
          pathParams:
            profileName: TestProfile
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
            - type: jsonPathEquals
              path: $.status
              expected: SUCCESS
          timeout: 300
