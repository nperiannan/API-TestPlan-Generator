featurePath: /infrastructure-feature/snmp-feature
profileType: configuration
test:
    testCaseID: TCXM_1006
    featureName: snmp-v3-access-config
    priority: P0
    type: functional
    description: Create snmp-v3-access-config, scope to device, target to device, deploy, and verify on NOS devices
    scopeType: device
    targetType: device
    deploymentMethod: immediate
    isDeploymentTest: true
    steps:
        - name: createsnmp-v3-access-config
          description: Create snmp-v3-access-config configuration
          method: POST
          api: REST
          path: /configuration-profile/{name}/feature/object/modify
          body:
            featurePath: /infrastructure-feature/snmp-feature
            name: TestProfile
            objectType: snmp-v3-access-config
            objects:
                - operation: add
                  properties:
                    - name: priority
                      origin: CC
                      type: number
                      value: 1
                    - name: username
                      origin: CC
                      type: string
                      value: test-resource
                    - name: access-level
                      origin: CC
                      type: string
                      value: testValue
                    - name: security-level
                      origin: CC
                      type: string
                      value: testValue
                  type: snmp-v3-access-config
            operation: add
          expectedStatus: 201
          validations:
            - type: statusCode
              expected: 201
        - name: getProfile
          description: Retrieve created profile
          method: POST
          api: REST
          path: /configuration-profile/{name}/feature/object/retrieve
          pathParams:
            profileName: TestProfile
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: scopeProfileTodevice
          description: Scope profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/scope
          pathParams:
            profileName: TestProfile
          body:
            scopeId: test-scope-001
            scopeType: device
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: targetProfileTodevice
          description: Target profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/target
          pathParams:
            profileName: TestProfile
          body:
            targetId: test-scope-001
            targetType: device
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: deployProfileTodevice
          description: Deploy profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/deploy
          pathParams:
            profileName: TestProfile
          body:
            deploymentMethod: immediate
          expectedStatus: 202
          validations:
            - type: statusCode
              expected: 202
        - name: checkDeploymentStatus
          description: Verify deployment status
          method: GET
          api: REST
          path: /global-profile/TestProfile/deployment/status
          pathParams:
            profileName: TestProfile
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
            - type: jsonPathEquals
              path: $.status
              expected: SUCCESS
          timeout: 300
