featurePath: /configuration-profile/{name}/target
profileType: configuration
test:
    testCaseID: TCXM_1000
    featureName: management-profile
    priority: P0
    type: functional
    description: Create management-profile and schedule deployment to device
    scopeType: device
    targetType: device
    deploymentMethod: scheduled
    isDeploymentTest: true
    steps:
        - name: createmanagement-profile
          description: Create management-profile configuration
          method: POST
          api: REST
          path: /global-profile/feature/object/modify
          body:
            featurePath: /configuration-profile/{name}/target-query/profile
            name: TestProfile-Additional
            objectType: management-profile
            objects:
                - operation: add
                  properties:
                    - name: hostname
                      origin: Global
                      type: string
                      value: test-hostname
                  type: management-profile
            operation: add
          expectedStatus: 201
          validations:
            - type: statusCode
              expected: "201"
        - name: scheduleDeploymentTodevice
          description: Schedule deployment to device at 2026-04-21T15:40:24Z
          method: POST
          api: REST
          path: /configuration-profile/TestProfile-Additional/devices/deploy
          pathParams:
            name: TestProfile-Additional
          body:
            deployAt: "2026-04-21T15:40:24Z"
            devices:
                - test-device-001
            timezone: UTC
          expectedStatus: 202
          validations:
            - type: statusCode
              expected: "202"
