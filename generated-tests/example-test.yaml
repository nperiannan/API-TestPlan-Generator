featurePath: /wlan-feature
profileType: configuration
test:
    testCaseID: TCXM_1006
    featureName: wlan
    priority: P0
    type: functional
    description: Create wlan, scope to device, target to device, deploy, and verify on NOS devices
    scopeType: device
    targetType: device
    deploymentMethod: immediate
    isDeploymentTest: true
    steps:
        - name: createwlan
          description: Create wlan configuration
          method: POST
          api: REST
          path: /configuration-profile/{name}/feature/object/modify
          body:
            featurePath: /wlan-feature
            name: TestProfile
            objectType: wlan
            objects:
                - operation: add
                  properties:
                    - name: ssid
                      origin: CC
                      type: string
                      value: testValue
                    - name: security-type
                      origin: CC
                      type: string
                      value: testValue
                  type: wlan
            operation: add
          expectedStatus: 201
          validations:
            - type: statusCode
              expected: 201
        - name: getProfile
          description: Retrieve created profile
          method: POST
          api: REST
          path: /configuration-profile/{name}/feature/object/retrieve
          pathParams:
            profileName: TestProfile
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: scopeProfileTodevice
          description: Scope profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/scope
          pathParams:
            profileName: TestProfile
          body:
            scopeId: test-scope-001
            scopeType: device
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: targetProfileTodevice
          description: Target profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/target
          pathParams:
            profileName: TestProfile
          body:
            targetId: test-scope-001
            targetType: device
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
        - name: deployProfileTodevice
          description: Deploy profile to device
          method: POST
          api: REST
          path: /global-profile/TestProfile/deploy
          pathParams:
            profileName: TestProfile
          body:
            deploymentMethod: immediate
          expectedStatus: 202
          validations:
            - type: statusCode
              expected: 202
        - name: checkDeploymentStatus
          description: Verify deployment status
          method: GET
          api: REST
          path: /global-profile/TestProfile/deployment/status
          pathParams:
            profileName: TestProfile
          expectedStatus: 200
          validations:
            - type: statusCode
              expected: 200
            - type: jsonPathEquals
              path: $.status
              expected: SUCCESS
          timeout: 300
