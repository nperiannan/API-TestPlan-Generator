                  expectedStatus: 200
                  validations:
                    - Verify HTTP status code is 200
                    - Verify '$.results[0].status' equals success
                    - numberOfConflictsResolved > 0
                  assertions:
                    - type: statusCode
                      expected: 200
                    - type: jsonPathEquals
                      path: $.results[0].status
                      expected: success
                    - type: jsonPathExists
                      path: $.summary.numberOfConflictsResolved
                      description: numberOfConflictsResolved > 0
                - name: redeployAfterCCResolution
                  description: Re-deploy profile to push cloud value back to device
                  method: POST
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictCC/devices/deploy
                  pathParams:
                    name: TestProfile-Additional-ConflictCC
                  body:
                    deployNow: true
                    devices:
