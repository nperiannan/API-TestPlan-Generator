          isDeploymentTest: false
          steps:
            - name: resolveNoConflicts
              method: POST
              api: REST
              path: /configuration-profile/device/conflict/resolve
              body:
                deviceResolutions:
                  - deviceId: "device-with-zero-conflicts-uuid"
                    resolution: "acceptCloud"
              expectedStatus: 404
              validations:
                - type: statusCode
                  expected: 404
                - type: jsonPathEquals
                  path: $.results[0].status
                  expected: "failed"

        - testCaseID: TC-CONFLICT-N-007
          featureName: device-conflict
          priority: P2
          type: negative
