            - testCaseID: TCXM_7305
              featureName: managed-profile
              priority: P2
              automation: Automatable
              type: functional
              description: '[Conflict Detection] Deploy managed-profile, simulate out-of-band device change via NOSAPI (deviceValue ≠ previousDeployedValue), verify conflict detected via GET /conflicts'
              isDeploymentTest: true
              steps:
                - name: createmanaged-profile
                  description: Create managed-profile configuration
                  method: POST
                  api: REST
                  path: /global-profile/feature/object/modify
                  body:
                    featurePath: /global-profile
                    name: TestProfile-Additional-ConflictDetect
                    objectType: managed-profile
                    objects:
                        - operation: add
                          properties:
                            - name: hostname
                              origin: Global
                              type: string
                              value: test-hostname
                          type: managed-profile
                    operation: add
                  expectedStatus: 201
                  validations:
                    - type: statusCode
                      expected: "201"
                - name: initialDeploy
                  description: Deploy to device — establishes previousDeployedValue baseline
                  method: POST
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictDetect/devices/deploy
                  pathParams:
                    name: TestProfile-Additional-ConflictDetect
                  body:
                    deployNow: true
                    devices:
                        - test-device-001
                  expectedStatus: 202
                  validations:
                    - type: statusCode
                      expected: 202
                - name: checkInitialDeployStatus
                  description: Verify initial deployment completed successfully
                  method: GET
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictDetect/device/test-device-001/deploy/status
                  pathParams:
                    hostName: test-device-001
                    name: TestProfile-Additional-ConflictDetect
                  expectedStatus: 200
                  validations:
                    - type: statusCode
                      expected: 200
                    - type: jsonPathEquals
                      path: $.status
                      expected: SUCCESS
                  timeout: 300
                - name: simulateOutOfBandChange
                  description: Apply conflicting managed-profile value directly on device via NOSAPI — simulates out-of-band change so deviceValue diverges from previousDeployedValue
                  method: POST
                  api: NOSAPI
                  path: /v0/configuration/device
                  body:
                    action: modify
                    deviceId: test-device-001
                    feature: managed-profile
                  expectedStatus: 200
                  validations:
                    - type: statusCode
                      expected: 200
                - name: getConflicts
                  description: GET conflicts for this device — expect hasConflicts=true because device was changed out-of-band
                  method: GET
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictDetect/device/test-device-001/conflicts
                  pathParams:
                    hostName: test-device-001
                    name: TestProfile-Additional-ConflictDetect
                  queryParams:
                    detailLevel: detailed
                  expectedStatus: 200
                  validations:
                    - type: statusCode
                      expected: 200
                    - type: jsonPathEquals
                      path: $.hasConflicts
                      expected: true
                    - type: jsonPathExists
                      path: $.features[0].featurePath
                      description: Conflicting feature path is reported
            - testCaseID: TCXM_7306
              featureName: managed-profile
              priority: P1
              automation: Automatable
              type: functional
              description: '[Conflict Resolution CC] managed-profile: detect conflict → resolve acceptCloud (cloud wins) → re-deploy → verify cleared'
              isDeploymentTest: true
              steps:
                - name: createmanaged-profile
                  description: Create managed-profile configuration
                  method: POST
                  api: REST
                  path: /global-profile/feature/object/modify
                  body:
                    featurePath: /global-profile
                    name: TestProfile-Additional-ConflictCC
                    objectType: managed-profile
                    objects:
                        - operation: add
                          properties:
