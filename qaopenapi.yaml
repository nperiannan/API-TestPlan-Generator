        series:
          type: string
          example: "5520"
        portCount:
          type: integer
        supportedPortTypes:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        supportedFeatures:
          type: array
          description: Feature paths supported by this model
          items:
            type: string

    InventoryPortTypesResponse:
      type: object
      description: Response containing port types
      properties:
        portTypes:
          type: array
          items:
            $ref: '#/components/schemas/PortTypeInfo'

    PortType:
