        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectsRequest'
            examples:
              # =====================================================
              # CONFIG PROFILE - DELETE EXAMPLES
              # =====================================================
              deleteAllPortConfigs:
                summary: Delete all port configurations
                description: Remove all port configuration objects from the profile
                value:
                  featurePath: "/network-feature/interface-feature/port-feature"
              
              deleteSinglePort:
                summary: Delete a specific port configuration
                description: Remove a single port configuration by ID
                value:
                  objectIds:
                    - "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              
              deleteMultiplePorts:
                summary: Delete multiple port configurations
                description: Remove multiple port configurations in a single request
                value:
                  objectIds:
                    - "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    - "b2c3d4e5-f678-9012-bcde-f23456789012"
                    - "c3d4e5f6-7890-1234-cdef-345678901234"
              
              deleteAllISISConfigs:
                summary: Delete all IS-IS configurations
                description: Remove all IS-IS configuration objects
                value:
                  featurePath: "/network-feature/fabric-feature/isis-feature"
              
              deleteSpecificSPBMConfig:
                summary: Delete specific SPBM configuration
                value:
                  objectIds:
                    - "d4e5f678-9012-3456-defg-456789012345"
      responses:
        '200':
          description: Objects deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAPIResponseArray'
              examples:
                deleteSuccess:
                  summary: Ports deleted successfully
                  value:
                    - objectId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                    - objectId: "b2c3d4e5-f678-9012-bcde-f23456789012"
                      status: "success"
                deletePartialFailure:
                  summary: Partial deletion failure
                  value:
                    - objectId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                    - objectId: "nonexistent-id"
                      status: "failed"
                      error:
                        code: 404
                        message: "Object not found"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
        '404':
          description: Objects not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

