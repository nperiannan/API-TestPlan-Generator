  /service-profile/{name}/feature/object/retrieve:
    post:
      operationId: getServiceProfileObjects
      tags:
        - ServiceProfiles
      summary: Retrieve objects from service profile
      description: |
        Retrieves all or specific objects within a feature of a service profile.
        
        **Service Profile Features (from extreme-service-profile-blueprint.yang):**
        - `/l2-service-feature` - VLAN configuration (uses extreme-intent-vlan.yang)
        - `/vrf-feature` - Virtual Routing and Forwarding
        - `/router-group-feature` - Router group configuration
        - `/global-feature` - Advanced/Global settings
      parameters:
        - name: name
          in: path
          required: true
          description: Service profile name
          schema:
            type: string
          example: "Corporate-Service-Profile"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveObjectsRequest'
            examples:
              # =====================================================
              # SERVICE PROFILE VLAN - RETRIEVE EXAMPLES
              # =====================================================
              retrieveAllVLANs:
                summary: Retrieve all VLANs from Service Profile
                description: Get all VLAN objects under the l2-service-feature
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
              
              retrieveVLANWithPagination:
                summary: Retrieve VLANs with pagination
                description: Get VLANs with page size and offset
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  paginationQuery:
                    pageSize: 10
                    pageNumber: 1
              
              retrieveSpecificVLANById:
                summary: Retrieve specific VLAN by ID
                description: Get a specific VLAN object by its UUID
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  objectIds:
                    - "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              
              retrieveVRFObjects:
                summary: Retrieve VRF objects
                description: Get Virtual Routing and Forwarding configurations
                value:
                  featurePath: "/vrf-feature"
                  objectType: "vrf"
      responses:
        '200':
          description: Objects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveObjectsResponse'
              examples:
                vlanRetrieveResponse:
                  summary: VLAN retrieve response
                  value:
                    objects:
                      - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        type: "vlan"
                        featurePath: "/l2-service-feature/vlan"
                        properties:
                          - name: "name"
                            value: "Data-VLAN-100"
                            type: "string"
                          - name: "vlan-id-value"
                            value: 100
                            type: "number"
                          - name: "vlan-type"
                            value: "vlan"
                            type: "enumeration"
                          - name: "ip-subnet"
                            value: "192.168.100.0/24"
                            type: "string"
                    pagination:
                      totalCount: 1
                      pageSize: 10
                      pageNumber: 1
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /service-profile/{name}/feature/object/modify:
    post:
      operationId: modifyServiceProfileObjects
      tags:
        - ServiceProfiles
      summary: Modify objects in service profile
      description: |
        Add or update objects within a service profile feature.
        
        **VLAN Properties (from extreme-intent-vlan.yang):**
        - `name`: 1-255 chars, pattern [a-zA-Z0-9_\-\.]+, **required key**
        - `vlan-id-value`: 1-4094 (when auto-vlan-Id=false)
        - `vlan-type`: "vlan" or "private-vlan"
        - `service-id-value`: 1-15999999 (for SPBM)
        - `ip-subnet`: CIDR format (e.g., "192.168.1.0/24")
        - `advanced-settings`: enables multicast, security options
        - `spanning-tree`, `msti-instance`: 0-63
        - `dhcp-snooping`, `arp-inspection`, `ip-source-guard`: security features
      parameters:
        - name: name
          in: path
          required: true
          description: Service profile name
          schema:
            type: string
          example: "Corporate-Service-Profile"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectModifyRequest'
            examples:
              # =====================================================
              # SERVICE PROFILE VLAN - CREATE EXAMPLES
              # =====================================================
              createBasicVLAN:
                summary: Create basic VLAN in Service Profile
                description: |
                  Add a standard VLAN with minimal required properties.
                  Source: extreme-intent-vlan.yang
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "add"
                  objects:
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Data-VLAN-100"
                        - name: "description"
                          value: "Data VLAN for workstations"
                        - name: "vlan-type"
                          value: "vlan"
                        - name: "auto-vlan-Id"
                          value: false
                        - name: "vlan-id-value"
                          value: 100
                        - name: "ip-subnet"
                          value: "192.168.100.0/24"
              
              createAdvancedVLAN:
                summary: Create VLAN with all advanced settings
                description: |
                  Create VLAN with multicast, spanning tree, and security features enabled.
                  All properties from extreme-intent-vlan.yang
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "add"
                  objects:
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Corporate-VLAN-100"
                        - name: "description"
                          value: "Corporate network VLAN"
                        - name: "vlan-type"
                          value: "vlan"
                        - name: "auto-vlan-Id"
                          value: false
                        - name: "vlan-id-value"
                          value: 100
                        - name: "auto-service-id"
                          value: true
                        - name: "ip-subnet"
                          value: "192.168.100.0/24"
                        - name: "advanced-settings"
                          value: true
                        - name: "multicast"
                          value: true
                        - name: "multicast-routing"
                          value: true
                        - name: "igmp-snooping"
                          value: true
                        - name: "igmp-immediate-leave"
                          value: false
                        - name: "spanning-tree"
                          value: true
                        - name: "msti-instance"
                          value: 1
                        - name: "dhcp-snooping"
                          value: true
                        - name: "drop-dhcp-rogue-packets"
                          value: false
                        - name: "arp-inspection"
                          value: true
                        - name: "ip-source-guard"
                          value: false
                        - name: "elrp"
                          value: false
                        - name: "override"
                          value: false
              
              createPrivateVLAN:
                summary: Create Private VLAN in Service Profile
                description: |
                  Create a private VLAN with primary and secondary VLAN IDs.
                  vlan-type must be "private-vlan"
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "add"
                  objects:
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Private-VLAN-200"
                        - name: "description"
                          value: "Private VLAN for isolated hosts"
                        - name: "vlan-type"
                          value: "private-vlan"
                        - name: "auto-private-vlan-Id"
                          value: false
                        - name: "primary-vlan-id-value"
                          value: 200
                        - name: "secondary-vlan-id-value"
                          value: 201
                        - name: "auto-service-id"
                          value: false
                        - name: "service-id-value"
                          value: 200
              
              createVoiceVLAN:
                summary: Create Voice VLAN for VoIP
                description: Voice VLAN with QoS-related features
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "add"
                  objects:
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Voice-VLAN-200"
                        - name: "description"
                          value: "Voice VLAN for IP phones"
                        - name: "vlan-type"
                          value: "vlan"
                        - name: "auto-vlan-Id"
                          value: false
                        - name: "vlan-id-value"
                          value: 200
                        - name: "ip-subnet"
                          value: "192.168.200.0/24"
                        - name: "advanced-settings"
                          value: true
                        - name: "spanning-tree"
                          value: true
                        - name: "msti-instance"
                          value: 2
                        - name: "dhcp-snooping"
                          value: true
              
              createMultipleVLANs:
                summary: Create multiple VLANs in batch
                description: Add multiple VLANs in a single request
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "add"
                  objects:
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Data-VLAN-10"
                        - name: "vlan-id-value"
                          value: 10
                        - name: "auto-vlan-Id"
                          value: false
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Voice-VLAN-20"
                        - name: "vlan-id-value"
                          value: 20
                        - name: "auto-vlan-Id"
                          value: false
                    - type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "name"
                          value: "Guest-VLAN-99"
                        - name: "vlan-id-value"
                          value: 99
                        - name: "auto-vlan-Id"
                          value: false
              
              # =====================================================
              # SERVICE PROFILE VLAN - UPDATE EXAMPLES
              # =====================================================
              updateVLANDescription:
                summary: Update VLAN description
                description: Modify the description of an existing VLAN
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "description"
                          value: "Updated VLAN description - Production network"
              
              updateVLANAdvancedSettings:
                summary: Enable advanced settings on existing VLAN
                description: Turn on advanced settings and security features
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "advanced-settings"
                          value: true
                        - name: "dhcp-snooping"
                          value: true
                        - name: "arp-inspection"
                          value: true
                        - name: "spanning-tree"
                          value: true
                        - name: "msti-instance"
                          value: 1
              
              updateVLANIPSubnet:
                summary: Update VLAN IP subnet
                description: Change the IP subnet of an existing VLAN
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "vlan"
                      featurePath: "/l2-service-feature/vlan"
                      properties:
                        - name: "ip-subnet"
                          value: "10.10.100.0/24"
              
              updateMultipleVLANs:
                summary: Update multiple VLANs in batch
                description: Modify properties of multiple VLANs in a single request
                value:
                  featurePath: "/l2-service-feature"
                  objectType: "vlan"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "vlan"
                      properties:
                        - name: "description"
                          value: "Updated Data VLAN"
                    - id: "b2c3d4e5-f678-9012-bcde-f23456789012"
                      type: "vlan"
                      properties:
                        - name: "description"
                          value: "Updated Voice VLAN"
      responses:
        '200':
          description: Objects modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAPIResponseArray'
              examples:
                createSuccess:
                  summary: VLAN created successfully
                  value:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                      operation: "create"
                      keys:
                        - name: "object-type"
                          value: "vlan"
                        - name: "feature-path"
                          value: "/l2-service-feature"
                updateSuccess:
                  summary: VLAN updated successfully
                  value:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                      operation: "update"
                partialFailure:
                  summary: Batch with partial failure
                  value:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                      operation: "create"
                    - id: null
                      status: "failed"
                      operation: "create"
                      error:
                        code: 400
                        message: "VLAN name already exists"
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
              examples:
                invalidVLANId:
                  summary: Invalid VLAN ID
                  value:
                    error:
                      code: 400
                      message: "vlan-id-value must be between 1 and 4094"
                missingRequiredField:
                  summary: Missing required field
                  value:
                    error:
                      code: 400
                      message: "name is a required field for vlan object"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

