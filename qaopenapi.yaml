    # ==========================================================================
    # CONFIGURATION PROFILE REQUEST/RESPONSE SCHEMAS
    # ==========================================================================

    ConfigProfilesSummaryRequest:
      type: object
      description: Request for listing configuration profiles with filtering and pagination
      properties:
        filterQuery:
          type: array
          description: Filter criteria for retrieving configuration profiles
          items:
            $ref: '#/components/schemas/FilterQuery'
          example:
            - key: "deploymentStatus"
              values: ["deployed", "draft"]
        fuzzySearchQuery:
          $ref: '#/components/schemas/FuzzySearchQuery'
        paginationQuery:
          $ref: '#/components/schemas/PaginationQuery'

    ConfigProfilesSummaryResponse:
      type: object
      description: Response containing configuration profile summaries with pagination
      properties:
        ConfigurationProfiles:
          type: array
          description: Array of configuration profile summaries
          items:
            $ref: '#/components/schemas/ConfigurationProfileSummary'
        Pagination:
          $ref: '#/components/schemas/PaginationModel'
      required:
        - ConfigurationProfiles
        - Pagination

    CreateConfigProfileRequest:
      type: object
      description: Request to create a new configuration profile from a blueprint
      properties:
        blueprintName:
          type: string
          description: Name of the blueprint to use as template
          minLength: 1
          maxLength: 128
          example: "wired-blueprint"
        description:
          type: string
          description: Profile description
          maxLength: 1024
        features:
          type: array
          description: Feature paths to include (if empty, includes all available features)
          items:
            type: string
            pattern: '^/.*'
          example: ["/network-feature/interface-feature/port-feature", "/network-feature/fabric-feature/isis-feature"]
      required:
        - blueprintName

    CloneConfigProfileRequest:
      type: object
      description: Request to clone an existing configuration profile
      properties:
        newName:
          type: string
          description: Name for the cloned profile (must be unique)
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_-]+$'
          example: "Campus-Network-Profile-Copy"
        description:
          type: string
          description: Optional new description for the cloned profile
          maxLength: 1024
      required:
        - newName

    AddRemoveFeaturesRequest:
      type: object
      description: Request to add or remove features from a configuration profile
      properties:
        addFeatures:
          type: array
          description: Feature paths to add to the profile
          items:
            type: string
            pattern: '^/.*'
          example: ["/network-feature/fabric-feature/spbm-global-feature"]
        removeFeatures:
          type: array
          description: Feature paths to remove from the profile
          items:
            type: string
            pattern: '^/.*'
          example: ["/network-feature/fabric-feature/auto-sense-feature"]

    # ==========================================================================
    # OBJECT OPERATION SCHEMAS
    # ==========================================================================

    RetrieveObjectsRequest:
      type: object
      description: Request to retrieve configuration objects (v1)
      properties:
        featurePath:
          type: string
          description: Path to the feature
          example: "/network-feature/interface-feature/port-feature"
        objectType:
          type: string
          description: Type of objects to retrieve
          example: "port"
        objectIds:
          type: array
          description: Specific object IDs to retrieve (if empty, returns all)
          items:
            type: string
            format: uuid
      required:
        - featurePath

    RetrieveObjectsResponse:
      type: object
      description: Response containing configuration objects (v1)
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ConfigObject'
        featurePath:
          type: string
        objectType:
          type: string

    ObjectRetrieveRequest:
      type: object
      description: Enhanced request to retrieve objects (v2)
      properties:
        featurePath:
          type: string
          description: Path to the feature
        objectType:
          type: string
          description: Type of objects to retrieve
        objectIds:
          type: array
          description: Specific object IDs
          items:
            type: string
            format: uuid
        pagination:
          $ref: '#/components/schemas/PaginationRequest'
        filter:
          type: object
          properties:
            search:
              type: string
              description: Fuzzy search across object properties
            propertyFilters:
              type: array
              description: Filter by specific property values
              items:
                $ref: '#/components/schemas/PropertyFilter'
        includeOverrides:
          type: boolean
          description: Include override information
          default: false
        includeTargetQueries:
          type: boolean
          description: Include target query information
          default: false
        resolveReferences:
          type: boolean
          description: Resolve referenced objects
          default: false
      required:
        - featurePath

    PropertyFilter:
      type: object
      description: Filter condition for a property
      properties:
        propertyName:
          type: string
        operator:
          type: string
          enum: [equals, notEquals, contains, startsWith, endsWith, greaterThan, lessThan]
        value:
          description: Value to compare against

    ConfigObjectRetrieveResponse:
      type: object
      description: Enhanced response for object retrieval (v2)
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ConfigObject'
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        featurePath:
          type: string
        objectType:
          type: string
        objectSchema:
          $ref: '#/components/schemas/ObjectTypeSchema'

    ObjectTypeSchema:
      type: object
      description: Schema definition for an object type
      properties:
        typeName:
          type: string
          description: Name of the object type
        properties:
          type: array
          description: Property definitions for this object type
          items:
            $ref: '#/components/schemas/PropertySchema'

    ConfigObjectSummaryRetrieveResponse:
      type: object
      description: Summary response for objects with groups
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigObjectSummaryItem'
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        featurePath:
          type: string
        objectType:
          type: string

    ConfigObjectSummaryItem:
      type: object
      description: Summary item (object or group)
      properties:
        itemType:
          type: string
          enum: [object, group]
        id:
          type: string
          format: uuid
        name:
          type: string
        displayProperties:
          type: object
          description: Key properties for display
          additionalProperties: true
        objectCount:
          type: integer
          description: Number of objects (for groups)
        status:
          $ref: '#/components/schemas/ObjectStatus'

    ObjectStatus:
      type: string
      description: Status of a configuration object
      enum:
        - active
        - inactive
        - pending
        - error

    ObjectRetrieve:
      type: object
      description: Single object retrieve response
      properties:
        object:
          $ref: '#/components/schemas/ConfigObject'
        schema:
          $ref: '#/components/schemas/ObjectTypeSchema'

    ObjectModifyRequest:
      type: object
      description: |
        Request to add or update objects within a feature.
        
        **Valid Origin Values:**
        - `CC` - Configuration Center (use for Configuration Profile objects)
        - `CD` - Configuration Default
        - `DD` - Device Default  
        - `Global` - Global Profile (use for Global Profile objects like DNS/NTP/DHCP/Syslog)
        
        ---
        ## PROPERTY CONSTRAINTS BY FEATURE (From YANG Models)
        ---
        
        ### NTP Server (`/ntp-server-feature`, object type: `ntp-server`)
        **Source**: extreme-intent-ntp-server.yang
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `priority` | uint8 | Min: 1, Max: 16 | **Yes (mandatory)** | Key field - must be unique |
        | `server` | string | IPv4, IPv6, or FQDN | **Yes (mandatory)** | NTP server address |
        | `authentication` | string | Length: 0-64 chars | No | NTP authentication key |
        | `vr-name` | string | Length: 1-32 chars | No | Virtual Router name |
        
        ### DNS Server (`/dns-server-feature`, object type: `dns-server`)
        **Source**: extreme-intent-dns-server.yang
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `priority` | uint8 | Min: 1, Max: 16 | **Yes (mandatory)** | Key field - must be unique |
        | `server` | string | IPv4 or IPv6 address | **Yes (mandatory)** | DNS server IP |
        | `vr-name` | string | Length: 1-32 chars | No | Virtual Router name |
        
        ### DNS Suffix (`/dns-server-feature`, object type: `dns-suffix`)
        **Source**: extreme-intent-dns-suffix.yang
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `fqdn` | string | Length: 1-255, Pattern: `([a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?\.)*([A-Za-z]{2,})` | **Yes (mandatory)** | Fully qualified domain name |
        
        ### DHCP Server (`/dhcp-server-feature`, object type: `dhcp-server`)
        **Source**: extreme-intent-dhcp-server.yang
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `priority` | uint8 | Min: 1, Max: 16 | **Yes (mandatory)** | Key field - must be unique |
        | `server` | string | IPv4 or IPv6 address | **Yes (mandatory)** | DHCP server IP |
        | `name` | string | Length: 0-64 chars | No | Optional descriptive name |
        
        ### Syslog Server (`/syslog-server-feature`, object type: `syslog-server`)
        **Source**: extreme-intent-syslog-server.yang
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `name` | string | Length: 1-255, Pattern: `[a-zA-Z0-9_\-\.]+` | **Yes (key)** | Unique syslog config name |
        | `server` | string | IPv4 or IPv6 address | **Yes (mandatory)** | Syslog server IP |
        | `vr-name` | string | Length: 1-32 chars | No | Virtual Router name |
        | `port` | uint16 | Min: 1, Max: 65535 | **Yes (mandatory)** | UDP port number |
        | `syslog-facility` | enum | LOCAL0-LOCAL7 | **Yes (mandatory)** | Syslog facility code |
        | `syslog-severity` | enum | EMERGENCY, ALERT, CRITICAL, ERROR, WARNING, NOTICE, INFORMATIONAL, DEBUG | **Yes (mandatory)** | Minimum severity to log |
        
        ### VLAN (`/l2-service-feature`, object type: `vlan`) - **Service Profile Only**
        **Source**: extreme-intent-vlan.yang (used in extreme-service-profile-blueprint.yang)
        **Note**: VLANs are configured via Service Profile, NOT Configuration Profile (Wired Blueprint)
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `name` | string | Length: 1-255, Pattern: `[a-zA-Z0-9_\-\.]+` | **Yes (key)** | Unique VLAN name |
        | `description` | string | Length: 0-1024 chars | No | Description |
        | `vlan-id-value` | int32 | Min: 1, Max: 4094 | Conditional | Required if auto-vlan-Id=false |
        | `vlan-type` | enum | `vlan`, `private-vlan` | No | Default: `vlan` |
        | `service-id-value` | int32 | Min: 1, Max: 15999999 | Conditional | For SPBM service ID |
        | `auto-vlan-Id` | boolean | true/false | No | Default: true |
        | `auto-service-id` | boolean | true/false | No | Default: true |
        | `ip-subnet` | string | CIDR format | No | IP subnet for VLAN |
        | `advanced-settings` | boolean | true/false | No | Default: false |
        | `multicast` | boolean | true/false | No | When advanced-settings=true |
        | `multicast-routing` | boolean | true/false | No | When multicast=true, Default: true |
        | `igmp-snooping` | boolean | true/false | No | When multicast=true |
        | `igmp-immediate-leave` | boolean | true/false | No | When multicast=true |
        | `spanning-tree` | boolean | true/false | No | Default: false |
        | `msti-instance` | int32 | Min: 0, Max: 63 | No | When spanning-tree=true, Default: 0 |
        | `arp-inspection` | boolean | true/false | No | When advanced-settings=true |
        | `dhcp-snooping` | boolean | true/false | No | When advanced-settings=true |
        | `drop-dhcp-rogue-packets` | boolean | true/false | No | When dhcp-snooping=true |
        | `ip-source-guard` | boolean | true/false | No | When advanced-settings=true |
        | `elrp` | boolean | true/false | No | Switch Engine only |
        | `override` | boolean | true/false | No | Default: false |
        | `vr-name` | string | Length: 1-255 chars | No | Virtual Router name |
        | `primary-vlan-id-value` | int32 | Min: 1, Max: 4094 | No | For private-vlan type |
        | `secondary-vlan-id-value` | int32 | Min: 1, Max: 4094 | No | For private-vlan type |
        
        ### WLAN (`/wlan-feature`, object type: `wlan`)
        **Source**: extreme-intent-types.yang (enums)
        | Property | Type | Constraints | Required | YANG Notes |
        |----------|------|-------------|----------|------------|
        | `ssid` | string | Min: 1, Max: 32 chars | Yes | Wireless network name |
        | `band` | string | `2.4GHz`, `5GHz`, `6GHz`, `dual` | No | Radio band |
        | `security-type` | enum | `WPA3`, `WPA2`, `OWE`, `Open` | No | From security-type-enum |
        | `security-mode` | enum | `Personal`, `Enterprise` | No | From security-mode-enum |
        | `channel-width` | enum | `20MHz`, `40MHz`, `80MHz`, `160MHz`, `320MHz-1`, `320MHz-2` | No | From channel-width-option-enum |
        | `data-rate-2g` | enum | `1Mbps`, `2Mbps`, `5.5Mbps`, `6Mbps`, `9Mbps`, `11Mbps`, `12Mbps`, `18Mbps`, `24Mbps`, `36Mbps`, `48Mbps`, `54Mbps` | No | 2.4GHz rates |
        | `data-rate-5g` | enum | `6Mbps`, `9Mbps`, `12Mbps`, `18Mbps`, `24Mbps`, `36Mbps`, `48Mbps`, `54Mbps` | No | 5GHz rates |
        
        ### SNMP (`/infrastructure-feature/snmp-feature`)
        | Property | Type | Constraints | Required |
        |----------|------|-------------|----------|
        | `username` | string | SNMPv3 username | Yes |
        | `authType` | string | `MD5`, `SHA`, `None` | No |
        | `privType` | string | `DES`, `AES`, `None` | No |
        | `trapServer` | string | Valid IP address | No |
        | `trapPort` | number | Default: 162 | No |
        
        ---
        
        ## Feature Path Reference Table (from YANG Models)
        
        ### Configuration Profile / Wired Blueprint Feature Paths
        **Profile Type**: Configuration Profile  
        **Origin**: "CC"  
        **Source**: extreme-wired-blueprint.yang
        
        | Feature Path | Object Type | YANG Module | Description |
        |--------------|-------------|-------------|-------------|
        | `/infrastructure-feature/device-identity-feature` | device-identity | - | Device identity configuration |
        | `/infrastructure-feature/device-profile-feature` | device-profile | - | Device profile configuration |
        | `/network-feature/interface-feature/port-feature` | port | extreme-intent-port | Port interface configuration |
        | `/network-feature/fabric-feature/isis-feature` | isis | extreme-intent-fabric-isis | IS-IS routing protocol |
        | `/network-feature/fabric-feature/spbm-global-feature` | spbm-global | extreme-intent-fabric-spbm | SPBM global fabric settings |
        | `/network-feature/fabric-feature/spbm-instance-feature` | spbm-instance | extreme-intent-fabric-spbm-instance | SPBM instance configuration |
        | `/network-feature/fabric-feature/spbm-isis-interface-feature` | spbm-isis-interface | - | SPBM IS-IS interface config |
        | `/network-feature/fabric-feature/auto-sense-feature` | auto-sense | extreme-intent-fabric-auto-sense | Auto-Sense configuration |
        | `/network-feature/fabric-feature/fabric-nni-feature` | fabric-nni | - | Fabric NNI interface config |
        
        ### Service Profile Blueprint Feature Paths
        **Profile Type**: Service Profile  
        **Origin**: "SP"  
        **Source**: extreme-service-profile-blueprint.yang
        
        | Feature Path | Object Type | YANG Module | Description |
        |--------------|-------------|-------------|-------------|
        | `/l2-service-feature` | vlan | extreme-intent-vlan | **VLAN configuration (VLANs are HERE)** |
        | `/vrf-feature` | vrf | extreme-intent-vrf | Virtual Routing and Forwarding |
        | `/router-group-feature` | router-group | extreme-intent-router-group | Router group configuration |
        | `/global-feature` | global | extreme-intent-global | Global service settings |
        
        ### Global Profile Blueprint Feature Paths
        **Profile Type**: Global Profile  
        **Origin**: "Global"  
        **Source**: extreme-global-blueprint.yang
        
        | Feature Path | Object Type | YANG Module | Description |
        |--------------|-------------|-------------|-------------|
        | `/ntp-server-feature` | ntp-server | extreme-intent-ntp-server | NTP server configuration |
        | `/dns-server-feature` | dns-server, dns-suffix | extreme-intent-dns-server, extreme-intent-dns-suffix | DNS server/suffix configuration |
        | `/dhcp-server-feature` | dhcp-server | extreme-intent-dhcp-server | DHCP server configuration |
        | `/syslog-server-feature` | syslog-server | extreme-intent-syslog-server | Syslog server configuration |
        | `/radius-server-feature` | radius-server | extreme-intent-radius-server | RADIUS server configuration |
        | `/tacac-plus-server-feature` | tacacs-server | extreme-intent-tacacs-server | TACACS+ server configuration |
        | `/certificate-feature` | certificate | - | Certificate configuration |
        | `/management-access-server-feature` | mgmt-access | - | Management access configuration |
        | `/analytics-feature` | analytics | - | Analytics configuration |
        
        ### Wireless Blueprint Feature Paths
        **Profile Type**: Configuration Profile (Wireless)  
        **Origin**: "CC"  
        **Source**: extreme-wireless-blueprint.yang
        
        | Feature Path | Object Type | YANG Module | Description |
        |--------------|-------------|-------------|-------------|
        | `/wlan-feature` | wlan | extreme-intent-wlan | Wireless LAN configuration |
        
        ---
        
        **⚠️ IMPORTANT NOTE**: VLANs are configured via **Service Profile** using `/l2-service-feature`, 
        NOT via Configuration Profile. The Wired Blueprint does NOT contain a VLAN feature.
        
        ---
        
      properties:
        featurePath:
          type: string
          description: |
            Path to the feature within the blueprint. See Feature Path Reference Table above.
            - Configuration Profile (Wired): /network-feature/interface-feature/port-feature, /network-feature/fabric-feature/isis-feature, etc.
            - Service Profile: /l2-service-feature, /vrf-feature, etc.
            - Global Profile: /ntp-server-feature, /dns-server-feature, etc.
          example: "/network-feature/interface-feature/port-feature"
        objectType:
          type: string
          description: Type of objects being modified. Must match the feature's object type.
          example: "port"
        operation:
          type: string
          enum: [add, update]
          description: Operation type - add for new objects, update for existing
          example: "add"
        objects:
          type: array
          description: Objects to add or update
          items:
            $ref: '#/components/schemas/ObjectModifyItem'
      required:
        - featurePath
        - objectType
        - objects
      examples:
        # =====================================================================
        # PORT CONFIGURATION EXAMPLES (Configuration Profile - Wired Blueprint)
        # Feature Path: /network-feature/interface-feature/port-feature
        # Object Type: port
        # Origin: "CC" for Configuration Profile objects
        # Source: extreme-intent-port.yang
        # =====================================================================
        createPortBasic:
          summary: Create a basic port configuration
          description: |
            Add a new port configuration with minimal required properties.
            Property constraints from extreme-intent-port.yang.
          value:
            featurePath: "/network-feature/interface-feature/port-feature"
            objectType: "port"
            operation: "add"
            objects:
              - type: "port"
                operation: "add"
                properties:
                  name: "1/1"
                  description: "Uplink port"
                  admin-status: "enabled"
                  speed: "auto"
        
        createISISBasic:
          summary: Create IS-IS configuration
          description: |
            Add IS-IS routing protocol configuration.
            Source: extreme-intent-fabric-isis.yang
          value:
            featurePath: "/network-feature/fabric-feature/isis-feature"
            objectType: "isis"
            operation: "add"
            objects:
              - type: "isis"
                operation: "add"
                properties:
                  system-id: "0001.0001.0001"
                  area-id: "49.0001"
                  enabled: true
        
        createSPBMBasic:
          summary: Create SPBM global configuration
          description: |
            Add SPBM fabric configuration.
            Source: extreme-intent-fabric-spbm.yang
          value:
            featurePath: "/network-feature/fabric-feature/spbm-global-feature"
            objectType: "spbm-global"
            operation: "add"
            objects:
              - type: "spbm-global"
                operation: "add"
                properties:
                  b-vid: 4051
                  nickname: "1.1.1"
                  enabled: true

        # =====================================================================
        # VLAN CONFIGURATION EXAMPLES (Service Profile - NOT Wired Blueprint)
        # Feature Path: /l2-service-feature
        # Object Type: vlan
        # Origin: "SP" for Service Profile objects
        # Source: extreme-intent-vlan.yang (used in extreme-service-profile-blueprint.yang)
        # NOTE: VLANs are configured via Service Profile, NOT Configuration Profile!
        # =====================================================================
        createVLANBasic:
          summary: Create a basic VLAN (Service Profile)
          description: |
            Add a new VLAN with minimal required properties.
            **IMPORTANT**: VLANs use feature path `/l2-service-feature` in Service Profile.
            Property constraints from extreme-intent-vlan.yang:
            - name: 1-255 chars, pattern [a-zA-Z0-9_\-\.]+
            - vlan-id-value: 1-4094 (optional if auto-vlan-Id=true)
          value:
            featurePath: "/l2-service-feature"
            objectType: "vlan"
            operation: "add"
            objects:
              - type: "vlan"
                operation: "add"
                properties:
                  name: "Data-VLAN"
                  description: "Data VLAN for workstations"
                  vlan-id-value: 100
                  auto-vlan-Id: false
        
        createVLANAdvanced:
          summary: Create VLAN with all advanced properties (Service Profile)
          description: |
            Add a new VLAN with all available configuration options from extreme-intent-vlan.yang.
            Includes multicast, spanning tree, security, and private VLAN settings.
            **IMPORTANT**: VLANs use feature path `/l2-service-feature` in Service Profile.
          value:
            featurePath: "/l2-service-feature"
            objectType: "vlan"
            operation: "add"
            objects:
              - type: "vlan"
                operation: "add"
                properties:
                  # === BASIC PROPERTIES (from extreme-intent-vlan.yang) ===
                  name: "Corporate-VLAN"
                  description: "Corporate network VLAN"
                  vlan-id-value: 100
                  vlan-type: "vlan"
                  auto-vlan-Id: false
                  auto-service-id: true
                  ip-subnet: "192.168.100.0/24"
                  
                  # === ADVANCED SETTINGS ===
                  advanced-settings: true
                  
                  # === MULTICAST SETTINGS (when advanced-settings=true) ===
                  multicast: true
                  multicast-routing: true
                  igmp-snooping: true
                  igmp-immediate-leave: false
                  
                  # === SPANNING TREE SETTINGS ===
                  spanning-tree: true
                  msti-instance: 1
                  
                  # === SECURITY SETTINGS (when advanced-settings=true) ===
                  arp-inspection: true
                  dhcp-snooping: true
                  drop-dhcp-rogue-packets: false
                  ip-source-guard: false
                  
                  # === OTHER SETTINGS ===
                  elrp: false
                  override: false

        createVoiceVLAN:
          summary: Create a Voice VLAN (Service Profile)
          description: Add a Voice VLAN optimized for VoIP traffic
          value:
            featurePath: "/l2-service-feature"
            objectType: "vlan"
            operation: "add"
            objects:
              - type: "vlan"
                operation: "add"
                properties:
                  name: "Voice-VLAN"
                  description: "Voice VLAN for IP phones"
                  vlan-id-value: 200
                  vlan-type: "vlan"
                  auto-vlan-Id: false
                  ip-subnet: "192.168.200.0/24"
                  advanced-settings: true
                  # Voice optimization - enable QoS related features
                  spanning-tree: true
                  msti-instance: 2
                  dhcp-snooping: true
                  igmp-snooping: false

        createGuestVLAN:
          summary: Create a Guest VLAN (Service Profile)
          description: Add a Guest VLAN with isolation settings
          value:
            featurePath: "/l2-service-feature"
            objectType: "vlan"
            operation: "add"
            objects:
              - type: "vlan"
                operation: "add"
                properties:
                  name: "Guest-VLAN"
                  description: "Guest network - isolated"
                  vlan-id-value: 999
                  vlan-type: "vlan"
                  auto-vlan-Id: false
                  ip-subnet: "10.99.99.0/24"
                  advanced-settings: true
                  # Security hardening for guest network
                  arp-inspection: true
                  dhcp-snooping: true
                  drop-dhcp-rogue-packets: true
                  ip-source-guard: true
                  spanning-tree: true
                  elrp: true

        updateVLAN:
          summary: Update existing VLAN (Service Profile)
          description: Modify properties of an existing VLAN
          value:
            featurePath: "/l2-service-feature"
            objectType: "vlan"
            operation: "update"
            objects:
              - id: "234f5678-e89b-12d3-a456-426614174001"
                type: "vlan"
                operation: "update"
                properties:
                  description: "Updated VLAN description"
                  advanced-settings: true
                  multicast: true
                  dhcp-snooping: true

        createPrivateVLAN:
          summary: Create a Private VLAN (Service Profile)
          description: |
            Add a Private VLAN with primary/secondary VLAN IDs.
            Source: extreme-intent-vlan.yang (vlan-type: private-vlan)
          value:
            featurePath: "/l2-service-feature"
            objectType: "vlan"
            operation: "add"
            objects:
              - type: "vlan"
                operation: "add"
                properties:
                  name: "Private-VLAN-Isolated"
                  description: "Private VLAN for isolated hosts"
                  vlan-type: "private-vlan"
                  auto-private-vlan-Id: false
                  primary-vlan-id-value: 100
                  secondary-vlan-id-value: 101
                  advanced-settings: true
                  arp-inspection: true

        # =====================================================================
        # DNS CONFIGURATION EXAMPLES (Global Profile)
        # Feature Path: /dns-server-feature
        # Object Types: dns-server, dns-suffix
        # Origin: "Global" for Global Profile objects
        # Source: extreme-intent-dns-server.yang, extreme-intent-dns-suffix.yang
        # =====================================================================
        createDNSServerGlobal:
          summary: Add DNS Server to Global Profile
          description: |
            Add a DNS server entry to the global profile.
            Property constraints from extreme-intent-dns-server.yang:
            - priority: 1-16 (mandatory, key field)
            - server: IPv4/IPv6 address (mandatory)
            - vr-name: 1-32 chars (optional)
          value:
            featurePath: "/dns-server-feature"
            objectType: "dns-server"
            operation: "add"
            objects:
              - type: "dns-server"
                operation: "add"
                properties:
                  - name: "priority"
                    type: "number"
                    value: 1
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "8.8.8.8"
                    origin: "Global"
        
        createSecondaryDNSGlobal:
          summary: Add Secondary DNS Server to Global Profile
          description: Add a secondary DNS server with lower priority to global profile
          value:
            featurePath: "/dns-server-feature"
            objectType: "dns-server"
            operation: "add"
            objects:
              - type: "dns-server"
                operation: "add"
                properties:
                  - name: "priority"
                    type: "number"
                    value: 2
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "1.1.1.1"
                    origin: "Global"

        createDNSSuffixGlobal:
          summary: Add DNS Suffix to Global Profile
          description: Add a DNS domain suffix for name resolution in global profile
          value:
            featurePath: "/dns-server-feature"
            objectType: "dns-suffix"
            operation: "add"
            objects:
              - type: "dns-suffix"
                operation: "add"
                properties:
                  - name: "priority"
                    type: "number"
                    value: 1
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "corp.company.com"
                    origin: "Global"

        updateDNSServerGlobal:
          summary: Update DNS Entry in Global Profile
          description: Modify an existing DNS server entry in global profile
          value:
            featurePath: "/dns-server-feature"
            objectType: "dns-server"
            operation: "update"
            objects:
              - id: "234f5678-e89b-12d3-a456-426614174001"
                type: "dns-server"
                operation: "update"
                properties:
                  - name: "server"
                    type: "string"
                    value: "208.67.222.222"
                    origin: "Global"

