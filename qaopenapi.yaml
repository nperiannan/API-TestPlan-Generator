  /configuration-profile/{name}/devices/add:
    post:
      operationId: addDevicesToConfigurationProfile
      tags:
        - ConfigurationProfiles
      summary: Add devices to a configuration profile
      description: |
        Moves one or more devices from their current configuration profile (or orphan profile) to the specified target configuration profile.

        **Behavior:**
        - Backend automatically detects the source profile for each device
        - If `eraseConfiguration` is false (default), device retains its existing configuration and inherits any new settings from the target profile
        - If `eraseConfiguration` is true, device configuration is erased before moving to target profile
        - Devices not currently assigned to any profile are moved from the customer-specific orphan profile
        - Returns array of BatchAPIResponse with status for each device

        **Response Keys:**
        - `device-id`: UUID of the device being moved
        - `source-profile`: Name of the profile device was moved from
        - `target-profile`: Name of the profile device was moved to
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name of the target configuration profile to which devices will be added
          example: "Profile-002"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serialNumbers:
                  type: array
                  items:
                    type: string
                  description: Array of device serial numbers to add to the configuration profile
                  example: ["SN12345678", "SN12345679"]
                  minItems: 1
                eraseConfiguration:
                  type: boolean
                  default: false
                  description: |
                    If false (default): Device retains existing configuration and inherits new settings from target profile
                    If true: Device configuration is erased before moving to target profile
                  example: false
              required:
                - serialNumbers
      responses:
        "200":
          description: Devices successfully processed. Check individual device status in response array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchAPIResponse"
              example:
                - keys:
                    - name: "serial-number"
                      value: "SN12345678"
                    - name: "device-id"
                      value: "123e4567-e89b-12d3-a456-426614174001"
                    - name: "source-profile"
                      value: "Profile-001"
                    - name: "target-profile"
                      value: "Profile-002"
                  status: "success"
                  operation: "update"
                - keys:
                    - name: "serial-number"
                      value: "SN12345679"
                    - name: "device-id"
                      value: "123e4567-e89b-12d3-a456-426614174002"
                    - name: "source-profile"
                      value: "orphan-profile-customer-123"
                    - name: "target-profile"
                      value: "Profile-002"
                  status: "success"
                  operation: "update"
        "400":
          description: "Bad Request - Invalid request payload, empty device list, or one or more devices could not be processed."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchAPIResponse"
              example:
                - keys:
                    - name: "device-id"
                      value: "invalid-uuid"
                  status: "failed"
                  operation: "update"
                  error:
                    code: 1001
                    message: "Invalid device UUID format."
                - keys:
                    - name: "device-id"
                      value: "123e4567-e89b-12d3-a456-426614174003"
                  status: "failed"
                  operation: "update"
                  error:
                    code: 1001
                    message: "Device not found."
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              example:
                code: 1002
                message: "Authentication required or token invalid."
        "404":
          description: Target configuration profile not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchAPIResponse"
              example:
                - keys:
                    - name: "profile-name"
                      value: "Profile-002"
                  status: "failed"
                  operation: "update"
                  error:
                    code: 1004
                    message: "Configuration profile 'Profile-002' not found."
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchAPIResponse"
              example:
                - status: "failed"
                  operation: "update"
                  error:
                    code: 1005
                    message: "Failed to add devices to configuration profile."

  /configuration-profile/{name}/devices/retrieve:
    post:
      operationId: getDevicesInConfigProfile
      tags:
        - ConfigurationProfiles
      summary: Retrieve all devices assigned to a configuration profile
      description: |
        Retrieves a list of all devices currently assigned to the specified configuration profile.
        Supports pagination, fuzzy search, filtering, and model variant filtering capabilities.

        **Model Variant Filtering (NEW):**
        - modelVariants: Filter devices by model variant names (e.g., "5520-24T", "5520-48P")
        - Only devices with models matching the specified variants will be returned
        - Array of strings, all values are optional

        **Filter Options:**
        - deviceName: Filter by device hostname/name
        - model: Filter by device model
        - siteId: Filter by site identifier
        - siteName: Filter by site name
        - source: Filter by device onboarding source (onboarding-rule, manual, onboarding-xlsx)

        **Fuzzy Search:**
        - Searches across device hostname, IP address, serial number, site name, and model name fields

        **Response includes:**
        - Device basic information (deviceId, hostname, model)
        - Network information (ipAddress, serialNumber)
        - Site assignment details
        - Onboarding source (how device was added to system)

        **Use Cases:**
        1. **All devices (default)**: `{}` or no body
        2. **Pagination only**: `{"paginationQuery": {"pageNumber": 1, "pageSize": 50}}`
        3. **Model variant filter**: `{"modelVariants": ["5520-24T", "5520-48P"]}`
        4. **Combined filtering**: `{"modelVariants": ["5520-24T"], "fuzzySearchQuery": "floor1", "paginationQuery": {"pageNumber": 1, "pageSize": 20}}`
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name of the configuration profile
          example: "Enterprise-WiFi-Profile"
      requestBody:
        required: false
        description: |
          Optional request body with pagination, filtering, and search parameters.
          All parameters are optional. If not provided, returns all devices with default pagination.
        content:
          application/json:
            schema:
              type: object
              properties:
                paginationQuery:
                  $ref: "#/components/schemas/PaginationQuery"
                filterQuery:
                  description: "Filter criteria for retrieving devices"
                  type: array
                  items:
                    $ref: "#/components/schemas/FilterQuery"
                fuzzySearchQuery:
                  type: string
                  description: |
                    Fuzzy search query string. Searches across device hostname, IP address, 
                    serial number, site name, and model name (case-insensitive partial match).
                  example: "floor1"
                modelVariants:
                  type: array
                  items:
                    type: string
                  description: |
                    Optional array of model variant names to filter devices.
                    Only devices with models matching the specified variants will be returned.
                    Example: ["5520-24T", "5520-48P", "7520-48T"]
                    If omitted, devices with all model variants are returned.
                  example: ["5520-24T", "5520-48P"]
            examples:
              withoutPagination:
                summary: Retrieve all devices without pagination
                value: {}
              withPagination:
                summary: Retrieve with pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 50
              withModelVariants:
                summary: Retrieve devices with specific model variants
                value:
                  modelVariants: ["5520-24T", "5520-48P"]
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 20
              withFilters:
                summary: Retrieve with filters and pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 20
                  filterQuery:
                    - key: "model"
                      values: ["5520"]
                    - key: "source"
                      values: ["onboarding-rule", "manual"]
              withFuzzySearch:
                summary: Retrieve with fuzzy search and pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 30
                  fuzzySearchQuery: "floor1"
              withCombinedFilters:
                summary: Combined model variants, filters, fuzzy search, and pagination
                value:
                  modelVariants: ["5520-24T", "7520-48T"]
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 25
                  filterQuery:
                    - key: "siteId"
                      values: ["389e8400-e29b-41d4-a716-4466554443b0"]
                    - key: "source"
                      values: ["onboarding-rule"]
                  fuzzySearchQuery: "switch"
      responses:
        "200":
          description: Devices retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationProfileDevicesResponse"
              example:
                devices:
                  - deviceId: "123e4567-e89b-12d3-a456-426614174001"
                    hostname: "switch-floor1-001"
                    model: "5520"
                    ipAddress: "192.168.1.100"
                    serialNumber: "SN123456789"
                    site:
                      siteId: "389e8400-e29b-41d4-a716-4466554443b0"
                      siteName: "Building-A-Floor-1"
                    source: "onboarding-rule"
                  - deviceId: "123e4567-e89b-12d3-a456-426614174002"
                    hostname: "switch-floor1-002"
                    model: "5520"
                    ipAddress: "192.168.1.101"
                    serialNumber: "SN123456790"
                    site:
                      siteId: "389e8400-e29b-41d4-a716-4466554443b0"
                      siteName: "Building-A-Floor-1"
                    source: "manual"
                Pagination:
                  count: 2
                  page: 1
                  totalCount: 42
                  totalPages: 21
        "400":
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleAPIResponse"
              example:
                error:
                  code: 1001
                  message: "Invalid query parameters or request body format"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              example:
                code: 1002
                message: "Authentication required or token invalid"
        "404":
          description: Configuration profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleAPIResponse"
              example:
                keys:
                  - name: "profile-name"
                    value: "Enterprise-WiFi-Profile"
                error:
                  code: 1004
                  message: "Configuration profile 'Enterprise-WiFi-Profile' not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleAPIResponse"
              example:
                error:
                  code: 1005
                  message: "Internal server error while retrieving devices"

