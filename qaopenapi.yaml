  # ============================================================================
  # GLOBAL PROFILE ENDPOINTS
  # ============================================================================

  /global-profile:
    get:
      operationId: getGlobalProfile
      tags:
        - GlobalProfiles
      summary: Get the global configuration profile
      description: |
        Returns the global profile containing shared configurations.
        The global profile is automatically created and cannot be deleted.
      parameters:
        - name: detailLevel
          in: query
          required: false
          schema:
            type: string
            enum: [summary, full]
            default: full
      responses:
        '200':
          description: Global profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfile'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /global-profile/feature/object/retrieve:
    post:
      operationId: getGlobalProfileObjects
      tags:
        - GlobalProfiles
      summary: Retrieve objects from global profile (v1)
      description: |
        Returns configuration objects from the global profile.
        
        **Global Profile Features (from extreme-global-blueprint.yang):**
        - `/ntp-server-feature` - NTP server configuration
        - `/dns-server-feature` - DNS server and suffix configuration
        - `/dhcp-server-feature` - DHCP server configuration
        - `/syslog-server-feature` - Syslog server configuration
        - `/radius-server-feature` - RADIUS server configuration
        - `/tacac-plus-server-feature` - TACACS+ server configuration
        - `/certificate-feature` - Certificate configuration
        - `/management-access-server-feature` - Management access configuration
        - `/analytics-feature` - Analytics configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveObjectsRequest'
            examples:
              # =====================================================
              # GLOBAL PROFILE - RETRIEVE EXAMPLES
              # =====================================================
              retrieveAllNTPServers:
                summary: Retrieve all NTP servers
                description: Get all NTP server objects from global profile
                value:
                  featurePath: "/ntp-server-feature"
                  objectType: "ntp-server"
              
              retrieveAllDNSServers:
                summary: Retrieve all DNS servers
                description: Get all DNS server objects from global profile
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
              
              retrieveAllDNSSuffixes:
                summary: Retrieve all DNS suffixes
                description: Get all DNS suffix objects from global profile
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-suffix"
              
              retrieveAllDHCPServers:
                summary: Retrieve all DHCP servers
                description: Get all DHCP server objects from global profile
                value:
                  featurePath: "/dhcp-server-feature"
                  objectType: "dhcp-server"
              
              retrieveAllSyslogServers:
                summary: Retrieve all Syslog servers
                description: Get all Syslog server objects from global profile
                value:
                  featurePath: "/syslog-server-feature"
                  objectType: "syslog-server"
              
              retrieveSpecificNTPById:
                summary: Retrieve specific NTP server by ID
                value:
                  featurePath: "/ntp-server-feature"
                  objectType: "ntp-server"
                  objectIds:
                    - "11111111-2222-3333-4444-555555555555"
      responses:
        '200':
          description: Objects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveObjectsResponse'
              examples:
                ntpServerResponse:
                  summary: NTP server retrieve response
                  value:
                    objects:
                      - id: "11111111-2222-3333-4444-555555555555"
                        type: "ntp-server"
                        featurePath: "/ntp-server-feature"
                        properties:
                          - name: "priority"
                            value: 1
                            type: "number"
                            origin: "Global"
                          - name: "server"
                            value: "time.nist.gov"
                            type: "string"
                            origin: "Global"
                dnsServerResponse:
                  summary: DNS server retrieve response
                  value:
                    objects:
                      - id: "22222222-3333-4444-5555-666666666666"
                        type: "dns-server"
                        featurePath: "/dns-server-feature"
                        properties:
                          - name: "priority"
                            value: 1
                            type: "number"
                            origin: "Global"
                          - name: "server"
                            value: "8.8.8.8"
                            type: "string"
                            origin: "Global"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

  /global-profile/feature/object/retrieve-v2:
    post:
      operationId: getGlobalProfileObjectsV2
      tags:
        - GlobalProfiles
      summary: Retrieve objects from global profile (v2)
      description: Enhanced endpoint with pagination and filtering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectRetrieveRequest'
            examples:
              retrieveWithPagination:
                summary: Retrieve NTP servers with pagination
                value:
                  featurePath: "/ntp-server-feature"
                  objectType: "ntp-server"
                  paginationQuery:
                    pageSize: 10
                    pageNumber: 1
              retrieveDNSWithFilter:
                summary: Retrieve DNS servers with pagination
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
                  paginationQuery:
                    pageSize: 20
                    pageNumber: 1
      responses:
        '200':
          description: Objects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObjectRetrieveResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /global-profile/feature/object/modify:
    post:
      operationId: modifyGlobalProfileObjects
      tags:
        - GlobalProfiles
      summary: Modify objects in global profile
      description: |
        Add or update configuration objects in the global profile.
        Use origin: "Global" for all properties in global profile objects.
        
        **Feature-specific Property Constraints:**
        
        **NTP Server** (extreme-intent-ntp-server.yang):
        - priority: 1-16 (mandatory, key)
        - server: IPv4/IPv6/FQDN (mandatory)
        - authentication: 0-64 chars
        - vr-name: 1-32 chars
        
        **DNS Server** (extreme-intent-dns-server.yang):
        - priority: 1-16 (mandatory, key)
        - server: IPv4/IPv6 (mandatory)
        - vr-name: 1-32 chars
        
        **DNS Suffix** (extreme-intent-dns-suffix.yang):
        - fqdn: 1-255 chars, valid FQDN pattern (mandatory)
        
        **DHCP Server** (extreme-intent-dhcp-server.yang):
        - priority: 1-16 (mandatory, key)
        - server: IPv4/IPv6 (mandatory)
        - name: 0-64 chars
        
        **Syslog Server** (extreme-intent-syslog-server.yang):
        - name: 1-255 chars (mandatory, key)
        - server: IPv4/IPv6 (mandatory)
        - port: 1-65535 (mandatory)
        - syslog-facility: LOCAL0-LOCAL7 (mandatory)
        - syslog-severity: EMERGENCY-DEBUG (mandatory)
        - vr-name: 1-32 chars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectModifyRequest'
            examples:
              # =====================================================
              # NTP SERVER - CREATE/UPDATE EXAMPLES
              # =====================================================
              createNTPServerPrimary:
                summary: Create primary NTP server
                description: |
                  Add primary NTP server to global profile.
                  Constraints: priority 1-16, server is mandatory
                value:
                  featurePath: "/ntp-server-feature"
                  objectType: "ntp-server"
                  operation: "add"
                  objects:
                    - type: "ntp-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 1
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "time.nist.gov"
                          origin: "Global"
              
              createNTPServerWithAuth:
                summary: Create NTP server with authentication
                description: NTP server with authentication key and VR name
                value:
                  featurePath: "/ntp-server-feature"
                  objectType: "ntp-server"
                  operation: "add"
                  objects:
                    - type: "ntp-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 2
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "192.168.1.100"
                          origin: "Global"
                        - name: "authentication"
                          type: "string"
                          value: "ntp-auth-key-123"
                          origin: "Global"
                        - name: "vr-name"
                          type: "string"
                          value: "VR-Mgmt"
                          origin: "Global"
              
              updateNTPServer:
                summary: Update NTP server
                description: Update an existing NTP server's address
                value:
                  featurePath: "/ntp-server-feature"
                  objectType: "ntp-server"
                  operation: "update"
                  objects:
                    - id: "11111111-2222-3333-4444-555555555555"
                      type: "ntp-server"
                      operation: "update"
                      properties:
                        - name: "server"
                          type: "string"
                          value: "time.enterprise.com"
                          origin: "Global"
              
              # =====================================================
              # DNS SERVER - CREATE/UPDATE EXAMPLES
              # =====================================================
              createDNSServerPrimary:
                summary: Create primary DNS server
                description: |
                  Add primary DNS server (Google DNS).
                  Constraints: priority 1-16, server is mandatory IPv4/IPv6
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
                  operation: "add"
                  objects:
                    - type: "dns-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 1
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "8.8.8.8"
                          origin: "Global"
              
              createDNSServerSecondary:
                summary: Create secondary DNS server
                description: Add secondary DNS server with lower priority
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
                  operation: "add"
                  objects:
                    - type: "dns-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 2
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "8.8.4.4"
                          origin: "Global"
              
              createDNSServerWithVR:
                summary: Create DNS server with Virtual Router
                description: DNS server bound to specific Virtual Router
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
                  operation: "add"
                  objects:
                    - type: "dns-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 1
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "10.0.0.53"
                          origin: "Global"
                        - name: "vr-name"
                          type: "string"
                          value: "VR-Mgmt"
                          origin: "Global"
              
              updateDNSServer:
                summary: Update DNS server
                description: Update an existing DNS server's IP address
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
                  operation: "update"
                  objects:
                    - id: "22222222-3333-4444-5555-666666666666"
                      type: "dns-server"
                      operation: "update"
                      properties:
                        - name: "server"
                          type: "string"
                          value: "208.67.222.222"
                          origin: "Global"
              
              # =====================================================
              # DNS SUFFIX - CREATE/UPDATE EXAMPLES
              # =====================================================
              createDNSSuffix:
                summary: Create DNS suffix
                description: |
                  Add DNS suffix for domain resolution.
                  fqdn must match pattern: ([a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?\.)*([A-Za-z]{2,})
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-suffix"
                  operation: "add"
                  objects:
                    - type: "dns-suffix"
                      operation: "add"
                      properties:
                        - name: "fqdn"
                          type: "string"
                          value: "corp.example.com"
                          origin: "Global"
              
              createMultipleDNSSuffixes:
                summary: Create multiple DNS suffixes
                description: Add multiple DNS suffixes in batch
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-suffix"
                  operation: "add"
                  objects:
                    - type: "dns-suffix"
                      operation: "add"
                      properties:
                        - name: "fqdn"
                          type: "string"
                          value: "corp.example.com"
                          origin: "Global"
                    - type: "dns-suffix"
                      operation: "add"
                      properties:
                        - name: "fqdn"
                          type: "string"
                          value: "internal.example.com"
                          origin: "Global"
              
              updateDNSSuffix:
                summary: Update DNS suffix
                description: Update an existing DNS suffix
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-suffix"
                  operation: "update"
                  objects:
                    - id: "33333333-4444-5555-6666-777777777777"
                      type: "dns-suffix"
                      operation: "update"
                      properties:
                        - name: "fqdn"
                          type: "string"
                          value: "newdomain.example.com"
                          origin: "Global"
              
              # =====================================================
              # DHCP SERVER - CREATE/UPDATE EXAMPLES
              # =====================================================
              createDHCPServerPrimary:
                summary: Create primary DHCP server
                description: |
                  Add primary DHCP server.
                  Constraints: priority 1-16, server mandatory, name 0-64 chars
                value:
                  featurePath: "/dhcp-server-feature"
                  objectType: "dhcp-server"
                  operation: "add"
                  objects:
                    - type: "dhcp-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 1
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "192.168.1.10"
                          origin: "Global"
                        - name: "name"
                          type: "string"
                          value: "Primary-DHCP-Server"
                          origin: "Global"
              
              createDHCPServerSecondary:
                summary: Create secondary DHCP server
                description: Add backup DHCP server
                value:
                  featurePath: "/dhcp-server-feature"
                  objectType: "dhcp-server"
                  operation: "add"
                  objects:
                    - type: "dhcp-server"
                      operation: "add"
                      properties:
                        - name: "priority"
                          type: "number"
                          value: 2
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "192.168.1.11"
                          origin: "Global"
                        - name: "name"
                          type: "string"
                          value: "Secondary-DHCP-Server"
                          origin: "Global"
              
              updateDHCPServer:
                summary: Update DHCP server
                description: Update an existing DHCP server's IP address
                value:
                  featurePath: "/dhcp-server-feature"
                  objectType: "dhcp-server"
                  operation: "update"
                  objects:
                    - id: "44444444-5555-6666-7777-888888888888"
                      type: "dhcp-server"
                      operation: "update"
                      properties:
                        - name: "server"
                          type: "string"
                          value: "192.168.1.20"
                          origin: "Global"
                        - name: "name"
                          type: "string"
                          value: "Updated-DHCP-Server"
                          origin: "Global"
              
              # =====================================================
              # SYSLOG SERVER - CREATE/UPDATE EXAMPLES
              # =====================================================
              createSyslogServerBasic:
                summary: Create basic Syslog server
                description: |
                  Add Syslog server with required properties.
                  Required: name (key), server, port, syslog-facility, syslog-severity
                value:
                  featurePath: "/syslog-server-feature"
                  objectType: "syslog-server"
                  operation: "add"
                  objects:
                    - type: "syslog-server"
                      operation: "add"
                      properties:
                        - name: "name"
                          type: "string"
                          value: "primary-syslog"
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "192.168.1.100"
                          origin: "Global"
                        - name: "port"
                          type: "number"
                          value: 514
                          origin: "Global"
                        - name: "syslog-facility"
                          type: "enumeration"
                          value: "LOCAL0"
                          origin: "Global"
                        - name: "syslog-severity"
                          type: "enumeration"
                          value: "WARNING"
                          origin: "Global"
              
              createSyslogServerWithVR:
                summary: Create Syslog server with VR
                description: Syslog server with Virtual Router name
                value:
                  featurePath: "/syslog-server-feature"
                  objectType: "syslog-server"
                  operation: "add"
                  objects:
                    - type: "syslog-server"
                      operation: "add"
                      properties:
                        - name: "name"
                          type: "string"
                          value: "mgmt-syslog"
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "10.0.0.50"
                          origin: "Global"
                        - name: "vr-name"
                          type: "string"
                          value: "VR-Mgmt"
                          origin: "Global"
                        - name: "port"
                          type: "number"
                          value: 1514
                          origin: "Global"
                        - name: "syslog-facility"
                          type: "enumeration"
                          value: "LOCAL7"
                          origin: "Global"
                        - name: "syslog-severity"
                          type: "enumeration"
                          value: "INFORMATIONAL"
                          origin: "Global"
              
              createSyslogCriticalOnly:
                summary: Create Syslog for critical events
                description: Syslog server configured for critical and above severity
                value:
                  featurePath: "/syslog-server-feature"
                  objectType: "syslog-server"
                  operation: "add"
                  objects:
                    - type: "syslog-server"
                      operation: "add"
                      properties:
                        - name: "name"
                          type: "string"
                          value: "critical-alerts"
                          origin: "Global"
                        - name: "server"
                          type: "string"
                          value: "syslog.enterprise.com"
                          origin: "Global"
                        - name: "port"
                          type: "number"
                          value: 514
                          origin: "Global"
                        - name: "syslog-facility"
                          type: "enumeration"
                          value: "LOCAL0"
                          origin: "Global"
                        - name: "syslog-severity"
                          type: "enumeration"
                          value: "CRITICAL"
                          origin: "Global"
              
              updateSyslogServer:
                summary: Update Syslog server
                description: Update Syslog severity level and port
                value:
                  featurePath: "/syslog-server-feature"
                  objectType: "syslog-server"
                  operation: "update"
                  objects:
                    - id: "55555555-6666-7777-8888-999999999999"
                      type: "syslog-server"
                      operation: "update"
                      properties:
                        - name: "syslog-severity"
                          type: "enumeration"
                          value: "ERROR"
                          origin: "Global"
                        - name: "port"
                          type: "number"
                          value: 1514
                          origin: "Global"
      responses:
        '200':
          description: Objects modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAPIResponseArray'
              examples:
                createSuccess:
                  summary: Object created successfully
                  value:
                    - id: "11111111-2222-3333-4444-555555555555"
                      status: "success"
                      operation: "create"
                      keys:
                        - name: "object-type"
                          value: "ntp-server"
                        - name: "feature-path"
                          value: "/ntp-server-feature"
                updateSuccess:
                  summary: Object updated successfully
                  value:
                    - id: "11111111-2222-3333-4444-555555555555"
                      status: "success"
                      operation: "update"
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
              examples:
                invalidPriority:
                  summary: Invalid priority value
                  value:
                    error:
                      code: 400
                      message: "priority must be between 1 and 16"
                missingRequired:
                  summary: Missing required field
                  value:
                    error:
                      code: 400
                      message: "server is a required field"
                invalidSyslogSeverity:
                  summary: Invalid syslog severity
                  value:
                    error:
                      code: 400
                      message: "syslog-severity must be one of: EMERGENCY, ALERT, CRITICAL, ERROR, WARNING, NOTICE, INFORMATIONAL, DEBUG"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

  /global-profile/feature/object/delete:
    post:
      operationId: deleteGlobalProfileObjects
