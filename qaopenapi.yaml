  /configuration-profile/device/conflict/feature-tree:
    get:
      operationId: getConflictDeviceFeatureTree
      tags:
        - DeviceConflict
      summary: Retrieve device feature tree filtered to show only conflicting items
      description: |
        Returns a filtered feature tree for a device containing ONLY features, objects, and properties that have conflicts.
        This endpoint uses the same response structure as `/configuration-profile/device/{deviceId}/feature-tree` 
        but applies filtering logic to include only conflicting items.

        **Filtering Logic:**
        - A **property** is included if it has a conflict (cloud value differs from device value)
        - An **object** is included if ANY of its properties have conflicts
        - A **feature** is included if ANY of its objects have conflicts

        **Use Cases:**
        - Display only conflicting configuration items in UI for focused conflict resolution
        - Quickly identify what needs attention before deployment
        - Generate conflict reports for review
        - Streamline conflict resolution workflow by hiding non-conflicting items

        **Response:**
        - If no conflicts exist, returns 404 error with message "No conflicts found for the device"
        - Properties without conflicts are excluded from the response
        - Objects without conflicting properties are excluded from the response
        - Features without conflicting objects are excluded from the response
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the device
          example: "123e4567-e89b-12d3-a456-426614174000"
