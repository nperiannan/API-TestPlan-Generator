                      - name: "deviceModelIds"
                        value: "invalid-uuid-123"
                    error:
                      code: 1001
                      message: "Invalid device model ID 'invalid-uuid-123'"
        "401":
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
