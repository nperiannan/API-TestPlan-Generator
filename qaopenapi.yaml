            operation: "add"
            objects:
              - type: "syslog-server"
                operation: "add"
                properties:
                  - name: "name"
                    type: "string"
                    value: "mgmt-syslog"
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "10.0.0.50"
                    origin: "Global"
                  - name: "vr-name"
                    type: "string"
                    value: "VR-Mgmt"
                    origin: "Global"
                  - name: "port"
                    type: "number"
                    value: 1514
                    origin: "Global"
                  - name: "syslog-facility"
                    type: "enumeration"
                    value: "LOCAL7"
                    origin: "Global"
                  - name: "syslog-severity"
                    type: "enumeration"
                    value: "INFORMATIONAL"
                    origin: "Global"

        createSyslogServerCriticalOnly:
          summary: Add Syslog Server for Critical Events Only
          description: Add syslog server configured to receive only critical and above severity
          value:
            featurePath: "/syslog-server-feature"
            objectType: "syslog-server"
            operation: "add"
            objects:
              - type: "syslog-server"
                operation: "add"
                properties:
                  - name: "name"
                    type: "string"
                    value: "critical-alerts"
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "syslog.enterprise.com"
                    origin: "Global"
                  - name: "port"
                    type: "number"
                    value: 514
                    origin: "Global"
                  - name: "syslog-facility"
                    type: "enumeration"
                    value: "LOCAL0"
                    origin: "Global"
                  - name: "syslog-severity"
                    type: "enumeration"
                    value: "CRITICAL"
                    origin: "Global"

        updateSyslogServerGlobal:
          summary: Update Syslog Server in Global Profile
          description: Modify an existing syslog server entry
          value:
            featurePath: "/syslog-server-feature"
            objectType: "syslog-server"
            operation: "update"
            objects:
              - id: "778a9012-e89b-12d3-a456-426614174030"
                type: "syslog-server"
                operation: "update"
                properties:
                  - name: "syslog-severity"
                    type: "enumeration"
                    value: "ERROR"
                    origin: "Global"
                  - name: "port"
                    type: "number"
                    value: 1514
                    origin: "Global"

        # =====================================================================
        # SNMP CONFIGURATION EXAMPLES (Configuration Profile)
        # Feature Path: /infrastructure-feature/snmp-feature (if available)
        # Origin: "CC" for Configuration Profile objects
        # Note: Verify feature availability in your blueprint version
        # =====================================================================
        createSNMPv3User:
          summary: Add SNMPv3 User
          description: Add an SNMPv3 user for monitoring
          value:
            featurePath: "/infrastructure-feature/snmp-feature"
            objectType: "snmp-v3-user"
            operation: "add"
            objects:
              - type: "SNMPv3Users"
                operation: "add"
                properties:
                  username: "admin"
                  authType: "SHA"
                  authPassword: "auth_password_123"
                  privType: "AES"
                  privPassword: "priv_password_456"
                  origin: "CC"

        createSNMPTrap:
          summary: Add SNMP Trap Configuration
          description: Configure SNMP trap destination
          value:
            featurePath: "/infrastructure-feature/snmp-feature"
            objectType: "snmp-trap"
            operation: "add"
            objects:
              - type: "SNMPTraps"
                operation: "add"
                properties:
                  enabled: true
                  trapServer: "192.168.10.50"
                  trapPort: 162
                  communityString: "public"
                  origin: "CC"

        updateSNMPv3User:
          summary: Update SNMPv3 User
          description: Modify SNMPv3 user credentials
          value:
            featurePath: "/infrastructure-feature/snmp-feature"
            objectType: "snmp-v3-user"
            operation: "update"
            objects:
              - id: "567a8901-e89b-12d3-a456-426614174016"
                type: "SNMPv3Users"
                operation: "update"
                properties:
                  authType: "SHA"
                  authPassword: "new_auth_password"
                  privType: "AES"
                  origin: "CC"

        # =====================================================================
        # WLAN CONFIGURATION EXAMPLES
        # Feature Path: /wlan-feature (from extreme-wireless-blueprint.yang)
        # Object Type: wlan
        # Origin: "CC" for Configuration Profile objects
        # =====================================================================
        createWLAN:
          summary: Create Wireless LAN
          description: Add a new WLAN (SSID) configuration
          value:
            featurePath: "/wlan-feature"
            objectType: "wlan"
            operation: "add"
            objects:
              - type: "WLANConfig"
                operation: "add"
                properties:
                  ssid: "Enterprise-WiFi"
                  enabled: true
                  broadcastSSID: true
                  band: "5GHz"
                  securityType: "WPA2"
                  authenticationMode: "Enterprise"
                  origin: "CC"

        createGuestWLAN:
          summary: Create Guest WLAN
          description: Add a guest wireless network
          value:
            featurePath: "/wlan-feature"
            objectType: "wlan"
            operation: "add"
            objects:
              - type: "WLANConfig"
                operation: "add"
                properties:
                  ssid: "Guest-WiFi"
                  enabled: true
                  broadcastSSID: true
                  band: "dual"
                  securityType: "WPA2"
                  authenticationMode: "PSK"
                  presharedKey: "GuestAccess2024!"
                  vlanId: 999
                  origin: "CC"

        updateWLAN:
          summary: Update WLAN Configuration
          description: Modify WLAN settings
          value:
            featurePath: "/wlan-feature"
            objectType: "wlan"
            operation: "update"
            objects:
              - id: "345e6789-e89b-12d3-a456-426614174000"
                type: "WLANConfig"
                operation: "update"
                properties:
                  ssid: "Corporate-WiFi"
                  band: "6GHz"
                  origin: "CC"

        # =====================================================================
        # PORT CONFIGURATION EXAMPLES
        # Feature Path: /network-feature/interface-feature/port-feature
        # Object Type: port (from extreme-intent-port.yang)
        # Origin: "CC" for Configuration Profile objects
        # =====================================================================
        createPortConfig:
          summary: Configure Switch Port
          description: Add port configuration for access mode
          value:
            featurePath: "/network-feature/interface-feature/port-feature"
            objectType: "port"
            operation: "add"
            objects:
              - type: "PortConfig"
                operation: "add"
                properties:
                  portName: "GigabitEthernet1/0/1"
                  mode: "access"
                  accessVlan: 100
                  enabled: true
                  description: "Workstation port"
                  origin: "CC"

        createTrunkPort:
          summary: Configure Trunk Port
          description: Configure a trunk port with multiple VLANs
          value:
            featurePath: "/network-feature/interface-feature/port-feature"
            objectType: "port"
            operation: "add"
            objects:
              - type: "PortConfig"
                operation: "add"
                properties:
                  portName: "GigabitEthernet1/0/24"
                  mode: "trunk"
                  nativeVlan: 1
                  allowedVlans: "100,200,300,400"
                  enabled: true
                  description: "Uplink trunk port"
                  origin: "CC"

        updatePortConfig:
          summary: Update Port Configuration
          description: Modify port settings
          value:
            featurePath: "/network-feature/interface-feature/port-feature"
            objectType: "port"
            operation: "update"
            objects:
              - id: "456f7890-e89b-12d3-a456-426614174003"
                type: "PortConfig"
                operation: "update"
                properties:
                  mode: "trunk"
                  allowedVlans: "100,200,300"
                  origin: "CC"

        # =====================================================================
        # QoS CONFIGURATION EXAMPLES
        # Feature Path: /infrastructure-feature/qos-feature (if available)
        # Note: Verify feature availability in your blueprint version
        # Origin: "CC" for Configuration Profile objects
        # =====================================================================
        createQoSPolicy:
          summary: Create QoS Policy
          description: Add a Quality of Service policy
          value:
            featurePath: "/infrastructure-feature/qos-feature"
            objectType: "qos-policy"
            operation: "add"
            objects:
              - type: "QoSPolicy"
                operation: "add"
                properties:
                  name: "Voice-QoS"
                  description: "QoS policy for voice traffic"
                  dscp: 46
                  priority: 7
                  bandwidthPercent: 30
                  origin: "CC"

        createVideoQoS:
          summary: Create Video QoS Policy
          description: Add QoS policy for video conferencing
          value:
            featurePath: "/infrastructure-feature/qos-feature"
            objectType: "qos-policy"
            operation: "add"
            objects:
              - type: "QoSPolicy"
                operation: "add"
                properties:
                  name: "Video-QoS"
                  description: "QoS policy for video conferencing"
                  dscp: 34
                  priority: 5
                  bandwidthPercent: 25
                  origin: "CC"

        # =====================================================================
        # RADIUS CONFIGURATION EXAMPLES
        # Feature Path: /radius-server-feature (from extreme-global-blueprint.yang)
        # Object Type: radius-server
        # Origin: "Global" for Global Profile objects
        # =====================================================================
        createRADIUSServer:
          summary: Add RADIUS Server
          description: Configure a RADIUS authentication server
          value:
            featurePath: "/radius-server-feature"
            objectType: "radius-server"
            operation: "add"
            objects:
              - type: "RADIUSServer"
                operation: "add"
                properties:
                  serverAddress: "192.168.1.10"
                  port: 1812
                  sharedSecret: "radius_secret_key"
                  timeout: 5
                  retries: 3
                  priority: 1
                  origin: "CC"

        # =====================================================================
        # SECURITY SETTINGS EXAMPLES
        # =====================================================================
        createSecuritySettings:
          summary: Create Security Settings
          description: Add security configuration for WLAN
          value:
            featurePath: "/wlan-feature"
            objectType: "wlan-security"
            operation: "add"
            objects:
              - type: "SecuritySettings"
                operation: "add"
                properties:
                  securityType: "WPA3"
                  authenticationMode: "Enterprise"
                  radiusServer: "192.168.1.10"
                  radiusPort: 1812
                  radiusSecret: "radius_shared_secret"
                  origin: "CC"

    ObjectModifyItem:
      type: object
      description: |
        Single object to add or update within a feature.
        
        **For ADD operations:** Omit the `id` field
        **For UPDATE operations:** Include the `id` field with the existing object's UUID
      properties:
        id:
          type: string
          format: uuid
          description: Object ID (required for update, omit for add)
          example: "123e4567-e89b-12d3-a456-426614174000"
        type:
          type: string
          description: Object type name
          example: "VLANConfig"
        operation:
          type: string
          enum: [add, update]
          description: Operation type
          example: "add"
        properties:
          type: object
          description: Property values as key-value pairs
          additionalProperties: true
        groupId:
          type: string
          format: uuid
          description: Group to add the object to (optional)
      required:
        - operation
        - properties
      examples:
        # VLAN Examples
        addVLAN:
          summary: Add VLAN object
          value:
            type: "VLANConfig"
            operation: "add"
            properties:
              vlanId: 100
              name: "Data-VLAN"
              description: "Data VLAN for workstations"
              priority: 1
        
        updateVLAN:
          summary: Update VLAN object
          value:
            id: "234f5678-e89b-12d3-a456-426614174001"
            type: "VLANConfig"
            operation: "update"
            properties:
              description: "Updated Data VLAN"
              priority: 2
        
        # DNS Examples
        addDNSEntry:
          summary: Add DNS Entry object
          value:
            type: "DNSEntryConfig"
            operation: "add"
            properties:
              priority: 1
              ipAddress: "8.8.8.8"
              description: "Google DNS"
              origin: "Global"
        
        # NTP Examples
        addNTPServer:
          summary: Add NTP Server object
          value:
            type: "NTPServerConfig"
            operation: "add"
            properties:
              priority: 1
              ipAddress: "time.nist.gov"
              authenticationKey: "ntp_key_123"
              origin: "Global"
        
        # DHCP Examples
        addDHCPServer:
          summary: Add DHCP Server object
          value:
            type: "DHCPServerConfig"
            operation: "add"
            properties:
              priority: 1
              ipAddress: "192.168.1.10"
              name: "Primary-DHCP"
              origin: "Global"
        
        # SNMP Examples
        addSNMPv3User:
          summary: Add SNMPv3 User object
          value:
            type: "SNMPv3Users"
            operation: "add"
            properties:
              username: "admin"
              authType: "SHA"
              authPassword: "auth_pass_123"
              privType: "AES"
              privPassword: "priv_pass_456"
        
        addSNMPTrap:
          summary: Add SNMP Trap object
          value:
            type: "SNMPTraps"
            operation: "add"
            properties:
              enabled: true
              trapServer: "192.168.10.50"
              trapPort: 162
              communityString: "public"
        
        # WLAN Examples
        addWLAN:
          summary: Add WLAN object
          value:
            type: "WLANConfig"
            operation: "add"
            properties:
              ssid: "Enterprise-WiFi"
              enabled: true
              broadcastSSID: true
              band: "5GHz"
              securityType: "WPA2"
              authenticationMode: "Enterprise"
        
        # Port Examples
        addAccessPort:
          summary: Add Access Port object
          value:
            type: "PortConfig"
            operation: "add"
            properties:
              portName: "GigabitEthernet1/0/1"
              mode: "access"
              accessVlan: 100
              enabled: true
              description: "Workstation port"
        
        addTrunkPort:
          summary: Add Trunk Port object
          value:
            type: "PortConfig"
            operation: "add"
            properties:
              portName: "GigabitEthernet1/0/24"
              mode: "trunk"
              nativeVlan: 1
              allowedVlans: "100,200,300"
              description: "Uplink trunk"
        
        # QoS Examples
        addQoSPolicy:
          summary: Add QoS Policy object
          value:
            type: "QoSPolicy"
            operation: "add"
            properties:
              name: "Voice-QoS"
              description: "Voice traffic policy"
              dscp: 46
              priority: 7
              bandwidthPercent: 30
        
        # Security Examples
        addSecuritySettings:
          summary: Add Security Settings object
          value:
            type: "SecuritySettings"
            operation: "add"
            properties:
              securityType: "WPA3"
              authenticationMode: "Enterprise"
              radiusServer: "192.168.1.10"
              radiusPort: 1812

    DeleteObjectsRequest:
      type: object
      description: Request to delete objects
      properties:
        featurePath:
          type: string
        objectType:
          type: string
        objectIds:
          type: array
          description: IDs of objects to delete
          items:
            type: string
            format: uuid
      required:
        - featurePath
        - objectIds

    ObjectCloneRequest:
      type: object
      description: Request to clone an object
      properties:
        sourceObjectId:
          type: string
          format: uuid
          description: ID of object to clone
        newKeyValues:
          type: object
          description: Key property values for the clone (must be unique)
          additionalProperties: true
        propertyOverrides:
          type: object
          description: Properties to override in the clone
          additionalProperties: true
        targetGroupId:
          type: string
          format: uuid
          description: Group for the cloned object
      required:
        - sourceObjectId
        - newKeyValues

    RestoreObjectsRequest:
      type: object
      description: Request to restore objects to defaults
      properties:
        featurePath:
          type: string
        objectIds:
          type: array
          description: IDs of objects to restore
          items:
            type: string
            format: uuid
        restoreProperties:
          type: array
          description: Specific properties to restore (if empty, restores all)
          items:
            type: string
      required:
        - featurePath
        - objectIds

    # ==========================================================================
    # OBJECT GROUP SCHEMAS
    # ==========================================================================

    CreateObjectGroupRequest:
      type: object
      description: Request to create an object group
      properties:
        featurePath:
          type: string
        objectType:
          type: string
        name:
          type: string
          description: Group name
          minLength: 1
          maxLength: 128
        description:
          type: string
        objectIds:
          type: array
          description: IDs of objects to include in the group
          items:
            type: string
            format: uuid
      required:
        - featurePath
        - objectType
        - name

    DeleteObjectGroupRequest:
      type: object
      description: Request to delete an object group
      properties:
        groupId:
          type: string
          format: uuid
        deleteObjects:
          type: boolean
          description: If true, also delete objects in the group
          default: false
      required:
        - groupId

    ModifyObjectGroupRequest:
      type: object
      description: Request to modify an object group
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
          description: New name (if updating)
        description:
          type: string
        addObjectIds:
          type: array
          description: Object IDs to add to the group
          items:
            type: string
            format: uuid
        removeObjectIds:
          type: array
          description: Object IDs to remove from the group
          items:
            type: string
            format: uuid
      required:
        - groupId

    CloneObjectGroupRequest:
      type: object
      description: Request to clone an object group
      properties:
        sourceGroupId:
          type: string
          format: uuid
        newName:
          type: string
          description: Name for the cloned group
        cloneObjects:
          type: boolean
          description: If true, clone objects; if false, reference same objects
          default: true
      required:
        - sourceGroupId
        - newName

    # ==========================================================================
    # SERVICE PROFILE SCHEMAS
    # ==========================================================================

    ServiceProfilePropertyOrigin:
      type: string
      description: Origin of a service profile property
      enum:
        - CC
        - CD
        - DD
        - Global
      example: "CC"

    ServiceProfilePropertyType:
      type: string
      description: Data type of a service profile property
      enum:
        - string
        - number
        - boolean
        - enumeration
        - reference
        - string-array
        - number-array
        - boolean-array
        - enumeration-array
        - reference-array
      example: "string"

    ServiceProfileProperty:
      type: object
      description: A property within a service profile object
      properties:
        name:
          type: string
          description: Name of the property
        label:
          type: string
          description: UI friendly label for the property
        type:
          $ref: '#/components/schemas/ServiceProfilePropertyType'
        origin:
          $ref: '#/components/schemas/ServiceProfilePropertyOrigin'
        value:
          description: Value of the property
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        defaultValue:
          description: Default value for the property
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        refType:
          type: string
          description: Type of the referenced object (for reference properties)
          example: "SecuritySettings"
        reference:
          type: object
          description: Optional expanded reference object (when references are resolved)
          additionalProperties: true
      required:
        - name
        - value

    ServiceProfileObject:
      type: object
      description: A configuration object within a service profile feature
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the service profile object
        type:
          type: string
          description: Type of the service profile object
          example: "network-settings"
        label:
          type: string
          description: UI friendly label for the object
        featurePath:
          type: string
          description: Path to the feature this object belongs to
          example: "wlan/network"
        properties:
          type: object
          description: Properties of this service profile object as a map where key is property name
          additionalProperties:
            $ref: '#/components/schemas/ServiceProfileProperty'
      required:
        - type
        - featurePath

    ServiceProfileObjectAPIResponse:
      type: object
      description: Service profile object in API response format
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the service profile object
        type:
          type: string
          description: Type of the service profile object
        label:
          type: string
          description: UI friendly label for the object
        featurePath:
          type: string
          description: Path to the feature this object belongs to
        properties:
          type: object
          description: Properties as a map where key is property name
          additionalProperties:
            $ref: '#/components/schemas/ServiceProfileProperty'
      required:
        - type
        - featurePath

    ServiceProfileFeature:
      type: object
      description: A feature within a service profile
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the service profile feature
        blueprintId:
          type: string
          format: uuid
          description: Unique identifier for the blueprint this feature belongs to
        name:
          type: string
          description: Name of the feature
          example: "network"
        label:
          type: string
          description: UI friendly label for the feature
        description:
          type: string
          description: Description of the feature
        featurePath:
          type: string
          description: Path to this feature within the service profile
          example: "wlan/network"
        enabled:
          type: boolean
          description: Whether this feature is enabled
        features:
          type: array
          description: List of sub-features in this service profile feature
          items:
            $ref: '#/components/schemas/ServiceProfileFeature'
        objects:
          type: array
          description: Service Profile objects for this feature
          items:
            $ref: '#/components/schemas/ServiceProfileObjectAPIResponse'
      required:
        - blueprintId
        - name
        - featurePath
        - enabled

    ServiceProfile:
      type: object
      description: A service profile containing reusable configurations
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the service profile
        name:
          type: string
          description: Service profile name
          example: "Corporate-WLAN-Settings"
        description:
          type: string
          description: Description of the service profile
        features:
          type: array
          description: List of features in this service profile
          items:
            $ref: '#/components/schemas/ServiceProfileFeature'
        associated_config_profiles_count:
          type: integer
          description: Number of configuration profiles associated with this service profile
        time:
          type: string
          format: date-time
          description: Creation or last modified time
      required:
        - name
        - features

    ServiceProfileSummary:
      type: object
      description: Summary view of a service profile
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        blueprintName:
          type: string
        objectCount:
          type: integer
          description: Number of objects in this service profile
        usageCount:
          type: integer
          description: Number of configuration profiles using this service profile
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceProfilesRequest:
      type: object
      description: Request to list service profiles
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationQuery'
        filter:
          type: object
          properties:
            search:
              type: string
              description: Search term for filtering service profiles
            blueprintNames:
              type: array
              description: Filter by blueprint names
              items:
                type: string

    ServiceProfilesResponse:
      type: object
      description: Response containing service profiles
      properties:
        serviceProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ServiceProfile'
        pagination:
          $ref: '#/components/schemas/PaginationModel'

    CreateServiceProfileRequest:
      type: object
      description: Request to create a service profile
      properties:
        name:
          type: string
          description: Service profile name (must be unique)
          example: "Corporate-WLAN-Settings"
        description:
          type: string
          description: Description (max 1024 characters)
        blueprintId:
          type: string
          format: uuid
          description: Blueprint ID for the service profile type
      required:
        - name
        - blueprintId

    ServiceProfileUpdateRequest:
      type: object
      description: Fields allowed for update of a service profile (name is immutable)
      properties:
        description:
          type: string
          description: Updated description (max 1024 characters)

    ServiceProfileUsage:
      type: object
      description: Usage information for a service profile across configuration profiles
      properties:
        usageCount:
          type: integer
          description: Number of configuration profiles using this service profile
        configurationProfiles:
          type: array
          description: List of configuration profiles using this service profile
          items:
            $ref: '#/components/schemas/ConfigurationProfileInServiceProfileUsage'
      required:
        - usageCount
        - configurationProfiles

    ConfigurationProfileInServiceProfileUsage:
      type: object
      description: Configuration profile reference in service profile usage
      properties:
        profileId:
          type: string
          format: uuid
          description: Configuration profile ID
        profileName:
          type: string
          description: Configuration profile name
        featurePath:
          type: string
          description: Where the service profile is used in the configuration profile

    ServiceProfileUsageResponse:
      type: object
      description: Response showing service profile usage
      properties:
        serviceProfileName:
          type: string
        usedByProfiles:
          type: array
          items:
            type: object
            properties:
              profileName:
                type: string
              profileId:
                type: string
                format: uuid
              featurePath:
                type: string
                description: Where the service profile is used

    FeatureUsageRequest:
      type: object
      description: Request for feature usage information
      properties:
        featurePath:
          type: string
        objectType:
          type: string
        objectIds:
          type: array
          items:
            type: string
            format: uuid

    FeatureUsageResponse:
      type: object
      description: Response containing feature usage
      properties:
        usageInfo:
          type: array
          items:
            type: object
            properties:
              objectId:
                type: string
                format: uuid
              objectName:
                type: string
              usedByProfiles:
                type: array
                items:
                  type: object
                  properties:
                    profileName:
                      type: string
                    featurePath:
                      type: string

    # ==========================================================================
    # TARGET QUERY SCHEMAS
    # ==========================================================================

    TargetScope:
      type: object
      description: Target scope defining which devices receive configuration
      properties:
        scopeType:
          type: string
          enum: [all, sites, devices, tags, custom]
          description: Type of scope selection
        sites:
          type: array
          description: Site names (when scopeType is sites)
          items:
            type: string
        devices:
          type: array
          description: Device hostnames (when scopeType is devices)
          items:
            type: string
        tags:
          type: array
          description: Tag expressions (when scopeType is tags)
          items:
            $ref: '#/components/schemas/TagExpression'
        customQuery:
          type: string
          description: Custom query expression (when scopeType is custom)
        excludedDevices:
          type: array
          description: Devices to exclude from scope
          items:
            type: string
        excludedSites:
          type: array
          description: Sites to exclude from scope
          items:
            type: string

    TagExpression:
      type: object
      description: Tag-based filtering expression
      properties:
        tagName:
          type: string
        operator:
          type: string
          enum: [equals, notEquals, contains, exists, notExists]
        value:
          type: string

    TargetQuery:
      type: object
      description: Target query for device selection with include/exclude criteria
      properties:
        includeQuery:
          $ref: '#/components/schemas/Query'
        excludeQuery:
          $ref: '#/components/schemas/Query'

    TargetQueryWithPagination:
      type: object
      description: Target query with optional pagination support
      allOf:
        - $ref: '#/components/schemas/TargetQuery'
        - type: object
          properties:
            paginationQuery:
              $ref: '#/components/schemas/PaginationQuery'

    Query:
      type: object
      description: Query definition with logical operator and criteria
      properties:
        logicalOperator:
          type: string
          description: Logical operator to apply to criteria
          enum:
            - AND
            - OR
        criteria:
          type: array
          description: List of criteria for this query
          items:
            $ref: '#/components/schemas/QueryCriterion'
      required:
        - logicalOperator
        - criteria

    QueryCriterion:
      type: object
      description: Single criterion in a target query
      properties:
        field:
          $ref: '#/components/schemas/TargetQueryField'
        values:
          type: array
          description: List of values to match
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        operator:
          type: string
          description: Comparison operator
          enum:
            - IN
            - NOT_IN
      required:
        - field
        - values
        - operator

    TargetQueryField:
      type: string
      description: Field used in target query criteria for device selection
      enum:
        - siteId
        - modelId
        - modelGroupId
        - deviceId
      example: "siteId"

    TargetQueryResult:
      type: object
      description: Result of target query processing containing resolved devices
      properties:
        targetQueryId:
          type: string
          format: uuid
          description: Unique identifier for the target query assignment
        configurationProfile:
          type: string
          description: Name of the configuration profile associated with this target query
        resolvedDevices:
          type: array
          description: List of devices resolved from the target query criteria
          items:
            $ref: '#/components/schemas/ResolvedDevice'
        totalDeviceCount:
          type: integer
          description: Total number of devices resolved from the target query
        page:
          type: integer
          description: Current page number (present when pagination is used)
        limit:
          type: integer
          description: Number of items per page (present when pagination is used)
        totalPages:
          type: integer
          description: Total number of pages (present when pagination is used)
        hasMore:
          type: boolean
          description: Whether there are more pages available
      required:
        - targetQueryId
        - configurationProfile
        - resolvedDevices
        - totalDeviceCount

    ResolvedDevice:
      type: object
      description: Device information resolved from target query
      properties:
        deviceId:
          type: string
          description: Unique identifier for the device
        deviceName:
          type: string
          description: Human-readable name of the device
        deviceType:
          type: string
          description: Type of the device (SWITCH, AP, ROUTER)
          enum:
            - SWITCH
            - AP
            - ROUTER
        site:
          $ref: '#/components/schemas/Site'
        model:
          $ref: '#/components/schemas/DeviceModel'
      required:
        - deviceId
        - deviceName
        - site
        - model

    Site:
      type: object
      description: Site location information for device targeting
      properties:
        siteId:
          type: string
          format: uuid
          description: Site ID
        siteName:
          type: string
          description: Site name
      required:
        - siteId
        - siteName

    DeviceModel:
      type: object
      description: Device model information for target query results
      properties:
        modelId:
          type: string
          description: Unique identifier for the device model
        modelName:
          type: string
          description: Human-readable name of the device model
      required:
        - modelId
        - modelName

    SetScopeRequest:
      type: object
      description: Request to set target scope
      properties:
        scope:
          $ref: '#/components/schemas/TargetQuery'
      required:
        - scope

    SetTargetQueryRequest:
      type: object
      description: Request to set a target query
      properties:
        targetQuery:
          $ref: '#/components/schemas/TargetQuery'
      required:
        - targetQuery

    # ==========================================================================
    # DEPLOYMENT SCHEMAS
    # ==========================================================================

    DeployProfilesWithDeployNow:
      type: object
      description: Request to deploy configuration profiles immediately
      properties:
        profiles:
          type: array
          description: A list of configuration profile names to be deployed
          items:
            type: string
          example: ["Campus-Profile", "Datacenter-Profile"]
        deployNow:
          type: boolean
          description: Set to true to deploy immediately. Cannot be used with deployAt.
          enum: [true]
        includeDevicesAlreadyDeployed:
          type: boolean
          description: |
            Controls whether devices already deployed are included.
            Default is false (already deployed devices are excluded).
            Set to true to redeploy to all devices, including those already deployed.
          default: false
      required:
        - profiles
        - deployNow

    DeployProfilesWithDeployAt:
      type: object
      description: Request to schedule deployment of configuration profiles
      properties:
        profiles:
          type: array
          description: A list of configuration profile names to be deployed
          items:
            type: string
          example: ["Campus-Profile", "Datacenter-Profile"]
        deployAt:
          type: string
          format: date-time
          description: Schedules the deployment at the specified UTC time. Cannot be used with deployNow.
          example: "2025-03-15T10:00:00Z"
        timezone:
          type: string
          description: |
            Timezone for the scheduled deployment.
            Examples: 'America/New_York', 'Europe/London', 'Asia/Tokyo'
            If not specified, UTC is assumed.
          example: "America/New_York"
        includeDevicesAlreadyDeployed:
          type: boolean
          description: Controls whether devices already deployed are included. Default is false.
          default: false
      required:
        - profiles
        - deployAt

    DeployProfilesResponse:
      type: object
      description: Response from deploying configuration profiles
      properties:
        deploymentExecutionId:
          type: string
          description: Unique identifier for this deployment execution
          example: "abc123-execution-id"
        type:
          type: string
          description: Type of deployment
          enum:
            - immediate
            - scheduled
        responses:
          type: array
          description: Results for each profile
          items:
            $ref: '#/components/schemas/BatchAPIResponse'

    DeploySitesWithDeployNow:
      type: object
      description: Request to deploy to sites immediately
      properties:
        sites:
          type: array
          description: A list of site names to be deployed
          items:
            type: string
          example: ["Headquarters", "Branch-Office-1"]
        deployNow:
          type: boolean
          description: Set to true to deploy immediately
          enum: [true]
        includeDevicesAlreadyDeployed:
          type: boolean
          description: Controls whether devices already deployed are included
          default: false
      required:
        - sites
        - deployNow

    DeploySitesWithDeployAt:
      type: object
      description: Request to schedule deployment to sites
      properties:
        sites:
          type: array
          description: A list of site names to be deployed
          items:
            type: string
          example: ["Headquarters", "Branch-Office-1"]
        deployAt:
          type: string
          format: date-time
          description: Schedules the deployment at the specified UTC time
        timezone:
          type: string
          description: Timezone for the scheduled deployment
          example: "America/New_York"
        includeDevicesAlreadyDeployed:
          type: boolean
          description: Controls whether devices already deployed are included
          default: false
      required:
        - sites
        - deployAt

    DeploySitesUnderConfigurationProfileResponse:
      type: object
      description: Response from deploying sites under a configuration profile
      properties:
        deploymentExecutionId:
          type: string
          description: Unique identifier for this deployment execution
        profileId:
          type: string
          description: ID of the configuration profile
        profileName:
          type: string
          description: Name of the configuration profile
        type:
          type: string
          description: Type of deployment
          enum:
            - immediate
            - scheduled
        responses:
          type: array
          items:
            $ref: '#/components/schemas/BatchAPIResponse'

    DeployDevicesWithDeployNow:
      type: object
      description: Request to deploy to devices immediately
      properties:
        devices:
          type: array
          description: A list of device names/hostnames to be deployed
          items:
            type: string
          example: ["switch-floor1-001", "switch-floor1-002"]
        deployNow:
          type: boolean
          description: Set to true to deploy immediately
          enum: [true]
        includeDevicesAlreadyDeployed:
          type: boolean
          description: Controls whether devices already deployed are included
          default: false
      required:
        - devices
        - deployNow

    DeployDevicesWithDeployAt:
      type: object
      description: Request to schedule deployment to devices
      properties:
        devices:
          type: array
          description: A list of device names/hostnames to be deployed
          items:
            type: string
          example: ["switch-floor1-001", "switch-floor1-002"]
        deployAt:
          type: string
          format: date-time
          description: Schedules the deployment at the specified UTC time
        timezone:
          type: string
          description: Timezone for the scheduled deployment
          example: "America/New_York"
        includeDevicesAlreadyDeployed:
          type: boolean
          description: Controls whether devices already deployed are included
          default: false
      required:
        - devices
        - deployAt

    DeployDevicesUnderConfigurationProfileResponse:
      type: object
      description: Response from deploying devices under a configuration profile
      properties:
        deploymentExecutionId:
          type: string
          description: Unique identifier for this deployment execution
        profileId:
          type: string
          description: ID of the configuration profile
        profileName:
          type: string
          description: Name of the configuration profile
        type:
          type: string
          description: Type of deployment
          enum:
            - immediate
            - scheduled
        responses:
          type: array
          items:
            $ref: '#/components/schemas/BatchAPIResponse'

    ConfigurationProfileDeploymentStatusResponse:
      type: object
      description: Deployment status response for a configuration profile
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the configuration profile
        name:
          type: string
          description: Name of the configuration profile
        deploymentStatus:
          type: string
          description: Overall deployment status of the profile
          enum:
            - draft
            - scheduled
            - deploying
            - deployed
            - failed
        scheduledTime:
          type: string
          format: date-time
          nullable: true
          description: Scheduled deployment time in UTC
        timezone:
          type: string
          nullable: true
          description: Timezone for the scheduled deployment
          example: "America/New_York"
        siteCount:
          type: integer
          description: Total number of sites in the profile
        siteCountByStatus:
          $ref: '#/components/schemas/DeploymentStatusCount'
        deviceCount:
          type: integer
          description: Total number of devices in the profile
        overrideCount:
          type: integer
          description: Number of device-specific overrides in the profile
        deviceCountByStatus:
          $ref: '#/components/schemas/DeploymentStatusCount'
        pagination:
          $ref: '#/components/schemas/PaginationModel'
        sites:
          type: array
          description: Array of site deployment statuses
          items:
            $ref: '#/components/schemas/SiteDeploymentInfo'
      required:
        - id
        - name
        - deploymentStatus
        - siteCount
        - siteCountByStatus
        - deviceCount
        - overrideCount
        - deviceCountByStatus
        - sites

    SiteDeploymentInfo:
      type: object
      description: Site deployment status information
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the site
        name:
          type: string
          description: Name of the site
        deploymentStatus:
          type: string
          enum:
            - draft
            - scheduled
            - deploying
            - deployed
            - failed
        deviceCount:
          type: integer
          description: Number of devices in this site
        overrideCount:
          type: integer
          description: Number of overrides in this site
        deviceCountByStatus:
          $ref: '#/components/schemas/DeploymentStatusCount'

    SiteDeploymentStatusResponse:
      type: object
      description: Detailed deployment status for a site under a configuration profile
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the site
        name:
          type: string
          description: Name of the site
        profileId:
          type: string
          format: uuid
          description: Unique identifier for the configuration profile
        profileName:
          type: string
          description: Name of the configuration profile
        deploymentStatus:
          type: string
          enum:
            - draft
            - scheduled
            - deploying
            - deployed
            - failed
        deploymentProgress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          description: Overall deployment progress percentage
        scheduledTime:
          type: string
          format: date-time
          nullable: true
          description: Scheduled deployment time in UTC
        timezone:
          type: string
          nullable: true
          description: Timezone for the scheduled deployment
        deviceCount:
          type: integer
          format: int32
          description: Total number of devices in this site
        overrideCount:
          type: integer
          format: int32
          description: Number of device-specific overrides in this site
        deviceCountByStatus:
