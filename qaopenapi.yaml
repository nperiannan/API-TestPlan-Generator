          description: SKU installed in this slot
          example: "5520-24T-Base"
        skuDescription:
          type: string
          description: Description of the SKU
        portCount:
          type: integer
          description: Number of ports in this slot
        portTypes:
          type: array
          description: Port types available in this slot
          items:
            type: string
      required:
