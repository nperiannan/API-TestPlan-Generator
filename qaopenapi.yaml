  /inventory/models/retrieve:
    post:
      operationId: retrieveDeviceModels
      tags:
        - Inventory
      summary: Retrieve device models with pagination, filtering, and fuzzy search
      description: |
        Retrieves a list of device models with support for pagination, filtering, fuzzy search, and model family filtering.

        **Features:**
        - **Pagination**: Control page number and page size (max 100 per page)
        - **Model Families**: Filter by one or more model families (e.g., "5000 Series", "X-Series")
        - **Filter**: Exact or prefix match on model name (e.g., "5520" matches "5520", "AP" matches "AP410C", "AP460C")
        - **Search**: Case-insensitive partial match on model name (e.g., "switch" finds models with "switch" anywhere in the name)

        **Filter vs Search:**
        - `modelFamilies` filters by model family names (array of strings)
        - `filter` performs exact or prefix matching on model name (more precise)
        - `search` performs case-insensitive substring matching on model name (more flexible)
        - All filters can be used together (AND condition)

        **Use Cases:**
        1. **Basic pagination**: `{"page": 1, "pageSize": 20}`
        2. **Filter by model families**: `{"modelFamilies": ["5000 Series", "X-Series"]}`
        3. **Filter by model prefix**: `{"filter": "552"}` (finds 5520, 5520M, etc.)
        4. **Fuzzy search**: `{"search": "wifi"}` (case-insensitive partial match)
        5. **Combined**: `{"modelFamilies": ["5000 Series"], "search": "52", "page": 1, "pageSize": 10}`
        6. **Get all (default)**: `{}` or no body (returns first 20 models)

        All parameters are optional. Default: page=1, pageSize=20.
      requestBody:
        required: false
        description: |
          Optional request body with pagination and search parameters.
          If not provided or empty, returns first 20 models with default pagination.
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  description: Page number (1-based). Default is 1.
                  example: 1
                pageSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Number of models per page. Default is 20, maximum is 100.
                  example: 20
                modelFamilies:
                  type: array
                  items:
                    type: string
                  description: |
                    Optional array of model family names to filter results.
                    Only models belonging to the specified families will be returned.
                    If omitted, models from all families are returned.
                  example: ["5000 Series", "X-Series"]
                filter:
                  type: string
                  description: |
                    Exact or prefix match on model name (case-sensitive).
                    Examples: "5520" matches exact, "AP" matches "AP410C", "AP460C" (prefix)
                  example: "5520"
                search:
                  type: string
                  description: |
                    Case-insensitive partial match on model name.
                    Example: "wifi" matches models containing "wifi" or "WiFi" anywhere in the name
                  example: "switch"
            examples:
              defaultPagination:
                summary: Default pagination (first page, 20 items)
                value: {}
              customPagination:
                summary: Custom pagination
                value:
                  page: 2
                  pageSize: 10
              filterByModelFamilies:
                summary: Filter by model families
                value:
                  modelFamilies: ["5000 Series", "7000 Series"]
              filterByPrefix:
                summary: Filter by model name prefix
                value:
                  filter: "AP"
              fuzzySearch:
                summary: Fuzzy search on model name
                value:
                  search: "wifi"
              combined:
                summary: Combined model families, filter, search, and pagination
                value:
                  modelFamilies: ["5000 Series"]
                  filter: "5"
                  search: "20"
                  page: 1
                  pageSize: 5
      responses:
        "200":
          description: Models retrieved successfully with pagination metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - models
                  - pagination
                properties:
                  models:
                    type: array
                    description: Array of device models matching the criteria
                    items:
                      $ref: "#/components/schemas/ModelInfo"
                  pagination:
                    type: object
                    description: Pagination metadata for the result set
                    required:
                      - currentPage
                      - pageSize
                      - totalCount
                      - totalPages
                    properties:
                      currentPage:
                        type: integer
                        description: Current page number (1-based)
                        example: 1
                      pageSize:
                        type: integer
                        description: Number of items per page
                        example: 20
                      totalCount:
                        type: integer
                        description: Total number of models matching the criteria
                        example: 45
                      totalPages:
                        type: integer
                        description: Total number of pages
                        example: 3
              examples:
                successWithResults:
                  summary: Successful response with models
                  value:
                    models:
                      - modelId: "4355077c-a818-4603-8e83-a2fceb466ae6"
                        modelName: "5520"
                        modelVariants:
                          - variantId: "e2a98acc-8007-448d-9f48-3920be013547"
                            variantName: "5520-24W"
                            description: "24x 1G copper with 90W PoE"
                            totalPorts: 24
                      - modelId: "54f810ca-023e-4460-a301-3a83503ac0bd"
                        modelName: "5320"
                        modelVariants:
                          - variantId: "8e112ea5-1e3f-49c2-91cb-03514c23190f"
                            variantName: "5320-48T"
                            description: "48x 1G copper (non-PoE)"
                            totalPorts: 48
                    pagination:
                      currentPage: 1
                      pageSize: 20
                      totalCount: 45
                      totalPages: 3
                emptyResult:
                  summary: No models match the criteria
                  value:
                    models: []
                    pagination:
                      currentPage: 1
                      pageSize: 20
                      totalCount: 0
                      totalPages: 0
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalidPage:
                  summary: Invalid page number
                  value:
                    code: 400
                    message: "Page must be greater than 0"
                invalidPageSize:
                  summary: Invalid page size
                  value:
                    code: 400
                    message: "Page size must be between 1 and 100"
                emptyFilter:
                  summary: Empty filter string
                  value:
                    code: 400
                    message: "Filter cannot be empty"
                emptySearch:
                  summary: Empty search string
                  value:
                    code: 400
                    message: "Search cannot be empty"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"

  /inventory/models/operating-systems/retrieve:
    post:
      operationId: retrieveOperatingSystems
      tags:
        - Inventory
      summary: Retrieve operating systems for devices filtered by model and/or model variant
      description: |
        Retrieves unique operating systems running on devices that match the specified model names
        and/or model variants. The API queries onboarded devices from the inferred_device table
        and maps the OS enum values to human-readable OS names.

        This endpoint is useful for discovering which operating systems are actually deployed
        on specific hardware models in your network.

        Supports pagination and fuzzy search across OS names.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                modelNames:
                  type: array
                  items:
                    type: string
                  description: Optional list of device model names to filter by
                  example: ["5520", "5420"]
                modelVariants:
                  type: array
                  items:
                    type: string
                  description: Optional list of model variant names to filter by
                  example: ["5520-48T", "5420-24W"]
                fuzzySearchQuery:
                  type: string
                  description: Optional fuzzy search query to filter OS names
                  example: "EXOS"
                paginationQuery:
                  type: object
                  properties:
                    pageNumber:
                      type: integer
                      minimum: 1
                      default: 1
                      description: Page number (1-indexed)
                      example: 1
                    pageSize:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                      description: Number of results per page
                      example: 10
            examples:
              byModelNames:
                summary: Filter by model names
                value:
                  modelNames: ["5520", "5420"]
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 10
              byModelVariants:
                summary: Filter by model variants
                value:
                  modelVariants: ["5520-48T", "5420-24W"]
              withFuzzySearch:
                summary: With fuzzy search
                value:
                  modelNames: ["5520"]
                  fuzzySearchQuery: "EXOS"
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 10
      responses:
        "200":
          description: Operating systems retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  operatingSystems:
                    type: array
                    items:
                      type: string
                    description: List of unique operating system names
                    example: ["Switch Engine (EXOS)", "Fabric Engine (VOSS)"]
                  pagination:
                    $ref: "#/components/schemas/PaginationModel"
                required:
                  - operatingSystems
                  - pagination
              examples:
                success:
                  summary: Successful response
                  value:
                    operatingSystems:
                      - "Switch Engine (EXOS)"
                      - "Fabric Engine (VOSS)"
                      - "ExtremeCloud IQ"
                    pagination:
                      count: 3
                      page: 1
                      totalCount: 3
                      totalPages: 1
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"

