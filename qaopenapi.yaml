    PoECapability:
      type: string
      description: Power over Ethernet capability
      enum:
        - none
        - PoE
        - PoE+
        - PoE++
      example: "PoE+"

    PowerType:
      type: string
      description: Power supply type
      enum:
        - AC
        - DC
        - PoE
        - PoE+
        - PoE++
      example: "AC"

    DeviceModelInfo:
      type: object
      description: Device model information
      properties:
        id:
