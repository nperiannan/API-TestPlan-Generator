          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"

  /configuration-profile/{name}/port-mappings/{port-mappingId}/port-profiles:
    post:
      operationId: retrievePortProfilesByPortMapping
      tags:
        - PortMapping
      summary: Retrieve all port profiles used by a specific port mapping
      description: |
        Retrieves all unique port profiles referenced by the specified port mapping in the given configuration profile.
        The response includes both default profiles and per-port assigned profiles.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name of the configuration profile
          example: "Enterprise-Switch-Profile"
        - name: port-mappingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Port mapping ID to retrieve associated port profiles for
          example: "660e8400-e29b-11d4-a716-446655440001"
      responses:
        "200":
          description: Port profiles for the specified port mapping retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  portMappingId:
                    type: string
                    format: uuid
                    description: Object ID of the port mapping
                  portMappingName:
                    type: string
                    description: Name of the port mapping
                  portProfiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortConfiguration"
                    description: Unique port profiles used by this port mapping
                  totalPortProfiles:
                    type: integer
                    description: Total number of unique port profiles in this mapping
                required:
                  - portMappingId
                  - portMappingName
                  - portProfiles
                  - totalPortProfiles
              example:
                portMappingId: "660e8400-e29b-11d4-a716-446655440001"
                portMappingName: "Trunk Mapping - Floor 1"
                portProfiles:
                  - objectId: "550e8400-e29b-11d4-a716-446655440001"
