          format: uuid
          description: Unique identifier of the device model
        modelName:
          type: string
          description: Name of the device model
          example: "5520-24T"
        description:
          type: string
          description: Description of the model
        manufacturer:
          type: string
          description: Manufacturer name
          example: "Extreme Networks"
        modelFamily:
          type: string
          description: Model family grouping
          example: "5520"
        deviceType:
          $ref: '#/components/schemas/DeviceType'
      required:
        - id
        - modelName

    DeviceModelGroup:
      type: object
      description: A group of related device models
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the DeviceModelGroup
        name:
          type: string
          description: Name of the DeviceModelGroup
          example: "Enterprise Access Points"
        models:
          type: array
          items:
            $ref: '#/components/schemas/DeviceModelInfo'
      required:
        - id
        - name
        - models

    ModelDevice:
      type: object
      description: Device information with model details
      properties:
        hostName:
          type: string
          description: Device hostname
          example: "sw-floor1-001"
        ipAddress:
          type: string
          description: IP address of the device
          example: "192.168.1.10"
        macAddress:
          type: string
          description: Device MAC address
          example: "00:11:22:33:44:55"
        modelName:
          type: string
          description: Device model name
          example: "5520-24T"
        serialNumber:
          type: string
          description: Device serial number
        location:
          type: string
          description: Physical location of the device
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        slots:
