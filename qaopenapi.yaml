                    origin: "Global"

        # =====================================================================
        # DHCP CONFIGURATION EXAMPLES (Global Profile)
        # Feature Path: /dhcp-server-feature
        # Object Type: dhcp-server
        # Origin: "Global" for Global Profile objects
        # =====================================================================
