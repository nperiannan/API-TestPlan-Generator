      properties:
        id:
          type: string
          format: uuid
        modelName:
          type: string
        variantName:
          type: string
          example: "5520-24T-POE+"
        displayName:
          type: string
        portConfiguration:
          type: array
          items:
            $ref: '#/components/schemas/PortSlot'
        totalPorts:
          type: integer
        poeCapable:
          type: boolean
        maxPoeBudget:
          type: integer
          description: Maximum PoE budget in watts

    PortSlot:
      type: object
      description: A port slot in a model variant
      properties:
        slotNumber:
          type: integer
        portRange:
          type: string
          example: "1-24"
        portType:
          type: string
        portCount:
          type: integer
        supportedSpeeds:
          type: array
          items:
            type: string

    ModelVariantSkusRequest:
      type: object
      description: Request to retrieve SKUs for model variants and port types
      properties:
        modelVariants:
          type: array
          items:
            type: string
        portTypes:
          type: array
          items:
            type: string
