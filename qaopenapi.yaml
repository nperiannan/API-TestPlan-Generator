  /inventory/device-model-group/modify:
    post:
      operationId: updateDeviceModelGroup
      tags:
        - Inventory
      summary: Update an existing DeviceModelGroup
      description: Updates an existing DeviceModelGroup by adding or removing device models.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  description: ID (UUID) of the DeviceModelGroup to update
                  example: "550e8400-e29b-41d4-a716-446614174000"
                newName:
                  type: string
                  maxLength: 128
                  description: New name for the DeviceModelGroup (optional, used to rename the group)
                  example: "Enterprise-Switches"
                deviceModelIdsToAdd:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of device model IDs (UUIDs) to add to the group
                  example: ["660e8400-e29b-41d4-a716-446614174004"]
                deviceModelIdsToRemove:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of device model IDs (UUIDs) to remove from the group
                  example: ["660e8400-e29b-41d4-a716-446614174001"]
            examples:
              renameGroup:
                summary: Rename the DeviceModelGroup
                value:
                  id: "550e8400-e29b-41d4-a716-446614174000"
                  newName: "Enterprise-Switches"
              addModels:
                summary: Add models to the group
                value:
                  id: "550e8400-e29b-41d4-a716-446614174000"
                  deviceModelIdsToAdd:
                    [
                      "660e8400-e29b-41d4-a716-446614174004",
                      "660e8400-e29b-41d4-a716-446614174005",
                    ]
              removeModels:
                summary: Remove models from the group
                value:
                  id: "550e8400-e29b-41d4-a716-446614174000"
                  deviceModelIdsToRemove:
                    ["660e8400-e29b-41d4-a716-446614174001"]
              addAndRemove:
                summary: Add and remove models in one operation
                value:
                  id: "550e8400-e29b-41d4-a716-446614174000"
                  deviceModelIdsToAdd: ["660e8400-e29b-41d4-a716-446614174005"]
                  deviceModelIdsToRemove:
                    ["660e8400-e29b-41d4-a716-446614174001"]
              renameAndAddModels:
                summary: Rename group and add models
                value:
                  id: "550e8400-e29b-41d4-a716-446614174000"
                  newName: "Enterprise-Switches"
                  deviceModelIdsToAdd:
                    [
                      "660e8400-e29b-41d4-a716-446614174004",
                      "660e8400-e29b-41d4-a716-446614174005",
                    ]
      responses:
        "200":
          description: DeviceModelGroup updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAPIResponse"
              examples:
                renameOnly:
                  summary: Group renamed successfully
                  value:
                    status: "success"
                    results:
                      - status: "success"
                        keys:
                          - name: "device-model-group-id"
                            value: "550e8400-e29b-41d4-a716-446614174000"
                          - name: "new-group-name"
                            value: "Enterprise-Switches"
                        id: "550e8400-e29b-41d4-a716-446614174000"
                addModelsOnly:
                  summary: Models added successfully
                  value:
                    status: "success"
                    results:
                      - status: "success"
                        keys:
                          - name: "device-model-group-id"
                            value: "550e8400-e29b-41d4-a716-446614174000"
                          - name: "deviceModelIdsToAdd"
                            value: "660e8400-e29b-41d4-a716-446614174004, 660e8400-e29b-41d4-a716-446614174005"
                        id: "550e8400-e29b-41d4-a716-446614174000"
                removeModelsOnly:
                  summary: Models removed successfully
                  value:
                    status: "success"
                    results:
                      - status: "success"
                        keys:
                          - name: "device-model-group-id"
                            value: "550e8400-e29b-41d4-a716-446614174000"
                          - name: "deviceModelIdsToRemove"
                            value: "660e8400-e29b-41d4-a716-446614174001"
                        id: "550e8400-e29b-41d4-a716-446614174000"
                renameAndAddModels:
                  summary: Group renamed and models added
                  value:
                    status: "success"
                    results:
                      - status: "success"
                        keys:
                          - name: "device-model-group-id"
                            value: "550e8400-e29b-41d4-a716-446614174000"
                          - name: "new-group-name"
                            value: "Enterprise-Switches"
                        id: "550e8400-e29b-41d4-a716-446614174000"
                      - status: "success"
                        keys:
                          - name: "device-model-group-id"
                            value: "550e8400-e29b-41d4-a716-446614174000"
                          - name: "deviceModelIdsToAdd"
                            value: "660e8400-e29b-41d4-a716-446614174004, 660e8400-e29b-41d4-a716-446614174005"
                        id: "550e8400-e29b-41d4-a716-446614174000"
        "400":
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleAPIResponse"
              examples:
                missingId:
                  summary: Missing required id parameter
                  value:
                    keys:
                      - name: "id"
                        value: ""
                    error:
                      code: 1001
                      message: "id parameter is required"
                noModificationsProvided:
                  summary: No modifications provided
                  value:
                    keys:
                      - name: "id"
                        value: "550e8400-e29b-41d4-a716-446614174000"
                    error:
                      code: 1001
                      message: "At least one of newName, deviceModelIdsToAdd, or deviceModelIdsToRemove must be provided"
                newNameAlreadyExists:
                  summary: New name already exists
                  value:
                    keys:
                      - name: "newName"
                        value: "Enterprise-Switches"
                    error:
                      code: 1006
                      message: "DeviceModelGroup 'Enterprise-Switches' already exists"
                invalidModelId:
                  summary: Invalid device model ID provided
                  value:
                    keys:
                      - name: "deviceModelIdsToAdd"
                        value: "invalid-uuid-123"
                    error:
                      code: 1001
                      message: "Invalid device model ID 'invalid-uuid-123'"
                modelNotInGroup:
                  summary: Model to remove not found in group
                  value:
                    keys:
                      - name: "deviceModelIdsToRemove"
                        value: "660e8400-e29b-41d4-a716-446614174001"
                    error:
                      code: 1001
                      message: "Device model '660e8400-e29b-41d4-a716-446614174001' is not part of DeviceModelGroup 'Campus-Switches'"
        "401":
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              example:
                code: 1002
                message: "Invalid Token"
        "404":
          description: DeviceModelGroup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleAPIResponse"
              example:
                keys:
                  - name: "id"
                    value: "550e8400-e29b-41d4-a716-446614174000"
                error:
                  code: 1004
                  message: "DeviceModelGroup with ID '550e8400-e29b-41d4-a716-446614174000' not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleAPIResponse"
              example:
                error:
                  code: 1005
                  message: "Internal server error while updating DeviceModelGroup"

