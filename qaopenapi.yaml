                  code: 1005
                  message: "Internal server error while retrieving objects"

components:
  schemas:
    # ==========================================================================
    # COMMON RESPONSE SCHEMAS
    # ==========================================================================

    ErrorModel:
      type: object
      description: Standard error response following API error conventions
      properties:
        code:
          type: integer
          description: Internal application error code
          example: 1001
          minimum: 1000
          maximum: 9999
        message:
          type: string
          description: Human-readable error message
          example: "Invalid request parameters"
          maxLength: 1024
        details:
          type: object
          description: Additional error details (optional)
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: When the error occurred (ISO 8601 format)
      required:
        - code
        - message
      example:
        code: 1004
        message: "Configuration Profile 'wired-profile' not found"

    SingleAPIResponse:
      type: object
      description: Response for single-item operations
      properties:
        keys:
          type: array
          description: Key-value pairs based on request parameters
          items:
            $ref: '#/components/schemas/ObjectKey'
        id:
          type: string
          format: uuid
          description: Unique identifier for the configuration object
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum:
            - success
            - failed
          description: Operation status
        operation:
          type: string
          enum:
            - create
            - update
            - delete
            - retrieve
            - clone
            - deploy
          description: Type of operation performed
        error:
          $ref: '#/components/schemas/ErrorModel'
      required:
        - status

    ObjectKey:
      type: object
      description: Key-value pair for identifying objects in responses
      properties:
        name:
          type: string
          description: Key based on the object name
          example: "profile-name"
        value:
          type: string
          description: Value of the object key
          example: "Campus-Network-Profile"
      required:
        - name
        - value

    BatchAPIResponse:
      type: object
      description: Response for a single item in a batch operation
      properties:
        keys:
          type: array
          description: Key-value pairs based on request parameters
          items:
            $ref: '#/components/schemas/ObjectKey'
        id:
          type: string
          format: uuid
          description: Unique identifier for the configuration object
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum:
            - success
            - failed
          description: Status of the operation
          example: "success"
        operation:
          type: string
          enum:
            - create
            - update
            - delete
            - retrieve
            - clone
            - deploy
          description: Type of operation performed
          example: "create"
        error:
          $ref: '#/components/schemas/ErrorModel'
      required:
        - status
      example:
        keys:
          - name: "profile-name"
            value: "Campus-Network"
        id: "123e4567-e89b-12d3-a456-426614174000"
        status: "success"
        operation: "create"

    BatchAPIResponseArray:
      type: object
      description: Response for batch operations containing array of results
      properties:
        Results:
          type: array
          description: Array of results from batch operations
          items:
            $ref: '#/components/schemas/BatchAPIResponse'
      required:
        - Results

    BatchErrorResponse:
      type: object
      description: Error response for batch operations
      properties:
        Errors:
          type: array
          description: List of errors encountered during batch operations
          items:
            $ref: '#/components/schemas/BatchAPIResponse'
      required:
        - Errors

    # ==========================================================================
    # PAGINATION
    # ==========================================================================

    PaginationQuery:
      type: object
      description: Pagination parameters for list requests
      properties:
        pageNumber:
          type: integer
          minimum: 1
          default: 1
          description: Page number (1-indexed)
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
          description: Number of items per page
          example: 20

    SortQuery:
      type: object
      description: Sorting parameters for list requests
      properties:
        sortBy:
          type: string
          description: Field to sort by
          example: "name"
        order:
          type: string
          enum:
            - ASC
            - DESC
          default: ASC
          description: Sort direction (ascending or descending)

    FilterQuery:
      type: object
      description: Filter criteria for query requests
      properties:
        key:
          type: string
          description: Filter key (field name)
          example: "deploymentStatus"
        values:
          type: array
          description: Filter values - items matching any value are returned
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
          example: ["deployed", "draft"]
      required:
        - key
        - values

    FuzzySearchQuery:
      type: string
      description: Text to perform fuzzy search on configuration object properties
      maxLength: 256
      example: "VLAN-100"

    CommonQueryRequest:
      type: object
      description: Common query request with filter, fuzzy search, pagination, and timezone
      properties:
        filter:
          type: array
          description: Columns to be filtered
          items:
            $ref: '#/components/schemas/FilterQuery'
        fuzzy:
          type: string
          description: Fuzzy search string
        pagination:
          $ref: '#/components/schemas/PaginationQuery'
        sort:
          $ref: '#/components/schemas/SortQuery'
        timezone:
          type: string
          description: |
            Timezone for displaying scheduled times.
            Examples: 'America/New_York', 'Europe/London', 'Asia/Tokyo'
            If not specified, UTC is assumed.
          example: "America/New_York"

    PaginationModel:
      type: object
      description: Pagination metadata in responses
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        count:
          type: integer
          description: Number of items on current page
          example: 20
        totalCount:
          type: integer
          description: Total number of items across all pages
          example: 150
        totalPages:
          type: integer
          description: Total number of pages available
          example: 8
      required:
        - page
        - count
        - totalCount
        - totalPages

    PaginationResponse:
      type: object
      description: Pagination metadata for response objects
      properties:
        page:
          type: integer
          description: The current page number
          example: 1
        count:
          type: integer
          description: The number of items on the current page i.e page size
          example: 10
        total_pages:
          type: integer
          description: The total number of pages available
          example: 2
        total_count:
          type: integer
          description: The total number of items across all pages
          example: 15

    PaginationRequest:
      type: object
      description: Pagination parameters for requests
      properties:
        page:
          type: integer
          description: Page number to retrieve (1-based)
          default: 1
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page
          default: 20
          minimum: 1
          maximum: 100
          example: 20

    # ==========================================================================
    # BLUEPRINT SCHEMAS
    # ==========================================================================

    Blueprint:
      type: object
      description: A blueprint template defining configuration structure
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the blueprint
          example: "987e6543-e21b-45d3-b456-123456789abc"
        name:
          type: string
          description: Blueprint name
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_-]+$'
          example: "wired-blueprint"
        label:
          type: string
          description: UI friendly label for the blueprint
          example: "Wired Configuration"
        description:
          type: string
          description: Blueprint description
          maxLength: 1024
          example: "Configuration blueprint for wired network devices"
        version:
          type: string
          description: Blueprint version
          pattern: '^\d+\.\d+(\.\d+)?$'
          example: "1.0.0"
        category:
          type: string
          description: Category of the blueprint
          enum:
            - wired
            - wireless
            - global
            - service-profile
          example: "wired"
        features:
          type: array
          description: Top-level features in this blueprint
          items:
            $ref: '#/components/schemas/FeatureNode'
      required:
        - id
        - name
        - description
        - version

    BlueprintCategory:
      type: string
      description: Category of blueprint - controls what device types can use this blueprint
      enum:
        - wired
        - wireless
        - global
        - service-profile
      example: "wired"

    RetrieveBlueprintsRequest:
      type: object
      description: Request to retrieve blueprints with filtering options
      properties:
        names:
          type: array
          description: Filter by blueprint names (if empty, returns all)
          items:
            type: string
            minLength: 1
            maxLength: 128
          example: ["wired-blueprint", "wireless-blueprint"]
        categories:
          type: array
          description: Filter by categories
          items:
            type: string
            enum:
              - wired
              - wireless
              - global
              - service-profile
          example: ["wired", "global"]
        detailLevel:
          type: string
          enum:
            - summary
            - full
          default: summary
          description: |
            Level of detail to return:
            - summary: Only id, name, description, version, category
            - full: Complete feature hierarchy with all details

    GetBlueprintsResponse:
      type: object
      description: Response containing blueprints and any errors
      properties:
        Blueprints:
          type: array
          description: Array of retrieved blueprints
          items:
            $ref: '#/components/schemas/Blueprint'
        Errors:
          type: array
          description: Errors for blueprints that couldn't be retrieved
          items:
            $ref: '#/components/schemas/BatchAPIResponse'
      required:
        - Blueprints
        - Errors

    RetrieveBlueprintFeatureRequest:
      type: object
      description: Request to retrieve a feature from a blueprint
      properties:
        featurePath:
          type: string
          description: |
            Path to the feature using forward slashes.
            Must start with /
            Configuration Profile: /network-feature/interface-feature/port-feature, /network-feature/fabric-feature/isis-feature
            Service Profile: /l2-service-feature, /vrf-feature
            Global Profile: /ntp-server-feature, /dns-server-feature
          pattern: '^/.*'
          minLength: 1
          maxLength: 512
          example: "/network-feature/interface-feature/port-feature"
        detailLevel:
          type: string
          enum:
            - summary
            - full
          default: full
          description: Level of detail for the feature schema
      required:
        - featurePath

    # ==========================================================================
    # FEATURE SCHEMAS
    # ==========================================================================

    FeatureNode:
      type: object
      description: A feature node in the blueprint/configuration tree
      properties:
        id:
          type: string
          format: uuid
          description: Unique feature identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Feature name (path segment)
          minLength: 1
          maxLength: 128
          example: "port-feature"
        label:
          type: string
          description: UI friendly label for the feature
          example: "Port Configuration"
        description:
          type: string
          description: Feature description
          maxLength: 1024
          example: "Virtual LAN configuration for stacked switches"
        featurePath:
          type: string
          description: Full path from root using forward slashes
          pattern: '^/.*'
          example: "/network-feature/interface-feature/port-feature"
        category:
          type: string
          description: Category of the source blueprint this feature belongs to
          enum:
            - wired
            - wireless
            - global
          example: "wired"
        blueprintId:
          type: string
          format: uuid
          description: Unique identifier for the blueprint this feature belongs to
          example: "987e6543-e21b-45d3-b456-123456789abc"
        features:
          type: array
          description: Child/sub-features within this feature
          items:
            $ref: '#/components/schemas/FeatureNode'
      required:
        - id
        - name
        - description
        - featurePath
        - category
        - blueprintId

    FeatureSchema:
      type: object
      description: Complete schema definition for a feature including object and property schemas
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the feature
        name:
          type: string
          description: Feature name
        label:
          type: string
          description: UI friendly label for the feature
        description:
          type: string
          description: Feature description
        enabled:
          type: boolean
          description: Whether this feature is enabled
          default: true
        category:
          type: string
          description: Category of the source blueprint this feature belongs to
          enum:
            - wired
            - wireless
            - global
          example: "wired"
        blueprintId:
          type: string
          format: uuid
          description: Unique identifier for the blueprint this feature belongs to
        objectSchemas:
          type: array
          description: Object type schemas available in this feature
          items:
            $ref: '#/components/schemas/ObjectSchema'
      required:
        - id
        - name
        - enabled
        - category
        - blueprintId

    ObjectSchema:
      type: object
      description: Schema definition for a configuration object type
      properties:
        type:
          type: string
          description: Object type identifier
          example: "VLANConfigPrimary"
        label:
          type: string
          description: UI friendly label for the object type
          example: "Primary VLAN Configuration"
        description:
          type: string
          description: Description of what this object type configures
        propertySchemas:
          type: object
          description: Map of property schema definitions keyed by property name
          additionalProperties:
            $ref: '#/components/schemas/PropertySchema'
      required:
        - type

    PropertySchema:
      type: object
      description: Schema definition for a configuration property
      properties:
        name:
          type: string
          description: Property name (identifier)
          example: "vlanId"
        label:
          type: string
          description: UI friendly label for the property
          example: "VLAN ID"
        description:
          type: string
          description: Description of what this property controls
        type:
          type: string
          description: Data type of the property
          enum:
            - string
            - number
            - boolean
            - enumeration
            - reference
            - string-array
            - number-array
            - boolean-array
            - enumeration-array
            - reference-array
        value:
          description: Current/default value of the property
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        defaultValue:
          description: Default value for the property
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        refType:
          type: string
          description: Type of the referenced object (only for reference and reference-array types)
          example: "SecuritySettings"
        isAdvanced:
          type: boolean
          description: Indicates whether this property is an advanced setting
          default: false
        isMandatory:
          type: boolean
          description: Indicates whether this property is mandatory
          default: false
        validations:
          $ref: '#/components/schemas/PropertyValidations'
      required:
        - name
        - type
        - isAdvanced

    PropertyValidations:
      type: object
      description: Validation constraints derived from YANG models
      properties:
        minLength:
          type: integer
          description: Minimum string length
          minimum: 0
          example: 1
        maxLength:
          type: integer
          description: Maximum string length
          example: 256
        pattern:
          type: string
          description: Regular expression pattern for string validation
          example: "^[a-zA-Z][a-zA-Z0-9_-]*$"
        minimum:
          type: number
          description: Minimum value for numbers
          example: 0
        maximum:
          type: number
          description: Maximum value for numbers
          example: 65535
        enum:
          type: array
          description: List of allowed values for enumeration types
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    FeatureStatus:
      type: string
      description: Status of a feature within a configuration profile
      enum:
        - enabled
        - disabled
        - locked
        - inherited

    # ==========================================================================
    # CONFIGURATION PROFILE SCHEMAS
    # ==========================================================================

    ConfigurationProfile:
      type: object
      description: A configuration profile containing features and objects
      properties:
        name:
          type: string
          description: Name of the configuration profile (unique)
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_-]+$'
          example: "Campus-Network-Profile"
        description:
          type: string
          description: Description of the configuration profile
          nullable: true
          maxLength: 1024
        deploymentStatus:
          type: string
          description: Deployment status of the configuration profile
          enum:
            - draft
            - deployed
            - deploy-in-progress
            - deploy-failed
            - deploy-scheduled
        time:
          type: string
          format: date-time
          description: Timestamp when the configuration was created or updated (ISO 8601)
        version:
          type: string
          description: Version of the configuration profile
          example: "1.0.0"
        features:
          type: array
          description: List of features in this configuration profile
          items:
            $ref: '#/components/schemas/ConfigurationFeature'
        targetQuery:
          $ref: '#/components/schemas/TargetQuery'
      required:
        - name
        - features

    ConfigurationFeature:
      type: object
      description: A configuration feature within a profile with objects and settings
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the configuration feature
        name:
          type: string
          description: Name of the feature
          example: "port-feature"
        label:
          type: string
          description: UI friendly label for the feature
        enabled:
          type: boolean
          description: Whether this feature is enabled
          default: true
        description:
          type: string
          description: Description of the feature
        isLocked:
          type: boolean
          description: Indicates if this feature is locked from editing
          default: false
        features:
          type: array
          description: List of sub-features in this configuration feature
          items:
            $ref: '#/components/schemas/ConfigurationFeature'
        objects:
          type: array
          description: Configuration objects for this feature
          items:
            $ref: '#/components/schemas/ConfigObjectAPIResponse'
        featurePath:
          type: string
          description: Path to this feature within the configuration profile
          pattern: '^/.*'
          example: "/network-feature/interface-feature/port-feature"
        targetQuery:
          $ref: '#/components/schemas/TargetQuery'
        category:
          type: string
          description: Category of the source blueprint this feature belongs to
          enum:
            - wired
            - wireless
            - global
          example: "wired"
        blueprintId:
          type: string
          format: uuid
          description: Unique identifier for the blueprint this feature belongs to
      required:
        - name
        - enabled
        - featurePath
        - category
        - blueprintId
        - isLocked

    ConfigurationFeatureNode:
      type: object
      description: Configuration feature without objects and targetQuery for simplified tree navigation
      properties:
        name:
          type: string
          description: Name of the feature
        label:
          type: string
          description: UI friendly label for the feature
        enabled:
          type: boolean
          description: Whether this feature is enabled
        description:
          type: string
          description: Description of the feature
        featurePath:
          type: string
          description: Path to this feature within the configuration profile
        isLocked:
          type: boolean
          description: Indicates if the feature is locked from editing
          default: false
        features:
          type: array
          description: List of sub-features in this configuration feature
          items:
            $ref: '#/components/schemas/ConfigurationFeatureNode'
      required:
        - name
        - enabled
        - featurePath
        - isLocked

    ConfigurationProfileSummary:
      type: object
      description: Summary view of a configuration profile for list responses
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the configuration profile
        name:
          type: string
          description: Name of the configuration profile
          example: "Campus-Network-Profile"
        type:
          type: array
          description: Type(s) of the configuration profile based on included blueprints
          items:
            type: string
            enum:
              - wired
              - wireless
              - global
              - undefined
        deploymentStatus:
          type: string
          description: Current deployment status of the configuration profile
          enum:
            - draft
            - deployed
            - deploy-in-progress
            - deploy-failed
            - deploy-scheduled
        description:
          type: string
          description: A brief description of the configuration profile
        siteCount:
          type: integer
          format: int32
          description: Total number of sites associated with this profile
        numSitesDraft:
          type: integer
          format: int32
          description: Number of sites in draft status
        numSitesDeployed:
          type: integer
          format: int32
          description: Number of sites successfully deployed
        numSitesDeployInProgress:
          type: integer
          format: int32
          description: Number of sites currently deploying
        numSitesDeployFailed:
          type: integer
          format: int32
          description: Number of sites with failed deployment
        numSitesDeployScheduled:
          type: integer
          format: int32
          description: Number of sites with scheduled deployment
        deviceCount:
          type: integer
          format: int32
          description: Total number of devices associated with this profile
        overrideCount:
          type: integer
          format: int32
          description: Number of device-specific overrides
        numDevicesDraft:
          type: integer
          format: int32
          description: Number of devices in draft status
        numDevicesDeployed:
          type: integer
          format: int32
          description: Number of devices successfully deployed
        numDevicesDeployInProgress:
          type: integer
          format: int32
          description: Number of devices currently deploying
        numDevicesDeployFailed:
          type: integer
          format: int32
          description: Number of devices with failed deployment
        numDevicesDeployScheduled:
          type: integer
          format: int32
          description: Number of devices with scheduled deployment
        lastDeployedTime:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last successful deployment (ISO 8601)
        lastModifiedTime:
          type: string
          format: date-time
          description: Timestamp of the last modification to the profile (ISO 8601)
      required:
        - id
        - name
        - type
        - deploymentStatus
        - siteCount
        - deviceCount

    ConfigObjectAPIResponse:
      type: object
      description: Configuration object response with properties as a map
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the configuration object
        type:
          type: string
          description: Type of the configuration object
          example: "port"
        label:
          type: string
          description: UI friendly label for the object type
        properties:
          type: object
          description: Properties of this configuration object as a map where key is property name
          additionalProperties:
            $ref: '#/components/schemas/ConfigProperty'
        featurePath:
          type: string
          description: Path to the feature this object belongs to
          example: "/network-feature/interface-feature/port-feature"
      required:
        - type
        - featurePath

    ConfigProperty:
      type: object
      description: A configuration property with value and metadata
      properties:
        name:
          type: string
          description: Name of the property
          example: "vlanId"
        label:
          type: string
          description: UI friendly label for the property
          readOnly: true
        type:
          type: string
          description: Data type of the property
          enum:
            - string
            - number
            - boolean
            - enumeration
            - reference
            - string-array
            - number-array
            - boolean-array
            - enumeration-array
            - reference-array
        value:
          description: Value of the property
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        defaultValue:
          description: Default value for the property
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        origin:
          type: string
          description: Origin of this configuration property value
          enum:
            - CC
            - CD
            - DD
            - Global
        refType:
          type: string
          description: Type of the referenced object (only for reference types)
          example: "SecuritySettings"
      required:
        - name
        - value

    ConfigObject:
      type: object
      description: A configuration object representing a specific instance within a feature
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the configuration object
        type:
          type: string
          description: Type of the configuration object
        label:
          type: string
          description: UI friendly label for the object type
        properties:
          type: array
          description: Properties of this configuration object
          items:
            $ref: '#/components/schemas/ConfigProperty'
        featurePath:
          type: string
          description: Path to the feature this object belongs to
      required:
        - type
        - featurePath

    ConfigObjectGroup:
      type: object
      description: A group of related configuration objects within a feature
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the configuration group
        name:
          type: string
          description: Name of the group
        featurePath:
          type: string
          description: Path to the feature this group belongs to
        objectIds:
          type: array
          description: List of object IDs included in this group
          items:
            type: string
            format: uuid
      required:
        - id
        - name
        - featurePath
        - objectIds

    DeploymentStatus:
      type: string
      description: Deployment status values used throughout the API
      enum:
        - draft
        - deployed
        - deploying
        - failed
        - scheduled
        - starts_soon
        - pending
        - failed_and_rolled_back

    DeploymentStatusCount:
      type: object
      description: Count of items by deployment status
      properties:
        draft:
          type: integer
          format: int32
          description: Number of items in draft status
        deployed:
          type: integer
          format: int32
          description: Number of items successfully deployed
        deploying:
          type: integer
          format: int32
          description: Number of items currently being deployed
        failed:
          type: integer
          format: int32
          description: Number of items that failed deployment
        scheduled:
          type: integer
          format: int32
          description: Number of items scheduled for deployment

    DeploymentExecutionStatus:
      type: string
      description: Status of a deployment execution task
      enum:
        - completed
        - in_progress
        - failed
        - cancelled
      example: "completed"

    DeploymentOperationType:
      type: string
      description: Type of deployment operation
      enum:
        - profile
      example: "profile"

    ConfigGroupAssignment:
      type: string
      description: Assignment status of a configuration group
      enum:
        - Assigned
        - Unassigned
      example: "Assigned"

    PortConfigurationPortType:
      type: string
      description: Port type for port configuration
      enum:
        - access
        - disabled
        - instant
        - trunk
      example: "access"

    OverridePropertyOrigin:
      type: string
      description: Origin of an override property value
      enum:
        - device
        - Global
        - model
        - model-group
        - profile
      example: "device"

    DevicesJSONConfigurationVia:
      type: string
      description: Source of device configuration
      enum:
        - override
        - profile
      example: "profile"

    # ==========================================================================
    # YANG-SOURCED ENUM SCHEMAS
    # Source: extreme-intent-types.yang, extreme-intent-syslog-server.yang
    # ==========================================================================

    SyslogFacility:
      type: string
      description: |
        Syslog facility code (LOCAL0-LOCAL7).
        Source: extreme-intent-syslog-server.yang
      enum:
        - LOCAL0
        - LOCAL1
        - LOCAL2
        - LOCAL3
        - LOCAL4
        - LOCAL5
        - LOCAL6
        - LOCAL7
      example: "LOCAL0"

    SyslogSeverity:
      type: string
      description: |
        Syslog severity level for filtering messages.
        Source: extreme-intent-syslog-server.yang
        Messages at this level and above (more severe) will be logged.
      enum:
        - EMERGENCY
        - ALERT
        - CRITICAL
        - ERROR
        - WARNING
        - NOTICE
        - INFORMATIONAL
        - DEBUG
      example: "WARNING"

    IntentVlanType:
      type: string
      description: |
        VLAN type from YANG model.
        Source: extreme-intent-vlan.yang (uses intent-vlan-type-enum)
      enum:
        - vlan
        - private-vlan
      example: "vlan"

    WirelessSecurityType:
      type: string
      description: |
        Wireless security type.
        Source: extreme-intent-types.yang (security-type-enum)
      enum:
        - WPA3
        - WPA2
        - OWE
        - Open
      example: "WPA2"

    WirelessSecurityMode:
