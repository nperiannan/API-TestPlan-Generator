openapi: 3.0.3
info:
  title: Configuration Management and Device Targeting API - QA Reference
  description: |
    # QA-Friendly API Reference for Configuration Service
    
    This document provides a comprehensive reference for all Configuration Service API endpoints,
    request/response schemas, and data types for QA testing purposes.
    
    ## API Categories
    
    | Category | Description |
    |----------|-------------|
    | **Blueprints** | Blueprint template management - retrieve templates and features |
    | **Configuration Profiles** | CRUD operations for configuration profiles |
    | **Global Profiles** | Global configuration profile management |
    | **Service Profiles** | Service profile CRUD operations |
    | **Target Query** | Device targeting and scope management |
    | **Deployment** | Configuration deployment to devices and sites |
    | **Inventory** | Device models, SKUs, and port types |
    | **Port Mapping** | Port mapping and LAG configuration |
    | **Override** | Device/model-level configuration overrides |
    
    ## Standard Response Patterns
    
    ### Success Responses
    - **200 OK**: Successful RETRIEVE, DELETE, and batch operations
    - **201 Created**: Successful CREATE operations
    
    ### Error Responses
    - **400 Bad Request**: Invalid input, malformed request
    - **401 Unauthorized**: Authentication failure
    - **403 Forbidden**: Permission denied
    - **404 Not Found**: Resource not found
    - **409 Conflict**: Resource already exists
    - **500 Internal Server Error**: Unexpected failure
    
    ### Error Precedence for Batch Operations
    When all items fail: `500 > 401 > 409 > 404 > 403 > 400`

    ## Enum Reference Guide
    
    This section provides a comprehensive reference for all enum values used across the API.
    
    ### Core Operation Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `BatchAPIResponseOperation` | `create`, `update`, `delete`, `retrieve`, `clone`, `deploy` | Type of batch operation performed |
    | `BatchAPIResponseStatus` | `success`, `failed` | Status of a batch operation item |
    | `ObjectModifyRequestOperation` | `add`, `update` | Operation for modifying configuration objects |
    
    ### Deployment Status Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `DeploymentStatus` | `draft`, `deployed`, `deploying`, `failed`, `scheduled`, `starts_soon`, `pending`, `failed_and_rolled_back` | Overall deployment status |
    | `DeploymentExecutionStatus` | `completed`, `in_progress`, `failed`, `cancelled` | Status of a deployment execution task |
    | `DeploymentOperationType` | `profile` | Type of deployment operation |
    
    ### Blueprint/Profile Category Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `BlueprintCategory` | `wired`, `wireless`, `global`, `service-profile` | Category of blueprint |
    | `FeatureNodeCategory` | `wired`, `wireless`, `global` | Category of a feature node |
    | `ConfigurationProfileSummaryType` | `wired`, `wireless`, `global`, `undefined` | Type of configuration profile |
    
    ### Property Type Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `PropertySchemaType` | `string`, `number`, `boolean`, `enumeration`, `reference`, `string-array`, `number-array`, `boolean-array`, `enumeration-array`, `reference-array` | Data type of a property |
    | `ServiceProfilePropertyType` | `string`, `number`, `boolean`, `enumeration`, `reference`, `string-array`, `number-array`, `boolean-array`, `enumeration-array`, `reference-array` | Service profile property data type |
    
    ### Origin Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `ConfigPropertyOrigin` | `CC`, `CD`, `DD`, `Global` | Origin of a configuration property value |
    | `ServiceProfilePropertyOrigin` | `CC`, `CD`, `DD`, `Global` | Origin of a service profile property |
    | `OverridePropertyOrigin` | `device`, `Global`, `model`, `model-group`, `profile` | Origin of an override property value |
    
    **Origin Value Meanings:**
    - `CC` = Configuration Center (Configuration Profile)
    - `CD` = Configuration Default
    - `DD` = Device Default
    - `Global` = Global Profile
    
    ### Device/Model Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `DeviceType` | `access_point`, `controller`, `firewall`, `router`, `switch` | Type of network device |
    | `OsType` | `EXOS`, `FabricEngine`, `IQEngine`, `SwitchEngine`, `VOSS` | Device operating system type |
    | `PoECapability` | `none`, `PoE`, `PoE+`, `PoE++` | Power over Ethernet capability |
    | `PowerType` | `AC`, `DC`, `PoE`, `PoE+`, `PoE++` | Power supply type |
    
    ### Configuration Group Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `ConfigGroupAssignment` | `Assigned`, `Unassigned` | Assignment status of a configuration group |
    | `DevicesJSONConfigurationVia` | `override`, `profile` | Source of device configuration |
    
    ### Port/Switch Selection Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `HostNameVariantType` | `any`, `hostname`, `variant` | Type of hostname/variant selection |
    | `SelectSwitchesPortType` | `access`, `Any`, `disabled`, `instant`, `trunk` | Port type filter for switch selection |
    | `SlotPortSelectionType` | `allPorts`, `specific` | Type of port selection for a slot |
    | `PortConfigurationPortType` | `access`, `disabled`, `instant`, `trunk` | Port type for port configuration |
    
    ### Override Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `ObjectOverrideType` | `device`, `model`, `model-group` | Level at which override is applied |
    
    ### LAG Configuration Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `LAGSettingsLoadBalancingAlgorithm` | `dst-ip`, `dst-mac`, `round-robin`, `src-dst-ip`, `src-dst-mac`, `src-dst-port`, `src-ip`, `src-mac` | Load balancing algorithm for LAG |
    | `LACPMode` | `active`, `passive` | LACP mode for link aggregation |
    | `LACPTimeout` | `long`, `short` | LACP timeout mode |
    
    ### Query Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `QueryLogicalOperator` | `AND`, `OR` | Logical operator for query criteria |
    | `QueryCriterionOperator` | `IN`, `NOT_IN` | Comparison operator for query criterion |
    | `SortQueryOrder` | `ASC`, `DESC` | Sort direction |
    | `TargetQueryField` | `siteId`, `modelId`, `modelGroupId`, `deviceId` | Field for target query criteria |
    
    ### Feature Status Enums
    
    | Enum Schema | Valid Values | Description |
    |-------------|--------------|-------------|
    | `FeatureStatus` | `enabled`, `disabled`, `locked`, `inherited` | Status of a feature within a profile |

    ### YANG-Sourced Enums (from extreme-intent-types.yang)
    
    | Enum Schema | Valid Values | Description | YANG Source |
    |-------------|--------------|-------------|-------------|
    | `SyslogFacility` | `LOCAL0`, `LOCAL1`, `LOCAL2`, `LOCAL3`, `LOCAL4`, `LOCAL5`, `LOCAL6`, `LOCAL7` | Syslog facility code | extreme-intent-syslog-server.yang |
    | `SyslogSeverity` | `EMERGENCY`, `ALERT`, `CRITICAL`, `ERROR`, `WARNING`, `NOTICE`, `INFORMATIONAL`, `DEBUG` | Syslog severity level | extreme-intent-syslog-server.yang |
    | `IntentVlanType` | `vlan`, `private-vlan` | VLAN type | extreme-intent-vlan.yang |
    | `WirelessSecurityType` | `WPA3`, `WPA2`, `OWE`, `Open` | Wireless security type | security-type-enum |
    | `WirelessSecurityMode` | `Personal`, `Enterprise` | Wireless auth mode | security-mode-enum |
    | `VlanAssignmentType` | `Untagged`, `Tagged`, `Pool`, `Dynamic`, `VXLAN`, `Tunnel` | VLAN assignment | vlan-assignment-type-enum |
    | `ChannelWidthOption` | `20MHz`, `40MHz`, `80MHz`, `160MHz`, `320MHz-1`, `320MHz-2` | Channel width | channel-width-option-enum |
    | `DataRate2G` | `1Mbps`, `2Mbps`, `5.5Mbps`, `6Mbps`, `9Mbps`, `11Mbps`, `12Mbps`, `18Mbps`, `24Mbps`, `36Mbps`, `48Mbps`, `54Mbps` | 2.4GHz data rates | data-rate-2g-enum |
    | `DataRate5G` | `6Mbps`, `9Mbps`, `12Mbps`, `18Mbps`, `24Mbps`, `36Mbps`, `48Mbps`, `54Mbps` | 5GHz data rates | data-rate-5g-enum |
    | `AllowDataRateType` | `Compatible`, `No Legacy`, `High Density`, `Custom Rates` | Data rate optimization | allow-data-rate-types-enum |
    | `CredentialType` | `Passphrase`, `Private` | Credential type | credential-type-enum |
    | `SwitchPortType` | `access`, `trunk` | Switch port type | port-type-enum |

  version: 1.0.0
  contact:
    name: Extreme Networks Platform Team
    email: platform-team@extremenetworks.com
    url: https://www.extremenetworks.com
