  /configuration-profiles/devices/retrieve:
    post:
      operationId: retrieveAllDevicesAcrossProfiles
      tags:
        - ConfigurationProfiles
      summary: Retrieve all devices across all configuration profiles
      description: |
        Retrieves a list of all devices across all configuration profiles in the system.
        Supports pagination, fuzzy search, and filtering capabilities.

        **Filter Options:**
        - deviceName: Filter by device hostname/name
        - model: Filter by device model
        - siteId: Filter by site identifier
        - siteName: Filter by site name
        - source: Filter by device onboarding source (onboarding-rule, manual, onboarding-xlsx)
        - profileName: Filter by configuration profile name (supports multiple profiles)

        **Fuzzy Search:**
        - Searches across device hostname, IP address, serial number, site name, and profile name fields

        **Response includes:**
        - Device basic information (deviceId, hostname, model)
        - Network information (ipAddress, serialNumber)
        - Site assignment details
        - Configuration profile assignment
        - Onboarding source (how device was added to system)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginatedQueryRequest"
            examples:
              withoutPagination:
                summary: Retrieve all devices without pagination
                value: {}
              withPagination:
                summary: Retrieve with pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 50
              withFilters:
                summary: Retrieve with filters and pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 20
                  filterQuery:
                    - key: "model"
                      values: ["5520"]
                    - key: "source"
                      values: ["onboarding-rule", "manual"]
                    - key: "profileName"
                      values: ["Enterprise-WiFi-Profile", "Guest-WiFi-Profile"]
              withFuzzySearch:
                summary: Retrieve with fuzzy search and pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 30
                  fuzzySearchQuery: "floor1"
              withMultipleFilters:
                summary: Retrieve with multiple filters, fuzzy search, and pagination
                value:
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 25
                  filterQuery:
                    - key: "siteId"
                      values: ["389e8400-e29b-41d4-a716-4466554443b0"]
                    - key: "model"
                      values: ["5520", "5420"]
                    - key: "source"
                      values: ["onboarding-rule"]
                    - key: "profileName"
                      values: ["Enterprise-WiFi-Profile"]
                  fuzzySearchQuery: "switch"
      responses:
        "200":
          description: Devices retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllDevicesResponse"
              example:
                devices:
                  - deviceId: "123e4567-e89b-12d3-a456-426614174001"
                    hostname: "switch-floor1-001"
                    model: "5520"
                    ipAddress: "192.168.1.100"
                    serialNumber: "SN123456789"
                    site:
                      siteId: "389e8400-e29b-41d4-a716-4466554443b0"
                      siteName: "Building-A-Floor-1"
                    profileName: "Enterprise-WiFi-Profile"
                    source: "onboarding-rule"
                  - deviceId: "123e4567-e89b-12d3-a456-426614174002"
                    hostname: "switch-floor1-002"
                    model: "5520"
                    ipAddress: "192.168.1.101"
                    serialNumber: "SN123456790"
                    site:
                      siteId: "389e8400-e29b-41d4-a716-4466554443b0"
                      siteName: "Building-A-Floor-1"
                    profileName: "Guest-WiFi-Profile"
                    source: "manual"
                  - deviceId: "123e4567-e89b-12d3-a456-426614174003"
                    hostname: "ap-floor2-001"
                    model: "AP305CX"
                    ipAddress: "192.168.2.50"
