        portType:
          type: string
          description: Port type
        isConfigurable:
          type: boolean
          description: Whether the port is configurable
        availableSpeeds:
          type: array
          description: Available speeds for this port
          items:
            type: string

    PortTypeInfo:
      type: object
      description: Port type information for a device
      properties:
        portType:
          type: string
          description: Primary port type classification
        portSubtype:
          type: string
          description: Specific port subtype with speed and media information
        portCount:
          type: integer
          description: Number of ports of this type
        description:
          type: string
          description: Human-readable description of the port type
        capabilities:
          type: array
          description: Additional capabilities of these ports
          items:
            type: string
      required:
        - portType
        - portSubtype
        - portCount
        - description

    PortTypeDetail:
      type: object
      description: Detailed port type information
      properties:
        portTypeId:
          type: string
        portTypeName:
          type: string
        portType:
          type: string
        portSubtype:
          type: string
        portCount:
          type: integer
          description: Number of ports of this type
        description:
          type: string

    SpeedCapability:
      type: object
      description: Speed capability information
      properties:
        speed:
          type: string
          description: Port speed specification
          example: "10G"
        portType:
          type: string
          description: Port type
        portCount:
          type: integer
          description: Number of ports with this speed
        description:
          type: string
          description: Speed capability description

    SKUDetail:
      type: object
      description: Detailed SKU information
      properties:
        skuCode:
          type: string
          description: SKU code
        skuDescription:
          type: string
          description: SKU description
        slotNumber:
          type: string
          description: Slot number
        portRange:
          type: string
          description: Port range
        portType:
          type: string
          description: Port type
        speed:
          type: string
          description: Port speed
        mediaType:
          type: string
          description: Media type

    SKUResult:
      type: object
      description: SKU query result for a specific device
      properties:
        hostName:
          type: string
          description: Extreme Networks device hostname that was queried
        modelName:
          type: string
          description: Detected Extreme Networks device model name
        variantId:
          type: string
