        Deletes specified objects from the global profile.
        Can delete by:
        - Feature path (all objects under the feature)
        - Specific object IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectsRequest'
            examples:
              # =====================================================
              # GLOBAL PROFILE - DELETE EXAMPLES
              # =====================================================
              deleteAllNTPServers:
                summary: Delete all NTP servers
                description: Remove all NTP server objects
                value:
                  featurePath: "/ntp-server-feature"
              
              deleteSingleNTPServer:
                summary: Delete specific NTP server
                description: Remove a single NTP server by ID
                value:
                  objectIds:
                    - "11111111-2222-3333-4444-555555555555"
              
              deleteAllDNSServers:
                summary: Delete all DNS servers
                description: Remove all DNS server objects
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-server"
              
              deleteAllDNSSuffixes:
                summary: Delete all DNS suffixes
                description: Remove all DNS suffix objects
                value:
                  featurePath: "/dns-server-feature"
                  objectType: "dns-suffix"
              
              deleteSingleDNSServer:
                summary: Delete specific DNS server
                value:
                  objectIds:
                    - "22222222-3333-4444-5555-666666666666"
              
              deleteAllDHCPServers:
                summary: Delete all DHCP servers
                description: Remove all DHCP server objects
                value:
                  featurePath: "/dhcp-server-feature"
              
              deleteSingleDHCPServer:
                summary: Delete specific DHCP server
                value:
                  objectIds:
                    - "44444444-5555-6666-7777-888888888888"
              
              deleteAllSyslogServers:
                summary: Delete all Syslog servers
                description: Remove all Syslog server objects
                value:
                  featurePath: "/syslog-server-feature"
              
              deleteSingleSyslogServer:
                summary: Delete specific Syslog server
                value:
                  objectIds:
                    - "55555555-6666-7777-8888-999999999999"
              
              deleteMultipleObjects:
                summary: Delete multiple objects by IDs
                description: Remove multiple objects in a single request
                value:
                  objectIds:
                    - "11111111-2222-3333-4444-555555555555"
                    - "22222222-3333-4444-5555-666666666666"
                    - "44444444-5555-6666-7777-888888888888"
      responses:
        '200':
          description: Objects deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAPIResponseArray'
              examples:
                deleteSuccess:
