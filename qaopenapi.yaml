  /inventory/model-families/retrieve:
    post:
      operationId: retrieveModelFamilies
      tags:
        - Inventory
      summary: Retrieve model families with pagination, filtering, and fuzzy search
      description: |
        Retrieves a list of unique model families with support for pagination, filtering, and fuzzy search.

        **All parameters are optional:**
        - If no parameters provided, returns paginated results (default: page 1, pageSize 20)
        - **Pagination**: Use `page` and `pageSize` to control result pagination
        - **Exact Filter**: Use `filter` for exact match or prefix match on model family names
        - **Fuzzy Search**: Use `search` for case-insensitive partial matching (uses SQL LIKE)

        **Examples:**
        1. Get all families (paginated): `{}`
        2. Get specific page: `{"page": 2, "pageSize": 10}`
        3. Fuzzy search: `{"search": "5000"}`
        4. Exact filter: `{"filter": "ExtremeSwitching 5000 Series"}`
        5. Combined: `{"search": "switching", "page": 1, "pageSize": 15}`

        Model families group related device models together (e.g., "ExtremeSwitching 5000 Series", "WiFi 6 AP").
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                  description: "Page number for pagination (1-indexed)"
                  example: 1
                pageSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                  description: "Number of items per page (max: 100)"
                  example: 20
                filter:
                  type: string
                  description: "Exact match or prefix match on model family name"
                  example: "ExtremeSwitching 5000 Series"
                search:
                  type: string
                  description: "Case-insensitive partial match on model family name (fuzzy search)"
                  example: "switching"
            examples:
              default:
                summary: Get all families (paginated)
                value: {}
              withPagination:
                summary: Get specific page
                value:
                  page: 2
                  pageSize: 10
              fuzzySearch:
                summary: Fuzzy search for "5000"
                value:
                  search: "5000"
                  pageSize: 50
              exactFilter:
                summary: Exact filter
                value:
                  filter: "ExtremeSwitching 5000 Series"
              combined:
                summary: Search with pagination
                value:
                  search: "switching"
                  page: 1
                  pageSize: 15
      responses:
        "200":
          description: Model families retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - modelFamilies
                  - pagination
                properties:
                  modelFamilies:
                    type: array
                    items:
                      type: string
                    description: "List of unique model family names"
                  pagination:
                    type: object
                    required:
                      - currentPage
                      - pageSize
                      - totalCount
                      - totalPages
                    properties:
                      currentPage:
                        type: integer
                        description: "Current page number"
                        example: 1
                      pageSize:
                        type: integer
                        description: "Number of items per page"
                        example: 20
                      totalCount:
                        type: integer
                        description: "Total number of model families matching the criteria"
                        example: 45
                      totalPages:
                        type: integer
                        description: "Total number of pages"
                        example: 3
              examples:
                paginatedResult:
                  summary: Paginated response
                  value:
                    modelFamilies:
                      - "ExtremeSwitching 5000 Series"
                      - "ExtremeSwitching X-Series"
                      - "WiFi 6 AP"
                      - "WiFi 6E AP"
                    pagination:
                      currentPage: 1
                      pageSize: 20
                      totalCount: 45
                      totalPages: 3
                searchResult:
                  summary: Search result for "switching"
                  value:
                    modelFamilies:
                      - "ExtremeSwitching 5000 Series"
                      - "ExtremeSwitching X-Series"
                    pagination:
                      currentPage: 1
                      pageSize: 20
                      totalCount: 2
                      totalPages: 1
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalidPage:
                  value:
                    code: 1001
                    message: "Invalid page number: must be >= 1"
                invalidPageSize:
                  value:
                    code: 1001
                    message: "Invalid pageSize: must be between 1 and 100"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
