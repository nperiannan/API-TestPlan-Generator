  # ============================================================================
  # DEPLOYMENT ENDPOINTS
  # ============================================================================

  /configuration-profiles/deploy:
    post:
      operationId: deployConfigurationProfiles
      tags:
        - Deployment
      summary: Deploy multiple configuration profiles
      description: |
        Initiates deployment of one or more configuration profiles.
        Supports immediate deployment or scheduled deployment.
        
        **Deployment Modes:**
        - `deployNow`: Deploy immediately
        - `deployAt`: Schedule deployment for a future time
        
        **Deployment creates a Temporal workflow** that manages the entire process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployProfilesRequest'
      responses:
        '200':
          description: Deployment initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          description: Bad request - invalid profiles or schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
        '404':
          description: One or more profiles not found
          content:
            application/json:
              schema:
