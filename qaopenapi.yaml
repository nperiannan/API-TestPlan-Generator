          example: "5520"
        site:
          type: string
          description: "Site name where the device is located"
          example: "Building-A"
        serialNumber:
          type: string
          description: "Device serial number"
          example: "SN123456789"
        location:
          type: string
          description: "Physical location of the device"
          example: "Floor 1, Rack 3"
        ipAddress:
          type: string
          description: "IP address of the device"
          example: "192.168.1.100"
        deviceType:
          type: string
          description: "Device type (Switch, Access Point, Router, etc.)"
          example: "Switch"

    DeviceProperty:
      description: |
        Property of a configuration object with device-specific conflict and override information.
        Used only in device feature tree endpoints. Not inherited from ConfigProperty.
      type: object
      properties:
        name:
          type: string
          description: Name of the property
        label:
          type: string
          description: UI friendly label for the property
        description:
          type: string
          description: Description of what this property controls
        type:
          type: string
          enum:
            [
              "string",
              "number",
              "boolean",
              "enumeration",
              "reference",
              "string-array",
              "number-array",
              "boolean-array",
              "enumeration-array",
              "reference-array",
            ]
          description: Data type of the property
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
          description: Effective (profile) value for the property
        deviceValue:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
          description: Actual value on the device
        previousDeployedValue:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
          description: Value previously deployed to the device (if any)
        refType:
          type: string
          description: Reference type for the property (if applicable)
        hasExternRef:
          type: boolean
          description: Whether the property has an external reference
        hasConflict:
          type: boolean
          readOnly: true
          default: false
          description: Whether this property has a conflict (deviceValue ≠ previousDeployedValue, indicating the device was modified outside of cloud control)
        hasOverride:
          type: boolean
          description: Whether this property has an override (device-level or model-group-level)
      required:
        - name
        - label
        - description
        - type
        - value
        - deviceValue
        - previousDeployedValue
        - hasConflict
        - hasOverride

  securitySchemes:
    xcIdToken:
      type: apiKey
      in: header
      name: X-XC-ID-TOKEN
      description: |
        JWT token obtained from IAM service.
        Include in header: `X-XC-ID-TOKEN: <token>`
        
        **How to obtain token:**
        1. Login to IAM service or use the authentication endpoint
        2. Copy the JWT token from the response
        3. Click "Authorize" and paste the token value

    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service communication

