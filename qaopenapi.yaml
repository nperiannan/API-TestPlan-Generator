servers:
  - url: http://{serverIP}:{port}/configuration/v1
    description: Configuration Service API Server
    variables:
      serverIP:
        default: "10.127.25.24"
        description: Configuration service server IP address
      port:
        default: "9009"
        description: Configuration service port
  - url: https://{environment}.extremenetworks.com/configuration/v1
    description: Environment-specific server
    variables:
      environment:
        default: dev
        enum:
          - dev
          - staging
          - prod

tags:
  - name: Blueprints
    description: |
      Blueprint template management operations.
      Blueprints define the structure and schema for configuration profiles.
      
      **Endpoints:**
      - POST /blueprints/retrieve - Retrieve blueprints with optional filtering
      - POST /blueprint/{name}/feature/retrieve - Get feature schema from blueprint
      - GET /blueprints/categories - List available blueprint categories

  - name: ConfigurationProfiles
    description: |
      Configuration profile CRUD operations.
      Profiles contain feature configurations that can be deployed to devices.
      
      **Endpoints:**
      - POST /configuration-profiles - List all profiles with pagination
      - GET /configuration-profile/{name} - Get profile details
      - POST /configuration-profile/{name} - Create profile from blueprint
      - DELETE /configuration-profile/{name} - Delete profile
      - POST /configuration-profile/{name}/clone - Clone existing profile
      - POST /configuration-profile/{name}/add-remove-features - Modify features

  - name: ConfigurationFeatures
    description: |
      Configuration feature and object management within profiles.
      Includes object CRUD operations and object group management.
      
      **Object Endpoints:**
      - POST /configuration-profile/{name}/feature/object/retrieve - Get objects (v1)
      - POST /configuration-profile/{name}/feature/object/retrieve-v2 - Get objects (v2)
      - POST /configuration-profile/{name}/feature/object/retrieve-summary - Get summary
      - GET /configuration-profile/{name}/feature/object/retrieve-by-id - Get by ID
      - POST /configuration-profile/{name}/feature/object/modify - Add/update objects
      - POST /configuration-profile/{name}/feature/object/delete - Delete objects
      - POST /configuration-profile/{name}/feature/object/clone - Clone objects
      - POST /configuration-profile/{name}/feature/object/restore - Restore objects
      
      **Object Group Endpoints:**
      - POST /configuration-profile/{name}/feature/object/group/create - Create group
      - POST /configuration-profile/{name}/feature/object/group/delete - Delete group
      - POST /configuration-profile/{name}/feature/object/group/modify - Modify group
      - POST /configuration-profile/{name}/feature/object/group/clone - Clone group

  - name: GlobalProfiles
    description: |
      Global profile management operations.
      Global profiles contain shared configurations across all profiles.
      
      **Endpoints:**
      - GET /global-profile - Get global profile
      - POST /global-profile/feature/object/retrieve - Get global objects
      - POST /global-profile/feature/object/retrieve-v2 - Get global objects (v2)
      - POST /global-profile/feature/object/modify - Modify global objects
      - POST /global-profile/feature/object/delete - Delete global objects
      - POST /global-profile/feature/usage - Get feature usage info

  - name: ServiceProfiles
    description: |
      Service profile management operations.
      Service profiles define reusable service configurations.
      
      **Endpoints:**
      - POST /service-profiles - List all service profiles
      - GET /service-profile/{name} - Get service profile
      - POST /service-profile/{name} - Create service profile
      - PATCH /service-profile/{name} - Update service profile
      - DELETE /service-profile/{name} - Delete service profile
      - GET /service-profile/{name}/usage - Get usage information

  - name: TargetQuery
    description: |
      Target query and device scope management.
      Define which devices receive specific configurations.
      
      **Endpoints:**
      - POST/GET /configuration-profile/{name}/scope - Set/get target scope
      - POST/GET/DELETE /configuration-profile/{name}/target-query/profile
      - POST/GET/DELETE /configuration-profile/{name}/target-query/feature/{featureId}
      - POST/GET/DELETE /configuration-profile/{name}/target-query/object/{objectId}
      - POST/GET/DELETE /configuration-profile/{name}/target-query/object-group/{objectGroupId}

  - name: Deployment
    description: |
      Configuration deployment operations.
      Deploy configurations to devices and sites with scheduling support.
      
      **Deployment Endpoints:**
      - POST /configuration-profiles/deploy - Deploy multiple profiles
      - POST /configuration-profile/{name}/sites/deploy - Deploy to sites
      - POST /configuration-profile/{name}/devices/deploy - Deploy to devices
      - POST /configuration-profile/{name}/deploy/status - Get deployment status
      - POST /configuration-profile/{name}/site/{siteName}/deploy/status
      - POST /configuration-profile/{name}/device/{hostname}/deploy/status
      
      **Schedule Management Endpoints:**
      - POST /configuration-profile/{name}/sites/deploy/edit-schedule - Edit site schedule
      - POST /configuration-profile/{name}/devices/deploy/edit-schedule - Edit device schedule
      - POST /configuration-profile/{name}/sites/deploy/clear-schedule - Clear site schedule
      - POST /configuration-profile/{name}/devices/deploy/clear-schedule - Clear device schedule

  - name: DeviceConflict
    description: |
      Device conflict detection and management.
      
      **Endpoints:**
      - GET /configuration-profile/{name}/device/{hostname}/conflicts

  - name: Inventory
    description: |
      Device inventory and model management.
      Query device models, variants, SKUs, and port types.
      
      **Endpoints:**
      - GET /inventory/models - List all models
      - GET /inventory/port-types - List port types
      - POST /inventory/models/modelVariants/retrieve
      - POST /inventory/models/modelVariants/porttypes/skus-retrieve
      - POST /inventory/models/hosts/porttypes/skus-retrieve

  - name: PortMapping
    description: |
      Port mapping and LAG configuration management.
      
      **Endpoints:**
      - POST /configuration-profile/{name}/port-mappings - Create mapping
      - DELETE /configuration-profile/{name}/port-mappings - Delete mapping
      - POST /configuration-profile/{name}/port-mappings/retrieve
      - POST /configuration-profile/{name}/port-mappings/modify
      - POST /configuration-profile/{name}/port-mappings/update-priorities
      - POST /configuration-profile/{name}/lag-configurations

  - name: Override
    description: |
      Configuration override management.
      Override configurations at device, model, or model-group level.
      
      **Endpoints:**
      - POST /configuration-profile/{name}/feature/object/override/create-modify
      - POST /configuration-profile/{name}/feature/object/override/retrieve
      - POST /configuration-profile/{name}/feature/object/override/remove
      - GET /configuration-profile/{name}/feature/object/overrides

paths:
  # ============================================================================
  # BLUEPRINT ENDPOINTS
  # ============================================================================
  
  /blueprints/retrieve:
    post:
      operationId: retrieveBlueprints
      tags:
        - Blueprints
      summary: Retrieve blueprints with optional filtering
      description: |
        Returns all available blueprints, optionally filtered by name, category, or detail level.
        
        **Use Cases:**
        - Get all blueprints for populating UI dropdown
        - Get specific blueprint(s) by name
        - Get blueprints filtered by category (wired/wireless/global)
        - Get summary only (names and IDs) or full hierarchy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveBlueprintsRequest'
      responses:
        '200':
          description: Blueprints retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBlueprintsResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

  /blueprint/{name}/feature/retrieve:
    post:
      operationId: retrieveBlueprintFeature
      tags:
        - Blueprints
      summary: Retrieve a specific feature from a blueprint
      description: |
        Returns detailed information about a feature within a blueprint,
        including nested features, object schemas, and property schemas.
        
        **Feature Path Format:** `/ParentFeature/ChildFeature/LeafFeature`
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the blueprint
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-zA-Z0-9_-]+$'
          example: "wired-blueprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveBlueprintFeatureRequest'
      responses:
        '200':
          description: Feature schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSchema'
        '400':
          description: Bad request - invalid feature path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '404':
          description: Blueprint or feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'

  /blueprints/categories:
    get:
      operationId: getBlueprintCategories
      tags:
        - Blueprints
      summary: Get all available blueprint categories
      description: Returns the list of all blueprint categories (wired, wireless, global, service-profile)
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlueprintCategory'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  # ============================================================================
  # CONFIGURATION PROFILE ENDPOINTS
  # ============================================================================

  /configuration-profiles:
    post:
      operationId: getAllConfigurationProfiles
      tags:
        - ConfigurationProfiles
      summary: List all configuration profiles with pagination
      description: |
        Returns a paginated list of configuration profile summaries.
        Supports filtering and fuzzy search.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigProfilesSummaryRequest'
      responses:
        '200':
          description: Configuration profiles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigProfilesSummaryResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /configuration-profile/{name}:
    get:
      operationId: getConfigurationProfile
      tags:
        - ConfigurationProfiles
      summary: Get configuration profile by name
      description: |
        Retrieves a configuration profile with its complete feature hierarchy.
        Use detailLevel=summary for tree navigation, detailLevel=full for complete data.
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the configuration profile
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-zA-Z0-9_-]+$'
        - name: detailLevel
          in: query
          required: false
          description: Level of detail to return
          schema:
            type: string
            enum: [summary, full]
            default: full
      responses:
        '200':
          description: Configuration profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfile'
        '404':
          description: Configuration profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'

    post:
      operationId: createConfigurationProfile
      tags:
        - ConfigurationProfiles
      summary: Create a new configuration profile
      description: |
        Creates a new configuration profile from a blueprint.
        Optionally specify which features to include.
      parameters:
        - name: name
          in: path
          required: true
          description: Name for the new configuration profile
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-zA-Z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigProfileRequest'
      responses:
        '201':
          description: Configuration profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '409':
          description: Conflict - profile already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'

    delete:
      operationId: deleteConfigurationProfile
      tags:
        - ConfigurationProfiles
      summary: Delete a configuration profile
      description: Deletes the specified configuration profile
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the configuration profile to delete
          schema:
            type: string
      responses:
        '200':
          description: Configuration profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '404':
          description: Configuration profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'

  /configuration-profile/{name}/clone:
    post:
      operationId: cloneConfigurationProfile
      tags:
        - ConfigurationProfiles
      summary: Clone a configuration profile
      description: Creates a copy of an existing configuration profile with a new name
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the profile to clone
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneConfigProfileRequest'
      responses:
        '201':
          description: Configuration profile cloned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '404':
          description: Source profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '409':
          description: Target profile name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'

  /configuration-profile/{name}/add-remove-features:
    post:
      operationId: addRemoveFeaturesFromConfigProfile
      tags:
        - ConfigurationProfiles
      summary: Add or remove features from a configuration profile
      description: |
        Modifies the features in a configuration profile.
        Specify features to add and/or remove by their feature paths.
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the configuration profile
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRemoveFeaturesRequest'
      responses:
        '200':
          description: Features modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAPIResponseArray'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

  # ============================================================================
  # CONFIGURATION FEATURE/OBJECT ENDPOINTS
  # ============================================================================

  /configuration-profile/{name}/feature/object/retrieve:
    post:
      operationId: getConfigObjectsWithinFeature
      tags:
        - ConfigurationFeatures
      summary: Retrieve configuration objects within a feature (v1)
      description: |
        Returns configuration objects for a specific feature path and object type.
        This is the v1 endpoint - use retrieve-v2 for enhanced functionality.
        
        **Wired Blueprint Feature Paths (from extreme-wired-blueprint.yang):**
        - `/network-feature/interface-feature/port-feature` - Port configuration (extreme-intent-port)
        - `/network-feature/fabric-feature/isis-feature` - IS-IS configuration (extreme-intent-fabric-isis)
        - `/network-feature/fabric-feature/spbm-global-feature` - SPBM Global (extreme-intent-fabric-spbm)
        - `/network-feature/fabric-feature/spbm-instance-feature` - SPBM Instance (extreme-intent-fabric-spbm-instance)
        - `/network-feature/fabric-feature/auto-sense-feature` - Auto-Sense (extreme-intent-fabric-auto-sense)
        - `/infrastructure-feature/device-identity-feature` - Device identity
        - `/infrastructure-feature/device-profile-feature` - Device profiles
        
