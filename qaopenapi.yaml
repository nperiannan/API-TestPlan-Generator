          description: SKU code/name for Extreme Networks device
          example: "5520-24T-P"
        skuDescription:
          type: string
          description: Description of the SKU
        modelName:
          type: string
          description: Extreme Networks model name this SKU belongs to
          example: "5520-24T"
        variantId:
          type: string
          description: Variant ID this SKU is associated with
          example: "24T"
        powerType:
          $ref: '#/components/schemas/PowerType'
        poECapability:
          $ref: '#/components/schemas/PoECapability'
        maxPoEBudget:
          type: integer
          description: Maximum PoE budget in watts (null if PoE not supported)
          example: 740
        configurationPorts:
          type: array
          description: Port configuration blocks showing how ports are organized across different modules/slots
          items:
            $ref: '#/components/schemas/ConfigurationPort'

    ConfigurationPort:
      type: object
      description: Port configuration block for a slot/module
      properties:
        slotNumber:
          type: string
          description: Slot number
          example: "1"
        portRange:
          type: string
          description: Port range in this slot
          example: "1-24"
        portType:
          type: string
          description: Type of ports
          example: "1G-copper"
        portCount:
          type: integer
          description: Number of ports
        speed:
          type: string
          description: Port speed
          example: "1G"
        mediaType:
          type: string
          description: Media type
          example: "copper"

    ConfigurablePort:
