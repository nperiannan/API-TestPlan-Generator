                            modelName: "ExtremeWireless AP305C"
                        - deviceId: "AP001234567891"
                          deviceName: "Floor-2-AP-03"
                          site:
                            siteId: "890f9511-f39c-52e5-b827-557766556a2b"
                            siteName: "Branch Office Seattle"
                          model:
