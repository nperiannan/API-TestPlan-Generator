          format: uuid
          description: Unique identifier for the device
        hostname:
          type: string
          description: Hostname of the device
        model:
          type: string
          description: Device model
        deploymentStatus:
          type: string
          description: Deployment status of the device
          enum:
            - deployed
            - deploying
            - draft
            - failed
            - failed_and_rolled_back
            - pending
            - scheduled
            - starts_soon
        deploymentProgress:
          type: integer
          nullable: true
          description: Deployment progress percentage
        scheduledTime:
          type: string
