        createSecondaryDHCPServerGlobal:
          summary: Add Secondary DHCP Server to Global Profile
          description: Add a backup DHCP server to global profile
          value:
            featurePath: "/dhcp-server-feature"
            objectType: "dhcp-server"
            operation: "add"
            objects:
              - type: "dhcp-server"
                operation: "add"
                properties:
                  - name: "priority"
                    type: "number"
                    value: 2
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "192.168.1.11"
                    origin: "Global"
                  - name: "name"
                    type: "string"
                    value: "Secondary-DHCP-Server"
                    origin: "Global"

        # =====================================================================
        # SYSLOG SERVER CONFIGURATION EXAMPLES (Global Profile)
        # Feature Path: /syslog-server-feature
        # Object Type: syslog-server
        # Origin: "Global" for Global Profile objects
        # Source: extreme-intent-syslog-server.yang
        # =====================================================================
        createSyslogServerGlobal:
          summary: Add Syslog Server to Global Profile
          description: |
            Add a syslog server to global profile for centralized logging.
            Required properties: name, server, port, syslog-facility, syslog-severity
          value:
            featurePath: "/syslog-server-feature"
            objectType: "syslog-server"
            operation: "add"
            objects:
              - type: "syslog-server"
                operation: "add"
                properties:
                  - name: "name"
                    type: "string"
                    value: "primary-syslog"
                    origin: "Global"
                  - name: "server"
                    type: "string"
                    value: "192.168.1.100"
                    origin: "Global"
                  - name: "port"
                    type: "number"
                    value: 514
                    origin: "Global"
                  - name: "syslog-facility"
                    type: "enumeration"
                    value: "LOCAL0"
                    origin: "Global"
                  - name: "syslog-severity"
                    type: "enumeration"
                    value: "WARNING"
                    origin: "Global"

        createSyslogServerWithVR:
          summary: Add Syslog Server with Virtual Router
          description: Add a syslog server with VR name for network segmentation
          value:
            featurePath: "/syslog-server-feature"
