  /service-profile/{name}/feature/object/retrieve-v2:
    post:
      operationId: retrieveServiceProfileFeatureObjectsV2
      tags: [ServiceProfiles]
      summary: Retrieve service profile objects within a feature
      description: Retrieves specified objects and its children within a feature specified by featurePath using objectType.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The name of the service profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectRetrieveRequest"
            examples:
              basicRetrieve:
                summary: Basic retrieve by object type within a feature
                value:
                  featurePath: "/virtual-service-feature"
                  objectType: "vlan"
              retrieveWithPagination:
                summary: Retrieve with pagination
                value:
                  featurePath: "/virtual-service-feature"
                  objectType: "vlan"
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 50
              retrieveWithFilters:
                summary: Retrieve with filters and pagination
                value:
                  featurePath: "/virtual-service-feature"
                  objectType: "vlan"
                  paginationQuery:
                    pageNumber: 1
                    pageSize: 20
                  filterQuery:
                    - key: "vlan-type"
                      values: ["vlan"]
                    - key: "enabled"
