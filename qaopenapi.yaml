              required:
                - objectIds
              properties:
                objectIds:
                  type: array
                  minItems: 1
                  description: List of configuration object IDs to resolve together
                  items:
                    type: string
                    format: uuid
                paginationQuery:
                  $ref: "#/components/schemas/PaginationQuery"
                fuzzySearchQuery:
                  $ref: "#/components/schemas/FuzzySearchQuery"
                assignedOnly:
                  type: boolean
