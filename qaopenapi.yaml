            $ref: '#/components/schemas/PortTypeDetail'
        speedCapability:
          type: array
          description: Speed capabilities
          items:
            $ref: '#/components/schemas/SpeedCapability'
        skus:
          type: array
          description: Available SKUs for this device's model/variant
          items:
            $ref: '#/components/schemas/SKUDetail'
        configurablePorts:
          type: array
          description: Configurable port modules
          items:
            $ref: '#/components/schemas/ConfigurablePort'

    SKUResultResponse:
      type: object
      description: Response containing SKU results for queried devices
      properties:
        results:
          type: array
          description: Array of detailed SKU and configuration information for each queried device
          items:
            $ref: '#/components/schemas/SKUResult'

    SKUVariantResponse:
      type: object
      description: Response containing SKU variants
      properties:
        skus:
          type: array
          items:
            $ref: '#/components/schemas/SKUVariant'

    InventoryModelsResponse:
      type: object
      description: Response containing device models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/DeviceModelInfo'

    DeviceModelDetail:
      type: object
      description: A device model with full details (for inventory)
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Model name
          example: "5520-24T"
        displayName:
          type: string
          example: "ExtremeSwitching 5520-24T"
        description:
          type: string
        manufacturer:
          type: string
          example: "Extreme Networks"
        deviceType:
          type: string
