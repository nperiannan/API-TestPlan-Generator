  /configuration-profile/{name}/feature/object/modify:
    post:
      operationId: modifyFeatureObjects
      tags:
        - ConfigurationFeatures
      summary: Add or update configuration objects
      description: |
        Adds new objects or updates existing objects within a feature.
        Use operation=add for new objects, operation=update for existing.
        Use origin="CC" for configuration profile objects.
        
        **Wired Blueprint Feature Paths (from extreme-wired-blueprint.yang):**
        - `/network-feature/interface-feature/port-feature` - Port configuration (extreme-intent-port)
        - `/network-feature/fabric-feature/isis-feature` - IS-IS configuration (extreme-intent-fabric-isis)
        - `/network-feature/fabric-feature/spbm-global-feature` - SPBM Global (extreme-intent-fabric-spbm)
        - `/network-feature/fabric-feature/spbm-instance-feature` - SPBM Instance
        - `/network-feature/fabric-feature/auto-sense-feature` - Auto-Sense (extreme-intent-fabric-auto-sense)
        
        **Note:** VLANs are configured via Service Profile using `/l2-service-feature`, not in Configuration Profile.
      parameters:
        - name: name
          in: path
          required: true
          description: Configuration profile name
          schema:
            type: string
          example: "wired-profile-01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectModifyRequest'
            examples:
              # =====================================================
              # CONFIG PROFILE PORT - CREATE EXAMPLES
              # Feature: /network-feature/interface-feature/port-feature
              # Source: extreme-intent-port.yang
              # =====================================================
              createPortConfig:
                summary: Create port configuration
                description: Add port configuration with admin status and speed
                value:
                  featurePath: "/network-feature/interface-feature/port-feature"
                  objectType: "port"
                  operation: "add"
                  objects:
                    - type: "port"
                      operation: "add"
                      properties:
                        - name: "name"
                          value: "1/1"
                          origin: "CC"
                        - name: "description"
                          value: "Uplink port to distribution switch"
                          origin: "CC"
                        - name: "admin-status"
                          value: "enabled"
                          origin: "CC"
                        - name: "speed"
                          value: "auto"
                          origin: "CC"
                        - name: "duplex"
                          value: "full"
                          origin: "CC"
              
              createMultiplePorts:
                summary: Create multiple port configurations
                description: Add multiple port configurations in batch
                value:
                  featurePath: "/network-feature/interface-feature/port-feature"
                  objectType: "port"
                  operation: "add"
                  objects:
                    - type: "port"
                      operation: "add"
                      properties:
                        - name: "name"
                          value: "1/1"
                          origin: "CC"
                        - name: "admin-status"
                          value: "enabled"
                          origin: "CC"
                    - type: "port"
                      operation: "add"
                      properties:
                        - name: "name"
                          value: "1/2"
                          origin: "CC"
                        - name: "admin-status"
                          value: "enabled"
                          origin: "CC"
              
              # =====================================================
              # CONFIG PROFILE IS-IS - CREATE EXAMPLES
              # Feature: /network-feature/fabric-feature/isis-feature
              # Source: extreme-intent-fabric-isis.yang
              # =====================================================
              createISISConfig:
                summary: Create IS-IS configuration
                description: Configure IS-IS routing protocol settings
                value:
                  featurePath: "/network-feature/fabric-feature/isis-feature"
                  objectType: "isis"
                  operation: "add"
                  objects:
                    - type: "isis"
                      operation: "add"
                      properties:
                        - name: "system-id"
                          value: "0001.0001.0001"
                          origin: "CC"
                        - name: "area-id"
                          value: "49.0001"
                          origin: "CC"
                        - name: "enabled"
                          value: true
                          origin: "CC"
              
              # =====================================================
              # CONFIG PROFILE SPBM - CREATE EXAMPLES
              # Feature: /network-feature/fabric-feature/spbm-global-feature
              # Source: extreme-intent-fabric-spbm.yang
              # =====================================================
              createSPBMConfig:
                summary: Create SPBM global configuration
                description: Configure SPBM fabric settings
                value:
                  featurePath: "/network-feature/fabric-feature/spbm-global-feature"
                  objectType: "spbm-global"
                  operation: "add"
                  objects:
                    - type: "spbm-global"
                      operation: "add"
                      properties:
                        - name: "b-vid"
                          value: 4051
                          origin: "CC"
                        - name: "nickname"
                          value: "1.1.1"
                          origin: "CC"
                        - name: "enabled"
                          value: true
                          origin: "CC"
              
              # =====================================================
              # CONFIG PROFILE - UPDATE EXAMPLES
              # =====================================================
              updatePortDescription:
                summary: Update port description
                description: Modify the description of an existing port
                value:
                  featurePath: "/network-feature/interface-feature/port-feature"
                  objectType: "port"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "port"
                      operation: "update"
                      properties:
                        - name: "description"
                          value: "Updated - Uplink to core switch"
                          origin: "CC"
              
              updatePortAdminStatus:
                summary: Update port admin status
                description: Enable or disable port administratively
                value:
                  featurePath: "/network-feature/interface-feature/port-feature"
                  objectType: "port"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "port"
                      operation: "update"
                      properties:
                        - name: "admin-status"
                          value: "disabled"
                          origin: "CC"
              
              updateISISConfig:
                summary: Update IS-IS configuration
                description: Modify IS-IS routing settings
                value:
                  featurePath: "/network-feature/fabric-feature/isis-feature"
                  objectType: "isis"
                  operation: "update"
                  objects:
                    - id: "b2c3d4e5-f678-9012-bcde-f23456789012"
                      type: "isis"
                      operation: "update"
                      properties:
                        - name: "enabled"
                          value: false
                          origin: "CC"
              
              updateMultiplePorts:
                summary: Update multiple ports
                description: Modify properties of multiple ports in batch
                value:
                  featurePath: "/network-feature/interface-feature/port-feature"
                  objectType: "port"
                  operation: "update"
                  objects:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "port"
                      operation: "update"
                      properties:
                        - name: "description"
                          value: "Updated Port 1/1"
                          origin: "CC"
                    - id: "b2c3d4e5-f678-9012-bcde-f23456789012"
                      type: "port"
                      operation: "update"
                      properties:
                        - name: "description"
                          value: "Updated Port 1/2"
                          origin: "CC"
      responses:
        '200':
          description: Objects modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAPIResponseArray'
              examples:
                createSuccess:
                  summary: Port created successfully
                  value:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                      operation: "create"
                      keys:
                        - name: "object-type"
                          value: "port"
                        - name: "feature-path"
                          value: "/network-feature/interface-feature/port-feature"
                updateSuccess:
                  summary: Port updated successfully
                  value:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                      operation: "update"
                batchSuccess:
                  summary: Multiple ports created
                  value:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      status: "success"
                      operation: "create"
                    - id: "b2c3d4e5-f678-9012-bcde-f23456789012"
                      status: "success"
                      operation: "create"
                    - id: "c3d4e5f6-7890-1234-cdef-345678901234"
                      status: "success"
                      operation: "create"
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'
              examples:
                invalidVLANId:
                  summary: Invalid VLAN ID
                  value:
                    error:
                      code: 400
                      message: "vlan-id-value must be between 1 and 4094"
                duplicateName:
                  summary: Duplicate VLAN name
                  value:
                    error:
                      code: 409
                      message: "VLAN with name 'Data-VLAN-100' already exists"
        '404':
          description: Profile or feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAPIResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchErrorResponse'

  /configuration-profile/{name}/feature/object/delete:
    post:
      operationId: deleteObjectsInConfigurationProfile
      tags:
        - ConfigurationFeatures
      summary: Delete configuration objects
      description: |
        Deletes specified configuration objects from a feature.
        Can delete by:
        - Feature path (all objects under the feature)
        - Specific object IDs
      parameters:
