            - testCaseID: TCXM_1006
              featureName: access-profile
              priority: P2
              automation: Automatable
              type: functional
              description: '[Conflict Detection] Deploy access-profile, simulate out-of-band device change via NOSAPI (deviceValue ≠ previousDeployedValue), verify conflict detected via GET /conflicts'
              isDeploymentTest: true
              steps:
                - name: createaccess-profile
                  description: Create access-profile configuration with name=test-resource, snmp-credential=testValue
                  method: POST
                  api: REST
                  path: /global-profile/feature/object/modify
                  body:
                    name: test-resource
                    snmp-credential: testValue
                  expectedStatus: 201
                  validations:
                    - Verify access-profile created successfully with name=test-resource, snmp-credential=testValue
                  assertions:
                    - type: statusCode
                      expected: 201
                      description: Verify access-profile created successfully with name=test-resource, snmp-credential=testValue
                - name: initialDeploy
                  description: Deploy to device — establishes previousDeployedValue baseline
                  method: POST
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictDetect/devices/deploy
                  pathParams:
                    name: TestProfile-Additional-ConflictDetect
                  body:
                    deployNow: true
                    devices:
                        - test-device-001
                  expectedStatus: 202
                  validations:
                    - Verify HTTP status code is 202
                  assertions:
                    - type: statusCode
                      expected: 202
                - name: checkInitialDeployStatus
                  description: Verify initial deployment completed successfully
                  method: GET
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictDetect/device/test-device-001/deploy/status
                  pathParams:
                    hostName: test-device-001
                    name: TestProfile-Additional-ConflictDetect
                  expectedStatus: 200
                  validations:
                    - Verify HTTP status code is 200
                    - Verify '$.status' equals SUCCESS
                  assertions:
                    - type: statusCode
                      expected: 200
                    - type: jsonPathEquals
                      path: $.status
                      expected: SUCCESS
                  timeout: 300
                - name: simulateOutOfBandChange
                  description: Apply conflicting access-profile value directly on device via NOSAPI — simulates out-of-band change so deviceValue diverges from previousDeployedValue
                  method: GET
                  api: NOSAPI
                  path: /v0/state/policy/access-lists/{acl_name}/counters
                  body:
                    action: modify
                    deviceHostName: test-device-001
                    feature: access-profile
                    properties:
                        name: updated-test-value
                        snmp-credential: updated-test-value
                  expectedStatus: 200
                  validations:
                    - Verify NOSAPI accepted the out-of-band access-profile change on device test-device-001
                  assertions:
                    - type: statusCode
                      expected: 200
                      description: Verify NOSAPI accepted the out-of-band access-profile change on device test-device-001
                - name: getConflicts
                  description: GET conflicts for this device — expect hasConflicts=true because device was changed out-of-band
                  method: GET
                  api: REST
                  path: /configuration-profile/TestProfile-Additional-ConflictDetect/device/test-device-001/conflicts
                  pathParams:
                    hostName: test-device-001
                    name: TestProfile-Additional-ConflictDetect
                  queryParams:
                    detailLevel: detailed
                  expectedStatus: 200
                  validations:
                    - Verify HTTP status code is 200
                    - Verify '$.hasConflicts' equals true
                    - Conflicting feature path is reported
                  assertions:
                    - type: statusCode
                      expected: 200
                    - type: jsonPathEquals
                      path: $.hasConflicts
                      expected: true
                    - type: jsonPathExists
                      path: $.features[0].featurePath
                      description: Conflicting feature path is reported
            - testCaseID: TCXM_1007
              featureName: access-profile
              priority: P1
              automation: Automatable
              type: functional
              description: '[Conflict Resolution CC] access-profile: detect conflict → resolve acceptCloud (cloud wins) → re-deploy → verify cleared'
              isDeploymentTest: true
              steps:
                - name: createaccess-profile
                  description: Create access-profile configuration with name=test-resource, snmp-credential=testValue
                  method: POST
                  api: REST
                  path: /global-profile/feature/object/modify
                  body:
