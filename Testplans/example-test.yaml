featurePath: /network-feature/interface-feature/port-feature
profileType: configuration
test:
    testCaseID: TCXM_1164
    featureName: advanced-port
    priority: P2
    automation: Automatable
    type: scale
    description: Deploy 5 representative advanced-port instances
    scopeType: device
    targetType: device
    deploymentMethod: immediate
    isDeploymentTest: true
    steps:
        - name: createDeploymentScaleInstance1
          description: Create deployment scale instance 1 for advanced-port with enable-stp=true, enable-edge=false, enable-bpdu-protection=false, enable-bpdu-restrict=false, bpdu-recovery-timeout=300
          method: POST
          api: REST
          path: /configuration-profile/{name}/feature/object/modify
          pathParams:
            name: TestProfile
          body:
            featurePath: /network-feature/interface-feature/port-feature
            objectType: advanced-port
            objects:
                - operation: add
                  properties:
                    - name: enable-stp
                      origin: CC
                      type: boolean
                      value: true
                    - name: enable-edge
                      origin: CC
                      type: boolean
                      value: false
                    - name: enable-bpdu-protection
                      origin: CC
                      type: boolean
                      value: false
                    - name: enable-bpdu-restrict
                      origin: CC
                      type: boolean
                      value: false
                    - name: bpdu-recovery-timeout
                      origin: CC
                      type: number
                      value: 300
                  type: advanced-port
            operation: add
          expectedStatus: 201
          validations:
            - Verify advanced-port created successfully with enable-stp=true, enable-edge=false, enable-bpdu-protection=false, enable-bpdu-restrict=false, bpdu-recovery-timeout=300
            - Capture created object ID as OBJECT_ID for later update/delete steps
          assertions:
            - type: statusCode
              expected: 201
              description: Verify advanced-port created successfully with enable-stp=true, enable-edge=false, enable-bpdu-protection=false, enable-bpdu-restrict=false, bpdu-recovery-timeout=300
            - type: jsonPathExists
              path: $[0].id
              captureAs: OBJECT_ID
              description: Capture created object ID as OBJECT_ID for later update/delete steps
