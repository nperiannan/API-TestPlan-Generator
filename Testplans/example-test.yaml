featurePath: /tpme/{serialNumber}/access-profiles
profileType: configuration
test:
    testCaseID: TCXM_1000
    featureName: access-profile
    priority: P1
    automation: Automatable
    type: functional
    description: Create access-profile and schedule deployment to device
    scopeType: device
    targetType: device
    deploymentMethod: scheduled
    isDeploymentTest: true
    steps:
        - name: createaccess-profile
          description: Create access-profile configuration with name=test-resource, snmp-credential=testValue
          method: POST
          api: REST
          path: /global-profile/feature/object/modify
          body:
            name: test-resource
            snmp-credential: testValue
          expectedStatus: 201
          validations:
            - Verify access-profile created successfully with name=test-resource, snmp-credential=testValue
          assertions:
            - type: statusCode
              expected: 201
              description: Verify access-profile created successfully with name=test-resource, snmp-credential=testValue
        - name: scheduleDeploymentTodevice
          description: Schedule deployment to device at 2026-05-01T03:30:49Z
          method: POST
          api: REST
          path: /configuration-profile/TestProfile-Additional/devices/deploy
          pathParams:
            name: TestProfile-Additional
          body:
            deployAt: "2026-05-01T03:30:49Z"
            devices:
                - test-device-001
            timezone: UTC
          expectedStatus: 202
          validations:
            - Verify HTTP status code is 202
          assertions:
            - type: statusCode
              expected: "202"
